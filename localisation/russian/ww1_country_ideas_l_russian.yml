 army_mutiny_desc: "Поскольку погибло так много людей, некоторые части армии восстают и отказываются участвовать в том, что они считают самоубийственными операциями. Если не принять меры должным образом, это может привести к чему-то очень тревожному."
 schlieffen_desc: "План Шлиффена был разработан в ответ на растущую мировую напряженность после Первой мировой войны. План включал в себя нападение на Бельгию, тем самым угрожая сердцу самой Франции."
