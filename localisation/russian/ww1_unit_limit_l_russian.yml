 unit_limit_label: "§HМаксимальное количество поддерживаемых батальонов§!" #NT!
 unit_limit_desc: "Каждая страна имеет возможность содержать только определенное количество отдельных военных батальонов, прежде чем ее экономика и инфраструктура начнут бороться за их содержание.\n\nМаксимальное количество поддерживаемых подразделений основано на общей численности населения страны и принадлежащих ей штатов, а затем умножается на общий уровень индустриализации страны.\n\n§L - База из общей численности населения: [?base_population|G0][unit_limit_noncore_population][unit_limit_puppet_base][unit_limit_crownland_population_bonus]\n - База из принадлежащих ей штатов: [?base_states|G0][unit_limit_crownland_state_bonus]\n - Общая база: [?base_units|G0]\n\n - Модификатор индустриализации: [?industry_factor|H%][unit_limit_modifier_was_capped][?base_population|G0]0[?base_population|G0]1[?base_population|G0]2[?base_population|G0]3[?base_population|G0]4[?base_population|G0]5[?base_population|G0]6[?base_population|G0]7[?base_population|G0]8[?base_population|G0]9[unit_limit_noncore_population]0[unit_limit_noncore_population]1[unit_limit_noncore_population]2[unit_limit_noncore_population]3[unit_limit_noncore_population]4[unit_limit_noncore_population]5[unit_limit_noncore_population]6\n\n ОКОНЧАТЕЛЬНЫЙ ИТОГ: [unit_limit_noncore_population]7\n\nОбратите внимание, что изменения вышеперечисленного могут занять до одной игровой недели, прежде чем они будут отражены в расчетах.[unit_limit_noncore_population]8[unit_limit_noncore_population]9" #NT!
  
 unit_limit_desc_fake_intel: "(§HПоддельные разведывательные дивизии§! не учитываются в лимите батальона)" #NT!
  
 unit_limit_desc_above_limit: "\n\n--------------\n\n§RВ настоящее время мы превысили свои возможности, и единственный способ облегчить давление на нашу страну — это вывести некоторые из наших дивизий.§!\n\nОрганизация дивизии: [?mobilisation_penalty_var|+=%1]\nКоэффициент потребления поставок: [?mobilisation_penalty_var_positive|-=%]\nПроизводство завода: [?mobilisation_penalty_var|+=%]\nВремя обучения: [?mobilisation_penalty_var_positive|-=%]\nМоральный дух армии: [?mobilisation_penalty_var|+=%1]\nУсиление командной власти: [?mobilisation_penalty_var|+=%1]\nСкорость мобилизации: [?mobilisation_penalty_var|+=%1]" #NT!
  
 unit_limit_noncore_population_desc: "\n (§H10%§! из неосновных штатов: [?non_core_base|H1])" #NT!
 unit_limit_puppet_base_desc: "\n (§H20%§! из марионеточных состояний низкого уровня: [?puppet_base|H1])" #NT!
  
 unit_limit_crownland_population_bonus_desc: "\n ([?crownland_base_units|H0] из §HCrownlands§!)" #NT!
