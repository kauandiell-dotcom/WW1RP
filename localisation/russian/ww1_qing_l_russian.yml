 # ww1_qing.423.t: "Чонг возвращается из США" #NT!
 # ww1_qing.423.d: "Во время визита Чонга Фатта Тзе в США он узнал много нового о быстрорастущей промышленности страны, посетив различные города и крупные фабрики молодой страны, стремясь повторить ее успех в своих собственных деловых предприятиях. Теперь, вернувшись, он поделился некоторыми из этих советов по индустриализации США с нашим правительством" #NT!
 # ww1_qing.423.a: "Полезные знания для нашей отрасли!" #NT!
