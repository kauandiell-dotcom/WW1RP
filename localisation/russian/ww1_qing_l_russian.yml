l_russian:
 #qing rework 
 #focus 
 QIN_equal_cabinet: "Ответственный кабинет" #NT!
 QIN_equal_cabinet_desc: "Наш кабинет должен помочь модернизации нашей страны, а не организовывать ее падение в отсталое варварство! Кабинет министров должен нести ответственность перед Парламентом за обеспечение отсутствия коррупции в этом процессе." #NT!
 QIN_cave_to_parliament: "Создать парламент" #NT!
 QIN_cave_to_parliament_desc: "Консультативный совет требует создания парламента к 1911 году. Мы должны уступить их требованиям, чтобы выжить." #NT!
 QIN_court_appeasement: "Прерогативы маньчжурского двора" #NT!
 QIN_court_appeasement_desc: "Большой совет всегда нам помогал. Что значит, они коррумпированы? Кыш, просители!" #NT!
 QIN_restore_military_production: "Восстановить военное производство" #NT!
 QIN_restore_military_production_desc: "После Боксерского восстания нам запретили покупать иностранное оружие. Этот запрет уже истек, но мы стали значительно слабее. Мы должны действовать быстро." #NT!
 QIN_pacify_beiyang_army: "Усмирить армию Бэйян" #NT!
 QIN_pacify_beiyang_army_desc: "Армия Бэйяна по-прежнему оказывает сильное влияние на нашу политику, создавая трудности в твердом утверждении нашего контроля. Пришло время решить, как мы будем с ними обращаться." #NT!
 QIN_shanghai_shipyards: "Шанхайские верфи" #NT!
 QIN_shanghai_shipyards_desc: "Китайское море снова будет находиться под контролем китайского флота." #NT!
 QIN_coastal_defense: "Береговая оборона" #NT!
 QIN_coastal_defense_desc: "Наш флот невероятно устарел и не может обеспечить надлежащую оборону побережья. Дальнейшее расширение военно-морской промышленности поможет решить эту проблему." #NT!
 QIN_education_reform: "Реформа образования" #NT!
 QIN_education_reform_desc: "Образование часто недоступно для крестьянства. Необходимо предпринять шаги, чтобы гарантировать, что большее большинство сможет учиться в наших великих учреждениях." #NT!
 QIN_rebuild_beiyang_fleet: "Восстановить флот" #NT!
 QIN_rebuild_beiyang_fleet_desc: "По мере расширения наших мощностей пришло время обеспечить восстановление и оснащение нашего флота лучшими достижениями в области военно-морских вооружений и технологий." #NT!
 QIN_nanjing_arsenal: "Нанкинский Арсенал" #NT!
 QIN_nanjing_arsenal_desc: "Учитывая рост напряженности во всем мире, расширение наших арсеналов не исключено." #NT!
 QIN_japanese_manufacturer: "Японский производитель" #NT!
 QIN_japanese_manufacturer_desc: "Быстрая индустриализация Японии имела большой успех, в то время как наш собственный флот отстал. Пришло время это изменить." #NT!
 QIN_reform_ministries: "Реформа министерств" #NT!
 QIN_reform_ministries_desc: "Имперский кабинет был хорошим началом, но для завершения нашего перехода мы должны назначить министров на ключевые должности, а не полагаться на один кабинет." #NT!
 QIN_appeal_to_the_militarists: "Обращение к милитаристам" #NT!
 QIN_appeal_to_the_militarists_desc: "Вместо того, чтобы сражаться с милитаристами и вызывать еще больше потерь, давайте убедим их присоединиться к нам. Среди них есть блестящие умы, которые хорошо послужат нашей армии." #NT!
 QIN_constitutional_monarchy: "Реформация монархии" #NT!
 QIN_constitutional_monarchy_desc: "Император достаточно стар, чтобы быть коронованным, и мы преуспели в нашем переходе. Слава Сюаньтуну!" #NT!
 QIN_cooperation_with_dominions: "Сотрудничество с Доминионами" #NT!
 QIN_cooperation_with_dominions_desc: "Британские доминионы теперь наши друзья." #NT!
 QIN_loyal_parliament: "Лояльный парламент" #NT!
 QIN_loyal_parliament_desc: "После предательства нескольких наших членов парламента необходимо обеспечить их лояльность." #NT!
 QIN_nation_recovery: "Ранняя индустриализация" #NT!
 QIN_nation_recovery_desc: "Мы должны выплатить последние репарации нашим западным врагам." #NT!
 QIN_chinese_labour_corps: "Китайский трудовой корпус" #NT!
 QIN_chinese_labour_corps_desc: "Британские колонии остро нуждаются в рабочих. Если мы предложим отправить некоторых наших преступников, чтобы помочь им, это может привести к лучшему сотрудничеству между нашими странами." #NT!
 QIN_foreign_loan: "Четырехкратный кредит на электроэнергию" #NT!
 QIN_foreign_loan_desc: "После долгих переговоров несколько великих держав согласились предоставить нам хороший кредит, чтобы помочь нам построить наши железные дороги!" #NT!
 QIN_mandate_of_heaven: "Мандат Небес" #NT!
 QIN_mandate_of_heaven_desc: "Мы вернули себе Мандат Небес. Мы снова имеем поддержку народа, и достаточные реформы преобразовали династию в ту силу, которой она была раньше. Пришло время сбросить оковы колониального гнета и утвердить наше законное место в мире." #NT!
 QIN_xiyu_conquest: "Xiyu Conquest" #NT!
 QIN_xiyu_conquest_desc: "Император и его Империя отомстят за горькую потерю в битве при Таласе!" #NT!
 QIN_aksai_kachin: "Спрос Аксай-Качин" #NT!
 QIN_aksai_kachin_desc: "Дальняя южная граница империи была незаконно втянута в так называемое Британское Радж. Император не должен игнорировать ни одного своего подданного под иностранным правлением с железным кулаком!" #NT!
 QIN_outer_manchurian_conquest: "Императорская Маньчжурия" #NT!
 QIN_outer_manchurian_conquest_desc: "Никакая другая "империя" не легитимирована в Маньчжурии. Только Китайская империя под властью чжурчжэней будет там вечно!" #NT!
 QIN_southern_expedition_of_dragon: "Южная экспедиция" #NT!
 QIN_southern_expedition_of_dragon_desc: "Вьетнамцы произошли от байюэ. Народ байюэ — китайцы. Так что вьетнамцы — все китайцы. И каждый китаец будет находиться под имперским правлением." #NT!
 QIN_prince_qing_cabinet: "Кабинет принца Цина" #NT!
 QIN_prince_qing_cabinet_desc: "Принц Цин возглавит новый императорский кабинет. Мы должны доказать народу, что мы действительно реформируем." #NT!
 QIN_protect_the_dynasty: "Защитить династию Цин" #NT!
 QIN_protect_the_dynasty_desc: "За Императора!" #NT!
 QIN_continue_qing_new_reforms: "Продолжение новых реформ Цин" #NT!
 QIN_continue_qing_new_reforms_desc: "Разгромив республиканцев, мы сможем завершить наши реформы и легитимизировать династию." #NT!
 QIN_advisory_council: "Консультативный совет" #NT!
 QIN_advisory_council_desc: "Нужны срочные реформы, и принц Чун начал процесс перехода династии к конституционной монархии. Наша поддержка этого движения жизненно важна." #NT!
 QIN_fight_against_famine: "Борьба с голодом" #NT!
 QIN_fight_against_famine_desc: "Пока дворянство живет в роскоши, крестьяне голодают. Необходимо приложить усилия для восстановления гражданского хозяйства. Народ это наверняка одобрит." #NT!
 QIN_united_china: "Объединенный Китай" #NT!
 QIN_united_china_desc: "Китай рухнул. Мелкие военачальники и их вотчины терзают земли. Пора поставить их на место." #NT!
 QIN_restore_the_nation: "Восстановить нацию" #NT!
 QIN_restore_the_nation_desc: "Синьхайская революция разрушила Китай до основания. Каждый должен внести свой вклад в исправление и восстановление страны." #NT!
 QIN_militia_reorganization: "Реорганизация милиции" #NT!
 QIN_militia_reorganization_desc: "Китайские ополченцы дезорганизованы. Чтобы бороться с этим, мы включим их в состав армии и обучим их, чтобы они стали эффективными боевыми единицами." #NT!
 QIN_economic_stabilization: "Экономическая стабилизация" #NT!
 QIN_economic_stabilization_desc: "Хаос революции привел к экономическому хаосу. Исправление этого должно стать нашей первой задачей." #NT!
 QIN_land_reform: "Земельная реформа" #NT!
 QIN_land_reform_desc: "Часть крестьянства продолжает использовать неэффективные и отсталые методы в своих занятиях. Вдобавок к этому некоторые землевладельцы недостаточно используют свою собственность. Комплекс реформ должен это исправить." #NT!
 QIN_pay_off_debts: "Погасить долги" #NT!
 QIN_pay_off_debts_desc: "Благодаря растущей прибыли и экономическим реформам мы в состоянии погасить любые непогашенные долги." #NT!
 QIN_recover_transport_system: "Восстановить систему снабжения" #NT!
 QIN_recover_transport_system_desc: "Наша армия не может эффективно сражаться из-за ущерба, нанесенного нашей инфраструктуре. Теперь, когда экономика начинает стабилизироваться, мы можем направить часть финансирования на решение этой проблемы." #NT!
 QIN_unite_provincial_command: "Объединенное провинциальное командование" #NT!
 QIN_unite_provincial_command_desc: "Региональные военачальники взяли под контроль свои провинции. Однако это не значит, что мы не сможем склонить их к нашему образу мышления." #NT!
 QIN_pave_way_for_industrialization: "Проложенный путь к индустриализации" #NT!
 QIN_pave_way_for_industrialization_desc: "Наше сотрудничество с иностранными державами наконец-то проложило нам путь к началу индустриализации!" #NT!
 QIN_south_provinces: "Индустриализация юга" #NT!
 QIN_south_provinces_desc: "Наши южные провинции остаются бесплодными полосами горной земли. Необходимо провести достаточную подготовку для подготовки к возможному строительству." #NT!
 QIN_north_provinces: "Маньчжурская индустриализация" #NT!
 QIN_north_provinces_desc: "Большая часть Маньчжурии остается сельскохозяйственными угодьями и крестьянством. Но при наличии достаточных инвестиций мы можем это изменить." #NT!
 QIN_central_provinces: "Центральная индустриализация" #NT!
 QIN_central_provinces_desc: "Большинство наших центральных земель остаются неразвитыми, несмотря на огромные возможности, которые ждут нас. Давайте перехватим инициативу." #NT!
 QIN_south_factories: "Южные фабрики" #NT!
 QIN_south_factories_desc: "Теперь, когда все приготовления завершены, мы можем приступить к работе над многочисленными строительными предложениями." #NT!
 QIN_central_factories: "Центральные фабрики" #NT!
 QIN_central_factories_desc: "Благодаря улучшению инфраструктуры мы можем сосредоточить усилия на улучшении наших центральных районов." #NT!
 QIN_manchu_factories: "Маньчжурские фабрики" #NT!
 QIN_manchu_factories_desc: "Фермеры и крестьяне Маньчжурии должны внести свой вклад в помощь нашей индустриализации." #NT!
 QIN_split_the_tongmenghui: "Разделение реки Тунмэнхуэй" #NT!
 QIN_split_the_tongmenghui_desc: "Неудача Тунмэнхуэй свергнуть нас в прошлый раз значительно усилила антисолнечную фракцию в Тунмэнхуэй. Мы должны использовать наших агентов, чтобы расширить этот раскол." #NT!
 QIN_mislead_the_tongmenghui: "Кампания по обману" #NT!
 QIN_mislead_the_tongmenghui_desc: "Мы будем использовать наших агентов, чтобы задержать революцию, заставив Тунмэнхуэй поверить в ложные истины." #NT!
 QIN_secret_tongmenghui_sabotage: "Координация Саботаж" #NT!
 QIN_secret_tongmenghui_sabotage_desc: "Наша тайная полиция позаботится о том, чтобы Тунмэнхуэй не смог эффективно организовать боевые силы для противостояния нашей армии!" #NT!
 QIN_beijing_arsenal: "Пекинский Арсенал" #NT!
 QIN_beijing_arsenal_desc: "Нам нужно улучшить наше производство, чтобы защитить нашу страну от угроз. Наша столица — идеальное место, чтобы начать это." #NT!
 QIN_imperial_bonds: "Имперские облигации" #NT!
 QIN_imperial_bonds_desc: "Наша легитимность возросла до такой степени, что теперь мы можем продавать «имперские облигации» вместо наших активов напрямую." #NT!
 QIN_utilize_bribery_desc: "Коррупция может быть плоха для людей, но брать взятки необходимо для нашей страны. Долгое время в истории Китая коррупция использовалась как инструмент, и мы не можем остановиться сейчас." #NT!
 QIN_utilize_bribery: "Вымогательство взяток" #NT!
 QIN_village_mechanization: "Механизация села" #NT!
 QIN_village_mechanization_desc: "Большинство жителей деревни не решаются принять новые технологии и методы. Мы должны начать масштабную программу индустриализации в этой сельской местности!" #NT!
 QIN_modern_staff: "Современный персонал" #NT!
 QIN_modern_staff_desc: "Немцы, особенно Пруссия, славятся своей армией. Нам следует следовать их примеру." #NT!
 QIN_purchase_of_machines: "Покупка машин" #NT!
 QIN_purchase_of_machines_desc: "Хотя у нас самые лучшие намерения по модернизации, у нас катастрофически не хватает возможностей сделать это из-за устаревшего оборудования. Британцы предложили нам продать часть своих машин, чтобы оживить нашу промышленность." #NT!
 QIN_boxer_treaty: "Договор боксера" #NT!
 QIN_boxer_treaty_desc: "Наше сотрудничество с иностранной державой принесло нам огромную пользу, а им — большую. Однако несколько неравноправных договоров препятствуют дальнейшему сотрудничеству и являются ненужным напоминанием об унизительном прошлом. Пора снять эти ограничения!" #NT!
 QIN_appease_the_colonialists: "Умиротворить колонизаторов" #NT!
 QIN_appease_the_colonialists_desc: "В настоящее время нам приходится идти на некоторые жертвы, чтобы платить иностранцам, но это улучшит наши отношения с ними, а это нам необходимо, если мы хотим привлекать инвестиции." #NT!
 QIN_german_manufacturer: "Подойти к немцам" #NT!
 QIN_german_manufacturer_desc: "Немцы добились больших успехов в вооружении. Мы должны обратиться к ним за помощью." #NT!
 QIN_british_manufacturer: "Пригласить британских производителей" #NT!
 QIN_british_manufacturer_desc: "Если мы хотим когда-либо вернуть себе престиж, мы должны отбросить свою гордость и обратиться за помощью к тем, кто нас ослабил." #NT!
 QIN_hanyang: "Заводы Ханьяна" #NT!
 QIN_hanyang_desc: "Благодаря нашим переговорам немцы готовы открыть заводы по производству своего оружия." #NT!
 QIN_mauser_contract: "Контракт Маузер" #NT!
 QIN_mauser_contract_desc: "Нам удалось договориться о лицензии на немецкое оружие. Мы не будем терять времени и начнем его производить." #NT!
 QIN_chinese_labour_corps2: "Китайский трудовой корпус" #NT!
 QIN_chinese_labour_corps2_desc: "Западные страны остро нуждаются в рабочих. Если мы предложим отправить некоторых наших преступников, чтобы помочь им, это может привести к лучшему сотрудничеству между нашими странами." #NT!
 QIN_aviation: "Внутренняя авиация" #NT!
 QIN_aviation_desc: "Несмотря на наши усилия, мы крайне неопытны в ведении воздушного боя. Британцы готовы прислать нам несколько своих истребителей." #NT!
 ###regular 
 QIN_army_westernization: "Вестернизация армии" #NT!
 QIN_army_westernization_desc: "Это будет «Новая» Новая армия Китая." #NT!
 QIN_the_armies_of_warlords: "Армии военачальников" #NT!
 QIN_the_armies_of_warlords_desc: "Китайская армия не едина и не подчиняется центру. Необходимо в этой ситуации сформировать собственный штаб." #NT!
 QIN_invite_military_advisers: "Пригласить военных советников" #NT!
 QIN_invite_military_advisers_desc: "Только европейцы знают, как сформировать европейскую армию." #NT!
 QIN_recovery_of_naval_infrastructure: "Восстановление военно-морской инфраструктуры" #NT!
 QIN_recovery_of_naval_infrastructure_desc: "Это только начало восстановления флота." #NT!
 QIN_destroyers_fleet: "Эсминцы Флота" #NT!
 QIN_destroyers_fleet_desc: "Торпедные катера и патрули для Великой Цин!" #NT!
 QIN_admiralty: "Адмиралтейство" #NT!
 QIN_admiralty_tt: "Открывает §YВысших начальников флота§!." #NT!
 QIN_admiralty_desc: "Кто умеет плавать?" #NT!
 QIN_marine_engineering: "Увеличить финансирование ВМС" #NT!
 QIN_marine_engineering_desc: "Недостаточно восстановить флот. Наш флот должен быть современным и организованным. пора поучиться на опыте Японии и модернизировать наш флот, начав с увеличения его бюджета" #NT!
 QIN_submarine_fleet: "Подводный Флот" #NT!
 QIN_submarine_fleet_desc: "Нам нужно спросить американцев, как их корабли плавают под водой, чтобы наши не тонули." #NT!
 QIN_maneuverable_fleet: "Маневренный флот" #NT!
 QIN_maneuverable_fleet_desc: "Флот должен быть многофункциональным." #NT!
 QIN_dreadnought_fever: "Лихорадка дредноута" #NT!
 QIN_dreadnought_fever_desc: "Большие корабли необходимы" #NT!
 QIN_domestic_fleet_doctrine: "Доктрина отечественного флота" #NT!
 QIN_support_corps: "Корпус поддержки" #NT!
 QIN_support_corps_desc: "Европейцы давно отказались от отсталых пехотных формирований. Нашим современным армиям понадобится поддержка, чтобы сражаться на современных полях сражений." #NT!
 QIN_towed_artillery: "Тайюаньская артиллерия" #NT!
 QIN_towed_artillery_desc: "Артиллерия решает исход войны." #NT!
 QIN_send_officers_to_military_schools: "Отправить офицеров в военные училища" #NT!
