 # ww1_qing.420.d: "Дуаньфан, член «Белого знамени», был отправлен в Ханькоу после того, как Движение защиты железных дорог вспыхнуло из-за национализации железных дорог. Прибыв туда, он взял под контроль Новую армию Хубэя, а после того, как Чжао был отстранен от власти в Сычуани, стал временно исполняющим обязанности губернатора. Однако после того, как новая армия взбунтовалась, офицер по имени Лю Ифэн убил Дуаньфана, что стало частью общей волны антиманьчжурского насилия во время революции." #NT!
 # ww1_qing.420.a: "Уничтожьте мятежников!" #NT!
  
 ww1_qing.419.t: "Наньянская промышленная выставка 1910 г." #NT!
 ww1_qing.419.d: "5 июня наконец открылась промышленная выставка в Наньяне 1910 года. Дуаньфан, генерал-губернатор Лянцзяна, и Чэн Цитай, губернатор провинции Цзянсу, внесли в суд предложение, в котором предлагалось провести международную выставку в Китае. Это официальная ярмарка, поддерживаемая судом. \n\nДля выставки выделен участок площадью около 41 акра недалеко от Сан Пай Лу. Вдоль главной оси дороги расположено несколько выставочных зданий, в том числе Административное здание, Здание изящных искусств, Сельскохозяйственное здание, Транспортное здание, Здания для иностранных выставок, а затем несколько зданий для китайских провинций." #NT!
 ww1_qing.419.a: "Хороший!" #NT!
  
 ww1_qing.412.t: "Генерал Лянби убит!" #NT!
 ww1_qing.412.d: "Когда Лянби был дома, на него напал террорист-смертник. Террористом-смертником был Пэн Цзячжэнь, член Пекинского общества Тунмэнхуэй, и он напал на Лянби, когда тот вышел из отеля. Террорист был ранен в голову осколком и умер мгновенно. Нога Лянби была тяжело ранена, и позже он скончался от полученных травм, только назвав нападавшего «странным человеком». Возможно, расширение императорской гвардии могло бы предотвратить это?" #NT!
 ww1_qing.412.a: "Эти проклятые революционеры!" #NT!
  
 ww1_qing.411.t: "Ушел из жизни Шэнь Цзябэнь" #NT!
 ww1_qing.411.d: "Великий реформатор права Шэнь Цзябэнь мирно скончался у себя дома! Он оставил после себя огромное наследие правовых реформ, которые произвели революцию в законодательстве нашей страны." #NT!
 ww1_qing.411.a: "Его реформы будут помнить" #NT!
  
 ww1_qing.403.t: "Британцы отвергают предложение Лугарда!" #NT!
 ww1_qing.403.d: "Британцы заявили, что считают Вэйхайвэй стратегически важным городом, и отклонили наше предложение." #NT!
 ww1_qing.403.a: "Отлично" #NT!
  
 ww1_qing.402.t: "Британцы принимают наше предложение" #NT!
 ww1_qing.402.d: "Было много обсуждений по поводу нашего предложения, но соглашение было достигнуто. Вчера в полдень флаг британского Вэйхайвэя был спущен в последний раз, и британские администраторы отправились в Гонконг" #NT!
 ww1_qing.402.a: "Наконец-то империалисты покинули нашу землю?" #NT!
  
 ww1_qing.401.t: "Предложение Лугарда" #NT!
 ww1_qing.401.d: "Сэр Фредерик Лугард, губернатор Гонконга, предложил нашему правительству заключить сделку с [QIN.GetNameDef]. В обмен на Вэйхайвэй наш контроль над Гонконгом будет продлен на неопределенный срок вместо 99 лет. [QIN.GetName] уже согласились, и нам решать." #NT!
 ww1_qing.401.a: "Для нас это звучит вполне нормально" #NT!
 ww1_qing.401.b: "Не стоит того." #NT!
 QIN_effect_lugard_proposal: "В обмен на возвращение Вэйхайвэя мы навсегда признаем британский контроль над Гонконгом." #NT!
  
 ww1_qing.382.t: "Инцидент в Пианме" #NT!
 ww1_qing.382.d: "14 декабря британцы отправили войска в Пьянма, пограничный город между Юньнанью и Британской Бирмой. Губернатор Юньнани Ли Цзинси хочет, чтобы мы помогли вытеснить этот небольшой экспедиционный отряд. Должны ли мы помочь?" #NT!
 ww1_qing.382.a: "Он сам по себе..." #NT!
 ww1_qing.382.b: "Пришлите войска из Сычуани." #NT!
  
 ww1_qing.378.t: "Наместник Мин-чжэ совершает самоубийство" #NT!
 ww1_qing.378.d.2: "Суншоу долгое время был верным губернатором нашей династии, переключаясь между управлением Фучжоу и должностью министра промышленности. Его долгая служба вознаградила его ролью вице-короля Мин-чжэ (Фуцзянь, Чжэцзян). Однако, когда революционеры приблизились к провинции, а гарнизон Фуцзянь взбунтовался, он потерпел поражение в битве, и провинция была потеряна. Унижение, по-видимому, было слишком сильным, и Суншоу проглотил золото, чтобы совершить самоубийство.\n\nСуншоу был верным и мягким губернатором, всегда снисходительным к своим гражданам. Нам нужно будет вскоре найти нового вице-короля." #NT!
 ww1_qing.378.d: "Суншоу долгое время был верным губернатором нашей династии, переключаясь между управлением Фучжоу и должностью министра промышленности. Его долгая служба вознаградила его ролью вице-короля Мин-чжэ (Фуцзянь, Чжэцзян). Однако недавние стрессы, похоже, оказались для него слишком сильны, и он проглотил золото, чтобы совершить самоубийство. \n\nСуншоу был верным и мягким губернатором, всегда снисходительным к своим гражданам. Нам нужно будет вскоре найти нового вице-короля." #NT!
 ww1_qing.378.a: "Пора начать думать о его замене." #NT!
  
 ww1_qing.374.t: "Zhang Mingqi becomes Viceroy of Liangguang" #NT!
 ww1_qing.374.d: "Лянгуан, наш самый южный вице-король, состоящий из Гуанси и Гуандуна, теперь получил своего нового губернатора Чжан Минци. Его восхождение во многом было обусловлено вмешательством принца Цина (Икуана), и за этим стоит много подозрений в коррупции. В любом случае, теперь он губернатор провинции, и мы желаем ему всего наилучшего." #NT!
 ww1_qing.374.a: "Поздравления" #NT!
  
 ww1_qing.366.t: "Вице-король Сычуани" #NT!
 ww1_qing.366.d: "Чжао Эрсюнь был назначенным губернатором Сычуани с 1907 года, хотя у него также есть обязанности в Хугуане, где он основал юридическую школу Хубэй. В любом случае, его стабильное управление привело к тому, что он недавно был назначен на удобную должность вице-короля трех северо-восточных провинций в Маньчжурии.\n\nОднако его преемник, его брат Чжао Эрфэн, известный как «Чжао Мясник», ответственный за подавление тибетского восстания 1905 года, часто критикуется как безжалостный. Когда он руководил подавлением восстания, он, как сообщается, приказал снести монастырь Батанг, использовать священные тексты войсками в качестве стелек для обуви и массово убивать тибетцев. Во времена революции, можем ли мы действительно рисковать этим человеком, отвечающим за Сычуань?" #NT!
 ww1_qing.366.a: "Отменить решение суда, Чжао Эрсюнь должен остаться" #NT!
 ww1_qing.366.b: "Чжао Эрфэн может стать новым губернатором" #NT!
  
 ww1_qing.353.t: "Великая маньчжурская чума" #NT!
 ww1_qing.353.d: "То, что кажется чрезвычайно смертельной болезнью, опустошает Маньчжурию, поражая все города к северу от Пекина. Болезнь, похоже, имеет почти 100% летальность. Несколько врачей уже отправились в этот район, чтобы помочь с медицинскими усилиями, хотя многие умерли. Врач, прошедший обучение в Кембридже, У Лиен-дэ возглавляет китайские усилия по прекращению чумы и пропагандирует карантин и ношение тканевых масок." #NT!
 ww1_qing.353.a: "Отправьте как можно больше врачей!" #NT!
 ww1_qing.353.b: "Просто убедитесь, что мы не встанем у него на пути." #NT!
 ww1_qing.353.c: "Карантин? Маски для лица? Какой радикальный бред!!" #NT!
  
 ww1_qing.347.t: "Иностранное признание" #NT!
 ww1_qing.347.d: "После падения Цин ни одна другая нация не может претендовать на звание китайской нации, и иностранные державы решили признать нас законным правительством Китая. К сожалению, это означает, что их неравноправные договоры теперь тоже на наших плечах..." #NT!
 ww1_qing.347.a: "Опять нет!" #NT!
  
 ww1_qing.316.t: "Императору нужны очки" #NT!
 ww1_qing.316.d: "Сэр Реджинальд Джонстон недавно обратился в суд. После долгого запутанного перевода выясняется, что у императора «ошибочное зрение» и ему нужны «очки». По-видимому, император прошел визуальный осмотр у одного из друзей наставника, западного врача.\n\n Суд возмущен тем, что наставник предполагает, что император несовершенен, и говорит, что божественному императору не нужны такие земные модификации. Цзайфэн, отец Пуи, сказал, что у императора не может быть плохого зрения, поскольку это невозможно для сына небес. Тем не менее, сэр Реджинальд Джонстон необычайно настойчив, говоря, что это существенная потребность." #NT!
 ww1_qing.316.a: "Репетитор прав." #NT!
 ww1_qing.316.b: "Ха! Император божественен и не нуждается в таких «очках»." #NT!
  
 ww1_qing.311.t: "Пекинская мирная конференция [GetYear]" #NT!
 ww1_qing.311.d: "После нашего поражения в Первой мировой войне великие державы предъявили нам требования взять нашу землю под свою защиту и установить концессии." #NT!
 ww1_qing.311.a: "У нас нет выбора..." #NT!
  
 ww1_qing.296.t: "Фэн Гочжан предлагает подавить революцию" #NT!
 ww1_qing.296.d: "За солидную сумму генерал Бэйян Фэн Гочжан предлагает привести свою армию, чтобы подавить революцию. Многие из консерваторов, придерживающихся жесткой линии и не доверяющих Юань Шикаю, поддерживают этот путь и хотят принять его сделку." #NT!
 ww1_qing.296.b: "Это слишком рискованно." #NT!
 ww1_qing.296.a: "Нам нужна его помощь." #NT!
  
 ww1_qing.292.t: "Император издевается над евнухами" #NT!
 ww1_qing.292.d: "Последовательно, император все больше и больше издевался над евнухами, которые были его слугами в запретном городе. Постоянно избалованный и почитаемый, император вскоре осознал абсолютную власть, которой он обладал, и часто избивал своих евнухов за самые мелкие проступки. Поскольку все его прихоти были удовлетворены, и никто никогда не говорил ему «нет», император превратился в садистского мальчика, который любит, чтобы его евнухов пороли.\n\nВ одном случае император хотел вознаградить евнуха, который устроил ему кукольное представление, тортом, наполненным железными начинками, и его отговорили только с большим трудом." #NT!
 ww1_qing.292.a: "Император не может быть подвергнут сомнению" #NT!
 ww1_qing.292.b: "Дисциплинируйте мальчика." #NT!
  
 ww1_qing.289.t: "Последствия неудавшегося убийства" #NT!
 ww1_qing.289.d: "В марте 1910 года Ван Цзинвэй, член Тунмэнхуэй, стремился поднять популярность среди населения против Цин. Поскольку их моральный дух был на рекордно низком уровне после нескольких неудавшихся революций с 1905 года, планировалось убийство принца Чуня, или Цзайфэна, отца императора Пуи и нынешнего регента, при этом Ван Цзинвэй предлагал пожертвовать своей жизнью, взорвав бомбу.\n\nВ то время как Пуи безопасно проживает в стенах Запретного города, его отец, регент Цзайфэн, часто путешествует между своим особняком и дворцом. Ван намеревался взорвать бомбу на мосту между ними, чтобы убить Цзайфэна и обезглавить императорский двор.\n\nЕго план был сорван после того, как бомба была обнаружена. Сначала подозревали, что инцидент был результатом дворцовой интриги, возможно, организованной Икуаном, недовольным ролью Цзайфэна в качестве регента. Однако вскоре следователи настигли Вана и схватили его. Теперь единственный вопрос: какова его судьба?\n\nКраткое содержание: Революционер Тунмэнхуэй Ван Цзинвэй пытается убить принца-регента Цзайфэна, терпит неудачу и попадает в плен. Каково его наказание?" #NT!
 ww1_qing.289.a: "Запланировать выполнение" #NT!
 ww1_qing.289.b: "Цзайфэн смягчает приговор пожизненным заключением" #NT!
  
 ww1_qing.268.t: "Смерть вдовствующей императрицы Лунъюй" #NT!
 ww1_qing.268.d: "Вдовствующая императрица Лунъюй была императрицей императора Гуансюя, предыдущего императора до Сюаньтуна. Она помогала шпионить за предыдущим императором для Цыси и помогла заблокировать реформу 100 дней в 1898 году. Она усыновила Пуи после того, как он взошел на трон, и была главным голосом при нашем дворе. Ее смерть внесла большую дезорганизацию в двор, и они прекратили многие старые ссоры с реформаторами, которые вела вдовствующая императрица Лунъюй." #NT!
  
 ww1_qing.253.t: "Фонд Цинхуа" #NT!
 ww1_qing.253.d: "В 1900 году США получили долю от Boxer Indemnities. Посчитав, что это слишком много, они предложили реинвестировать это в нашу страну. Было предложено много планов, таких как план инфраструктуры Юань Шикая, но в конце концов было решено, что контрибуция будет уменьшена на 10,8 млн долларов при условии, что она будет использована для создания университета западного образца. Этот университет будет расположен на месте бывших императорских садов Цинхуа, чтобы сформировать новый колледж Цинхуа, в котором будут работать несколько выдающихся американских и китайских ученых, таких как Лян Цичао. \n\nСоглашение было одобрено в 1909 году Теодором Рузвельтом и Конгрессом США и теперь готово к реализации." #NT!
 ww1_qing.253.a: "Отличный!" #NT!
 ww1_qing.253.b: "Императорский парк предназначен только для королевских особ!" #NT!
  
  
 ww1_qing.196.t: "PCA предлагает объявить импичмент Большому совету!" #NT!
 ww1_qing.196.desc: "После инцидента с облигациями Хунань и других инцидентов в Юньнани и Гуанси, где Большой совет отменил постановление PCA, PCA направил императору или, другими словами, его регенту меморандум об импичменте, в котором, хотя и не обвинялись отдельные члены Большого совета, подчеркивалась коррумпированность Большого совета как института. \n\nМемориал об импичменте был выпущен с аналогией: «если бы Китай был кораблем, а чиновники были бы командой, безответственная команда заставила бы корабль затонуть». Другими словами, они утверждали, что они выступали за создание ответственного кабинета министров." #NT!
 ww1_qing.196.a: "Какое право имеет Постоянный арбитражный суд задавать вопросы суду?" #NT!
 ww1_qing.196.b: "Давайте просто попробуем найти способ удовлетворить и PCA, и Большой совет." #NT!
 ww1_qing.196.c: "Большой Совет показал себя неспособным помочь Императору. Распустить его!" #NT!
 ww1_qing.196.d: "Скажите им, что мы подумаем об этом." #NT!
  
 ww1_qing.195.t: "Инцидент с облигациями в Хунане" #NT!
 ww1_qing.195.d: "6 октября 1910 года Ассамблея провинции Хунань сообщила в PCA, что губернатор Хунани Ян Вэньдин выпустил 1,2 миллиона таэлей государственных облигаций без таких консультаций. Они утверждали, что Ян обошел провинциальную ассамблею и получил императорское разрешение на выпуск долга напрямую. После долгих дебатов PCA постановила, что Ян действительно превысил свои полномочия и нарушил закон, и обратилась в суд за руководством в определении наказания. \n\nВместо этого наш Большой совет шокировал PCA, составив указ от имени императора, в котором он наотрез отказался наказывать Яна, критикуя его только за беспечность. PCA полностью возмущена, но бессильна перед указом императора. Что нам делать?" #NT!
 ww1_qing.195.a: "Большой Совет знает лучше" #NT!
 ww1_qing.195.b: "Отменить решение Большого совета и наказать Ян Вэньдина." #NT!
  
 ww1_qing.188.t: "Петиция PCA о формировании кабинета министров" #NT!
 ww1_qing.188.d: "Уже сейчас много возмущения по поводу формирования нашего кабинета. Некоторые называют его «кабинетом принцев», поскольку он в основном состоит из членов королевского клана. Федерация провинциальных ассамблей заявила, что принцы-императоры не должны занимать пост премьер-министра и что кабинет принцев несовместим с конституционной монархией. Более 40 законодателей подали петицию о формировании нового кабинета" #NT!
 ww1_qing.188.a: "Депутаты не имеют права назначать и увольнять должностных лиц!" #NT!
 ww1_qing.188.b: "Нам следует прислушаться к их рекомендациям" #NT!
  
 ww1_qing.187.t: "Формирование Имперского Кабинета" #NT!
 ww1_qing.187.d: "Заменяя Большой совет, нам нужно будет сформировать тесную группу советников императора. Первоначально она будет состоять из 13 членов. Как нам следует назначать эту группу?" #NT!
 ww1_qing.187.a: "Мудрость наших императорских дворян никогда нас не подводила." #NT!
 ww1_qing.187.b: "Император заслуживает кабинет, который отражает интересы народа." #NT!
  
 ww1_qing.178.t: "Кровопролитие в Чэнду!" #NT!
 ww1_qing.178.d: "Движение за защиту железной дороги переросло в полномасштабное восстание! 7 сентября протестующие прошли маршем к зданию генерал-губернатора в Чэнду, требуя освобождения Пу Дяньцзюня, руководителя железной дороги, который выступал против национализации, и ситуация быстро обострилась, убив 32 протестующих. Вооруженные группы по всей Сычуани восстали и быстро подавляют местные правительственные силы. Что нам делать?" #NT!
 ww1_qing.178.a: "Свяжите меня с Дуаньфаном, наместником соседнего Хугуана!" #NT!
 ww1_qing.178.b: "Вести переговоры с протестующими" #NT!
 ww1_qing.178.c: "Это старые новости, мы уже имеем дело с восстанием!" #NT!
  
 ww1_qing.177.t: "Движение в защиту железной дороги" #NT!
 ww1_qing.177.desc: "Наши планы национализировать железные дороги и перевести эти прибыли в нашу или иностранную казну возмутили многих по всей стране. Антицинские настроения теперь переросли в «Движение в защиту железных дорог», которое активно протестует в Сычуани. Что нам с этим делать?" #NT!
 ww1_qing.177.a: "Передайте войскам в Сычуани, чтобы они их уничтожили!" #NT!
 ww1_qing.177.b: "Просто игнорируйте это, что может случиться?" #NT!
 ww1_qing.177.c: "Возможно, нам следует остановить национализацию" #NT!
 ww1_qing.177.d: "Это старые новости, мы уже имеем дело с восстанием!" #NT!
  
 ww1_qing.176.t: "Второе восстание в Гуанчжоу" #NT!
 ww1_qing.176.d: "27 апреля Хуан Син, лидер революции, и около сотни его товарищей-революционеров ворвались в резиденцию цинского наместника провинций Гуандун и Гуанси. Восстание изначально было успешным, но подкрепления Цин превратили битву в катастрофическое поражение. Большинство революционеров были убиты, лишь немногим удалось спастись. Хуан Син был ранен во время битвы. Как нам следует реагировать на это восстание?" #NT!
 ww1_qing.176.a: "Мы должны жестко пресекать революционную деятельность по всей стране!" #NT!
 ww1_qing.176.b: "Мы должны согласиться с некоторыми демократическими требованиями, чтобы предотвратить дальнейшее насилие." #NT!
  
 ww1_qing.146.t: "Решено вопрос о возмещении ущерба в Италии" #NT!
 ww1_qing.146.d: "Будь то война или дипломатия, нынешняя ситуация в мире позволяет нам больше не выплачивать этот долг." #NT!
 ww1_qing.146.a: "Окончательно!" #NT!
  
 ww1_qing.145.t: "Решено вопрос о японских контрибуциях" #NT!
  
 ww1_qing.346.t: "Решено вопрос об австрийских возмещениях" #NT!
  
 ww1_qing.144.t: "Решено вопрос американских гарантий" #NT!
  
 ww1_qing.143.t: "Решено французское возмещение ущерба" #NT!
  
 ww1_qing.142.t: "Решено вопрос о российских контрибуциях" #NT!
  
 ww1_qing.142.d: "Будь то война, дипломатия или гражданская война в России, нынешняя ситуация в мире позволяет нам больше не выплачивать этот долг." #NT!
  
 ww1_qing.141.t: "Решено вопрос о британских контрибуциях" #NT!
  
 ww1_qing.140.t: "Решено вопрос о немецких контрибуциях" #NT!
  
 ww1_qing.99.t: "Наша власть над Монголией ослабевает!" #NT!
 ww1_qing.99.d: "Мы медленно теряем контроль над Монголией, а недавние революционеры в регионе требуют создания республики. Конечно, мы подавляли любое инакомыслие, но ясно, что ничто не подавляет растущие призывы к демократии." #NT!
 ww1_qing.99.a: "Нам придется решить это в ближайшее время." #NT!
  
