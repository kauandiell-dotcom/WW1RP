 #  ww1_qing.429.t: "Маньчжурские принцы протестуют против Шикая" #NT!
 #  ww1_qing.429.d: "§BЭто событие произошло из-за того, что наша поддержка протофашистов держалась выше 75% слишком долго.§!\n\nСегодня к императору обратилась делегация из 5 маньчжурских принцев, включая Цзайцзе, Пувэя, Чжоу Фу и Юйлана. Они выразили протест против Юань Шикая и его растущей власти, заявив императору, что Юань Шикай свергнет его, и что Китайская империя находится под угрозой. Они призвали к немедленным действиям против генерала и увольнению его с поста премьер-министра императорского кабинета.\n\nОднако император был занят игрой в свои игрушки, поэтому он не послушал. Регент Цзайфэн присутствовал и обсуждал с принцами Юань Шикая. Их окончательный вердикт был..." #NT!
