 #  ww1_qing.426.t: "Заговор на Западе" #NT!
 #  ww1_qing.426.d: "Хотя губернатор Синьцзяна Юань Дахуа неизменно предан нашему правительству, этого нельзя сказать о людях там. Юань Дахуа подал в отставку перед лицом беспрецедентной революционной активности, а местные лидеры замышляют восстание, чтобы пойти в паре с нынешней Синьхайской революцией. \n\nМы могли бы перенаправить войска и внимание в регион, чтобы задержать их хотя бы до конца революции Тунмэнхуэй, или мы можем просто посмотреть ей в лицо." #NT!
