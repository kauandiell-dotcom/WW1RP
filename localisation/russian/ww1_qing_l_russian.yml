 #  ww1_qing.430.t: "Конференция Ханькоу" #NT!
 #  ww1_qing.430.d: "Новости достигли суда, что Юань Шикай провел секретную встречу с революционерами, на которой они обсудили статус Китая и возможность дезертирства Шикая. Шикай отрицал, что делал это, но, хотя Шикай все еще работает на нас прямо сейчас, очевидно, что его лояльность отсутствует, и что он скоро предаст нас\n\nЭто событие произошло из-за того, что наша поддержка протофашистов держалась выше 75% слишком долго." #NT!
 #  ww1_qing.430.a: "Он нам все еще нужен." #NT!
