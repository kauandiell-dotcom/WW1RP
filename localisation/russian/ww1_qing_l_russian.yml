 #  ww1_qing.427.t: "Шаньдун сдается" #NT!
 #  ww1_qing.427.d: "Сунь Баоци, губернатор Шаньдуна, долгое время проявлял нелояльность к нашему правительству и присоединился к революционерам, провозгласившим независимость. Однако после того, как наша армия вошла в Шаньдун, ему стало ясно, что он ошибался, и он отменил декларацию, также уйдя в отставку. Большая часть Новой армии Шаньдуна последовала его примеру, хотя некоторые районы Шаньдуна все еще отказываются сдаваться. Что нам с ним делать?" #NT!
