 #  ww1_qing.434.t: "Сломанный, но живой" #NT!
 #  ww1_qing.434.d: "Хотя мы полностью вытеснили Тунмэнхуэй из Китая, а их лидеры бежали в Японию, как трусливые террористы, было бы наивно полагать, что проблемы закончились. Так же, как когда династия Хань подавила восстание Желтых повязок, нам пришлось призвать и предоставить большую автономию лидерам местных Новых армий, чтобы победить революцию, и наша империя полностью распалась. Пока мы остаемся у власти в Пекине, с некоторым влиянием на этих региональных лордов, мы больше не имеем возможности контролировать то, что происходит на юге нашей страны." #NT!
 #  ww1_qing.434.a: "Начинается эпоха военачальников..." #NT!
