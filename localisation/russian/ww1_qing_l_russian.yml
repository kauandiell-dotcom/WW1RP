 #  ww1_qing.431.t: "Send Duanfang West?" #NT!
 #  ww1_qing.431.d: "Дуаньфанг, полное имя Тохоро Дуанфанг, — знаменосец Белого равнинного знамени. Он зарекомендовал себя как наместник Лянцзяна и Хугана и является опытным дипломатом. Однако после начала восстания на юге Чжао Эрфэн доказал свою неспособность подавить республиканских повстанцев.\n\nОднако, поскольку Чжао Эрфэн, один из наших самых опытных генералов, недавно был схвачен повстанцами и обезглавлен республиканскими генералами. Наш суд хочет наказать повстанцев, однако сначала нам нужно их уничтожить.\n\nОтправка Дуаньфана на юг вместе с Новой армией Хубэй очень помогла бы Сычуаньскому гарнизону в уничтожении повстанцев, но это будет стоить оставив Хубэй открытым для революционной деятельности. Теперь решение за судом, и Дуаньфан готов подавить восстание." #NT!
 #  ww1_qing.431.a: "Скажите ему, чтобы он перебросил войска из Хубэя в" #NT!
