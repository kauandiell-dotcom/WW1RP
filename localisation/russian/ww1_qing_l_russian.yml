 # ww1_qing.422.t: "Чонг Фат Тзе в Гонконге" #NT!
 # ww1_qing.422.d: "Чонг Фатт Тзе, также известный как Чжан Биши, был отправлен в США для изучения промышленности страны, в надежде, что мы повторим их промышленный успех. Ведя большую часть своего бизнеса в Голландской Ост-Индии и Индокитае, Чонг остановился в Гонконге и вскоре продолжит путь в США. Он получил докторскую степень в области права от британцев, и мы очень благодарны Чонгу за его предыдущие роли министра промышленности. \n\nМы могли бы попросить его инвестировать в Соединенные Штаты, что принесло бы нам долгосрочную прибыль, или мы могли бы просто позволить ему продолжить свое путешествие. Инвестиции в США были бы дорогостоящими и потребовали бы много денег, но Чонг предложил заплатить из своего собственного чистого капитала. В качестве альтернативы мы могли бы отозвать его обратно в Китай, поскольку Срединное государство, безусловно, достаточно сильно, чтобы провести индустриализацию самостоятельно!" #NT!
 # ww1_qing.422.a: "Желаю ему хорошо провести время!" #NT!
 # ww1_qing.422.b: "Дайте ему еще немного денег для инвестирования!" #NT!
 # ww1_qing.422.c: "На самом деле, он нам сейчас нужен в Китае." #NT!
 # 
 # ww1_qing.421.t: "Смерть Чонг Фатта Тзе" #NT!
 # ww1_qing.421.d: "Вернувшись из миссии в США и отправив нам свой отчет о промышленности Соединенных Штатов, Чонг вернулся в Голландскую Ост-Индию. Однако по возвращении он умер от пневмонии в Батавии. Его тело было отправлено обратно в Китай для захоронения, и мы отправили на его похороны высокопоставленного чиновника. Мы приказали суду зафиксировать его жизнь в исторических документах, чтобы его вклад всегда помнили. И британское правительство, и голландские власти приказали приспустить флаги в честь человека, которого называли «Рокфеллером Востока»." #NT!
 # ww1_qing.421.a: "Покойся с миром, Чонг." #NT!
