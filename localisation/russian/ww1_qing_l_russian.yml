 #  ww1_qing.433.t: "Скромный финал бесконечной революции [CHI.GetFlag]" #NT!
 #  ww1_qing.433.d: "Прозвенел звонок: «Один заказ жареного риса на вынос!»\n\nПростая рисовая лавка в прибрежном городе Чжэцзян привлекла много местных волнений, и выяснилось, что ее владельцем был не кто иной, как Чан Кайши. Считавшийся изгнанным в Америку, Чан взял себе имя «Чжун Ляо» и замаскировался под обычного владельца ресторана в своем родном городе. Возможно, он плохо скрывал эту привлекательность; ресторан был сокращенно назван «ГМД».\n\nКогда власти столкнулись с этим местом, их привлек восхитительный запах жареного риса. Вместо того чтобы задержать Чана, они вместо этого побаловали себя великолепной едой. Было решено, что в обмен на отказ от политической жизни Чану будет разрешено продолжать управлять этим местным бизнесом. В конце концов, это достойный пример милосердия для нашего нового государства." #NT!
 #  ww1_qing.433.a: "Наконец-то вкусная еда..." #NT!
 # 
 #  ww1_qing.432.t: "Новый вице-король Чжили" #NT!
 #  ww1_qing.432.d: "После отставки Чэня Чжили остался без наместника. Однако есть несколько вариантов, кого мы можем назначить новым наместником.\n\nПервый — Чжоу Фу. Ранее он занимал пост наместника Лянцзяна в 1904–1906 годах и наместника Лянгуана в 1906–1907 годах. Он — проиностранный чиновник и очень искусен в управлении. Он начал свою карьеру в качестве секретаря армии в лагере Ли Хунчжана в Аньцине, провинция Аньхой, во время восстания тайпинов, который прослужил Ли дольше всех, с 1860 года до смерти Ли в 1901 году.\n\nДругой кандидат — Чжан Чжэньфан, двоюродный брат Юань Шикая. Юань Шикай лично рекомендовал его на пост губернатора, но он не лоялен к династии, он лоялен к своему продажному кузену. Но он — выбор.\n\nТретий и последний кандидат — Натун. В первый год правления Сюаньтуна он был назначен министром военной авиации. В 1911 году он стал помощником министра «Королевского кабинета». Его выбор удовлетворил бы обе стороны, поскольку он не является ни сторонником Юаня, ни сторонником Запада.\n\nТеперь судьбу провинции Чжили будет решать Сын Неба." #NT!
 #  ww1_qing.432.a: "Чжоу Фу, прозападный чиновник!" #NT!
 #  ww1_qing.432.b: "Zhang Zhenfang, Yuan Shikai's cousin!" #NT!
 #  ww1_qing.432.c: "Натун кажется хорошим кандидатом" #NT!
