GER_fighter_equipment_1_desc:   "Моноплан Eindecker — первый немецкий истребитель специальной постройки и первый самолет, оснащенный синхронизирующим механизмом, позволяющим пилоту вести огонь из пулемета через дугу винта, не задевая лопасти."  
