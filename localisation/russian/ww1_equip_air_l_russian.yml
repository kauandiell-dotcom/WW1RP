airship_equipment:   "Дирижабль"  #NT!
airship_equipment_desc:   "Дирижабли были первыми летательными аппаратами, способными осуществлять управляемый полет с использованием двигателей, однако со временем их использование сократилось, поскольку их возможности уступали возможностям самолетов."  
airship_equipment_1:   "Дирижабль I"  
airship_equipment_2:   "Дирижабль II"  
airship_equipment_3:   "Дирижабль III"  
airship_bomber_equipment:   "Жесткий дирижабль-бомбардировщик"  
airship_bomber_equipment_desc:   "В жестких дирижаблях оболочка поддерживается внутренним каркасом. На жесткие дирижабли могут быть возложены различные военные задачи, включая участие в стратегических бомбардировках."  
