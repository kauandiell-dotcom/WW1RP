GER_fighter_equipment_3_short:   "Фоккер D.VII"  
GER_fighter_equipment_3_desc:   "В отличие от Albatros, Fokker D.VII может пикировать, не опасаясь разрушения конструкции. D.VII также известен своей высокой маневренностью и способностью подниматься под большими углами атаки, своим удивительно послушным сваливанием и нежеланием штопора."  
