GER_seaplane_equipment_2_desc:   "Albatross W.8, истребитель-биплан поплавковый. Фюзеляж самолета был сделан из дерева. W.8 имеет восьмицилиндровый двигатель Benz IIIb с водяным охлаждением, оснащенный фиксированным двухлопастным деревянным винтом."  
