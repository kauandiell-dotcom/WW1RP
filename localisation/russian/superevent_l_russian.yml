SE_TEST_T:   "None"  
SE_TEST_D:   "\nБро.\n- Ахмет Самет"  
SE_TEST_A:   "None"  

SE_WAR_OF_THE_WORLDS_T:   "Война миров"  
SE_WAR_OF_THE_WORLDS_D: "\n\n«Это не война, и никогда не было войной, как и войны между человеком и муравьями».\n- Артиллерист"  
SE_WAR_OF_THE_WORLDS_A:   "Шансы были миллион к одному..."  

SE_BATTLE_OF_VERDUN_T:   "Битва при Вердене"  
SE_BATTLE_OF_VERDUN_D:  "\n\n"Верден — символ и вершина Великой войны. Возможно, это единственное имя, которое переживёт многовековое забвение."\n- Ги Педрончини"  
SE_BATTLE_OF_VERDUN_A:   "Они не пройдут!"  

SE_great_war_T:   "Великая война"  
SE_great_war_D: "\n"Я думаю, что проклятие должно лечь на меня — потому что я люблю эту войну. Я знаю, что она крушит и разрушает жизни тысяч людей каждое мгновение — и все же — я ничего не могу с собой поделать — я наслаждаюсь каждой ее секундой."\n- Уинстон Черчилль"  
SE_great_war_A:   "Война, которая положит конец всем войнам"  

SE_great_depression_T:   "Великая депрессия"  
SE_great_depression_D: "\n\n«Банк — это нечто большее, чем люди, я вам говорю. Это монстр. Люди создали его, но они не могут его контролировать».\n- Джон Стейнбек"  
SE_great_depression_A:   "В долгосрочной перспективе мы все мертвы."  
#Arab
SE_arab_revolt_T:   "Великая арабская революция"  
SE_arab_revolt_A:   "Ватани Хабиби, Аль Ватан Аль Акбар"  
SE_arab_revolt_D: "\n"Мне все равно, будет ли президентство в руках сирийца, иракца, Неджди или кого-то еще. Цель состоит в том, чтобы народ этой страны стал независимым и единым."\n- Шариф Хусейн"  
#Greece
SE_gre_schism_T:   "Государство Салоники"  
SE_gre_schism_D: "\n"Греция ожидает от вас не просто смерти за нее, ибо этого, конечно, мало; она ожидает от вас победы. Вот почему каждый из вас, даже умирая, должен быть одержим одной-единственной мыслью — как сохранить свои силы до последнего, чтобы те, кто выживет, смогли победить."\n- Элефтериос Венизелос"  
SE_gre_schism_A:   "Зито о Этнархис!"  

SE_burning_of_smyrna_T:   "Катастрофа в Смирне"  
SE_burning_of_smyrna_D: "\n\n«Наконец-то мы выкорчевали греков...»\n- Мустафа Кемаль-паша"  
SE_burning_of_smyrna_A:   "Я Смирни, я хочу, чтобы ты..."  

SE_balkan_war_1_T:   "Балканская война"  
SE_balkan_war_1_D: "\n"Однажды великая европейская война разразится из-за какой-то чертовски глупой вещи на Балканах."\n- Отто фон Бисмарк"  
SE_balkan_war_1_A:   "Салоники по полной цене!"  

SE_balkan_war_2_T:   "Вторая Балканская война"  
SE_balkan_war_2_D: "\n"Мы привыкли думать, что правящие круги владеют каким-то особым искусством управления, расчета и предвидения, и когда оказывается, что наверху царят безрассудное легкомыслие и самоуверенная глупость, это всегда изумляет."\n- Лев Троцкий"  
SE_balkan_war_2_A:   "Сможет ли Болгария победить в одиночку?"  

SE_gre_byzantium_T:   "Возрождение Восточного Рима"  
SE_gre_byzantium_D: "\n\n«Константин построил ее, Константин потерял ее, Константин вернет ее»."  
SE_gre_byzantium_A:   "Зито о Афтократор!"  

SE_greeko_turkish_war_T:   "Греко-турецкая война"  
SE_greeko_turkish_war_D: "\n«Греция ведет войну не против ислама, а против анахроничного Османского правительства и его коррумпированной, позорной и кровавой администрации с целью изгнать его с тех территорий, где большинство населения составляют греки». - Элефтериос Венизелос"  
SE_greeko_turkish_war_A:   "Стин Ангира!"  

SE_balkan_fed_T:   "Балканы объединяются"  
SE_balkan_fed_D:   "\n\"Существует семь с половиной миллионов южных славян, которые в результате побед на Балканах стали смелее, чем когда-либо, в требовании своих политических прав."\n-Лев Троцкий"  
SE_balkan_fed_A:   "Зито и Энотита!"  


#Britain
SE_ENG_REPUBLIC_T:   "Британская Республика"  
SE_ENG_REPUBLIC_D: "«Несколько столетий назад один король, который восстал против простых людей того времени, потерял голову, действительно потерял ее. Позже одному из его потомков было приказано уйти как можно быстрее. С того дня короли и королевы были какими они должны быть. Они никогда не вмешивались в обычную политику, и Георгу V сейчас следовало бы держать палец подальше от пирога».\n- Джордж Лэнсбери"  
SE_ENG_REPUBLIC_A:   "Боже, храни людей"  

SE_eng_kitchener_T:   "Китченер восстанавливает порядок"  
SE_eng_kitchener_D: "\n«Каждая позиция должна быть удержана до последнего человека. Отставки быть не должно. Прижавшись спиной к стене и веря в справедливость нашего дела, каждый из нас должен бороться до конца».\n- Дуглас Хейг"  
SE_eng_kitchener_A:   "Ваш король и страна нуждаются в вас"  

SE_eng_george_v_T:   "Георг V утверждает королевскую прерогативу"  
SE_eng_george_v_D: "\n\n«Свободы народа укрепляют прерогативу короля, а прерогатива короля — защищать свободы народа».\n- Карл I"  
SE_eng_george_v_A:   "По воле Его Величества"  

SE_eng_imperial_federation_T:   "Образована Имперская Федерация"  
SE_eng_imperial_federation_D:  "\n\n«Тот, кто знает только Англию, не знает Англию».\n- Редьярд Киплинг"  
SE_eng_imperial_federation_A:   "Солнце, которое никогда не заходит"  

SE_eng_fall_of_america_T:   "Падение Америки"  
SE_eng_fall_of_america_D:  "\n\n"Я удовлетворен тем, что одна активная кампания... сжигание двух или трех их городов, все вернет на круги своя."\n-Джон Питкэрн"  
SE_eng_fall_of_america_A:   "Пришли британцы."  

#Russia
SE_FEBRUARY_REVOLUTION_T:   "[GetMonth] Революция"  
SE_FEBRUARY_REVOLUTION_D:  "\n\n"Кругом меня измена, трусость и обман..."\n- Николай II"  
SE_FEBRUARY_REVOLUTION_A:   "Земля и Свобода"  

SE_OCTOBER_REVOLUTION_T:   "Большевистский переворот"  
SE_OCTOBER_REVOLUTION_D: "\n«Люди, которые хвастались, что совершили революцию, на следующий день всегда обнаруживали, что они понятия не имели, что делают, что совершенная ими революция нисколько не походила на ту, которую они хотели совершить».\n- Фридрих Энгельс"  
SE_OCTOBER_REVOLUTION_A:   "Вся власть Советам"  

SE_rus_civil_war_winner_white_T:   "Победа Белой Армии"  
SE_rus_civil_war_winner_white_D:  "\n\n"В сознании честных русских людей счастье Родины не может быть приобретено путем ее расчленения."\n- Антон Деникин"  
SE_rus_civil_war_winner_white_A:   "Единый и Неделимая"  

SE_rus_civil_war_winner_red_T:   "Победа Красной Армии"  
SE_rus_civil_war_winner_red_D: "\n\n"Если мы не готовы расстрелять саботажника и белогвардейца, то какая же это революция? Одни разговоры и миска каши."\n- Владимир Ленин"  
SE_rus_civil_war_winner_red_A:   "Пролетарии всех стран, соединяйтесь!"  

SE_rus_savinkov_revolution_T:   "Вторая русская революция"  
SE_rus_savinkov_revolution_D: "«И когда он снял четвертую печать, я услышал голос четвертого зверя, говорящий: иди и посмотри. Я взглянул, и вот, конь бледный, и имя всадника на нем Смерть. И ад следовал за ним. Им был дан власть одной четверти земли, чтобы убивать мечом, голодом, мором и зверями земными"\n- Откровение 6:7-8"  
SE_rus_savinkov_revolution_A:   "Свобода или смерть!"  

######
SE_mex_revolution_T:   "Мексиканская революция"  
SE_mex_revolution_D: "\n"Страной должен управлять тот, кто действительно любит свой народ и свою землю, кто разделяет богатство и прогресс. У меня есть все это, только я невежественен."\n- Франсиско Вилья"  
SE_mex_revolution_A:   "Земля и Свобода"  

#China
SE_chi_xinhai_revolution_T:   "Синьхайская революция"  
SE_chi_xinhai_revolution_D: "\n\n«Если идея революции должна победить, то это должно произойти через политическое просвещение. Бесполезно пытаться навязать ее силой оружия».\n- Сунь Ятсен"  
SE_chi_xinhai_revolution_A:   "Минзу! Минкуан! Миншэн!"  

SE_chi_warlord_era_T:   "Эра полководца"  
SE_chi_warlord_era_D: "\n\n«Стране не нужно беспокоиться о бедности и слабости, но если национальная мораль будет утрачена, страна непременно рухнет и будет неизлечима».\n- Юань Шикай"  
SE_chi_warlord_era_A:   "Янцзы по-прежнему властно течет."  

#####
SE_bul_bw2_winner_T:   "Болгария Победоносная"  
SE_bul_bw2_winner_D:  "\n\n«Давайте отбросим наши мелкие амбиции и разногласия и принесем себя в жертву на алтарь нашего Отечества!»\n- Стефан Стамболов"  
SE_bul_bw2_winner_A:   "Рождение гегемона."  

#####
SE_ger_nazi_T:   "Нацистский переворот"  
SE_ger_nazi_D: "«Сегодня я снова буду пророком. Если международным еврейским финансистам в Европе и за ее пределами удастся снова ввергнуть народы в мировую войну, то результатом будет не большевизация земли и победа еврейства, но уничтожение еврейской расы в Европе!"\n- Адольф Гитлер"  
SE_ger_nazi_A:   "Нас охватило еще одно безумие."  

SE_ger_civil_war_T:   "Война за объединение Германии"  
SE_ger_civil_war_D: "\n\n«Не бойся смерти так сильно, как неполноценной жизни».\n- Бертольт Брехт"  
SE_ger_civil_war_A:   "За Германию!"  

