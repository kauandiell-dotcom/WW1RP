l_russian:
 BM_HISTORY_TITLE: "Краткая история"
  
 POWDERKEG_NAME: "Пороховая бочка Европы" #NT!
 POWDERKEG_DESC: "1910 год — непростое время для мира в Европе. Итальянцы готовятся к войне с Османской империей, которая поставит под угрозу их положение на Балканах. Восстание в Марокко начинает выплескиваться наружу, к большому огорчению Франции и к радости Германской империи. В общем, для сохранения мира понадобятся либо ясные головы, либо сильные сердца, чтобы выиграть войну." #NT!
  
 FRA_POWDERKEG_DESC: "В 1870 году Франция получила удар от формирующейся Германской империи в сокрушительной войне, в ходе которой она потеряла Эльзас-Лотарингию. Это сделало Францию ​​непримиримым врагом, которая с тех пор зализывает свои раны. Хотя территория является немецкоязычной, французский народ просто не позволит этому унижению продолжаться. \n\nК счастью, французская дипломатия построила Антанту Cordial с Соединенным Королевством и Россией. Когда начнется война, немцы наверняка рухнут. Вопрос, конечно, в том, «когда»." #NT!
  
 USA_POWDERKEG_DESC: "В то время как Европа все ближе и ближе подходит к войне и нищете, мир и процветание — это путь в Соединенных Штатах в 1910 году. Успех долларовой дипломатии и следствие Рузвельта наконец-то обезопасили Латинскую Америку от европейских держав раз и навсегда. Филиппины были умиротворены навсегда. \n\nБыло бы глупо не замечать Европу, но пока Америка может спокойно строить." #NT!
  
 ENG_POWDERKEG_DESC: "Британская империя все еще в зените своего могущества. Контролируя огромное количество территорий в Африке, Азии и Америке как посредством прямого правления, так и посредством доминионов, Соединенному Королевству еще предстоит покорить один континент: Европу. У Соединенного Королевства есть несколько союзников на материке, но ни один из них не вызывает у них особой симпатии. \n\nКонечно, добрый король Эдуард, несомненно, не задержится в этом мире надолго, а у наследного принца Джорджа есть время все встряхнуть. Что сделает следующий король ради места Британии в Европе?" #NT!
  
 GER_POWDERKEG_DESC: "То, что когда-то было 35 различными независимыми странами, теперь является Германской империей, которую многие считают одной из ведущих мировых держав, если не самой сильной из всех. Однако есть много тех, кто будет шутить с таким государством. Немецкий враг Франции сформировал Тройственное согласие из себя, Великобритании и России, которые все намного сильнее слабых союзников Германии. \n\nС одной лишь старой Австрией и нелояльной Италией Германии нужно либо больше друзей, либо больше власти, чтобы пережить грядущие времена." #NT!
  
 ITA_POWDERKEG_DESC: "Италия — самая маленькая треть Тройственного союза, союза, в который она мало верит. Австро-Венгрия, естественный соперник Италии, теперь друг в мире договоров, но все еще соперник в практическом плане. В конце концов, итальянский ирредентизм все еще провозглашает удерживаемое австрийцами побережье Далмации итальянским. Однако сейчас есть более насущные дела. \n\nПланы войны с турками-османами уже составляются. Правительство предсказывает короткую, решительную войну. Италия докажет свою силу." #NT!
  
 AUH_POWDERKEG_DESC: "Последнее столетие было проклятием для австрийского престола. На нее обрушилось унижение за унижением, от неистовства Наполеона до объединения Германии пруссаками. Почтенный старый кайзер Франц Иосиф теперь выступает в качестве заметного члена Тройственного союза, с двумя своими старыми врагами. Но, как ни странно, для Австро-Венгрии это пока шло хорошо. \n\nГабсбурги унаследовали Боснию, и народ Венгрии, наконец, кажется, умиротворен. Возможно, будет еще больше хорошего." #NT!
  
 RUS_POWDERKEG_DESC: "Последние годы не были добры к Российской империи. После крупного военного поражения от рук Японии, за которым последовала революция, заставившая некогда непобедимого царя принять конституцию, российское правительство должно снова встать на ноги и доказать свою силу снова, или рискнуть революцией. \n\nК счастью, на Балканах снова неспокойно. Разваливающаяся Османская империя — это возможность для России расшириться, создать новые марионеточные государства и, что еще важнее, доказать, что она все еще является мировой державой." #NT!
  
 TUR_POWDERKEG_DESC: "Над Константинием сгущаются грозовые тучи. Сербия, Греция и Болгария снова замышляют совместный заговор – вероятно, войну с целью попытаться заявить права на территорию, которую они несправедливо претендуют на свою собственность. Албанцы близки к восстанию. Итальянское правительство также публично рассматривает возможность завоевания Триполитании. \n\nПотеря территории почти неизбежна. Таким образом, османская дипломатия должна быть сосредоточена на обеспечении сохранения столицы, по крайней мере, на чем-то другом." #NT!
  
 SER_POWDERKEG_DESC: "Сербия рассматривается сторонними наблюдателями как захолустная, второстепенная страна. Не более чем пешка в большой игре, которую ведут друг против друга мировые империи. Конечно, мировые империи могут раньше, чем они думают, узнать, что сербы предназначены для более великих дел. \n\nВ настоящее время большинство сербов живут за пределами наших границ, на турецкой или австрийской территории. Если мы заключим сделку с дьяволом — болгарами — сербы могут начать свой путь к славе путем полного сербского объединения." #NT!
  
 BUL_POWDERKEG_DESC: "Болгария уже сделала себе имя благодаря успешным конфликтам с сербами и перехитрив Османскую империю, чтобы объединиться с Восточной Румелией. Конечно, теперь государство находится в более неудобном положении. Турки, похоже, не желают отдавать на откуп еще какие-то болгарские территории, а русские постепенно отказываются от своей поддержки. \n\nМожет быть, еще не поздно наладить отношения с Сербией? В конце концов, Болгария с сильными друзьями может стать неожиданной угрозой." #NT!
  
 GRE_POWDERKEG_DESC: "Последние несколько десятилетий оказались для Греции довольно тяжелыми. Банкротство 1893 года, проигранная греко-турецкая война 1897 года с навязанным международным финансовым контролем и переворот Гуди 1909 года оставили Грецию в ужасном состоянии. Сейчас настало время провести реформы во всех секторах, особенно с учетом нависшей над больным человеком Европы, Османской империей, войны. \n\nНастало время избавить эту страну от прошлых неудач и стабилизировать ее. Возможно, в процессе мы вернем себе нашу давно потерянную столицу с 1453 года." #NT!
  
 MEX_POWDERKEG_DESC: "Мексика 1910 года — действительно странный случай. Porfiriato был великим благом для Мексики с 1876 года, но теперь, когда накал страстей усилился, похоже, что время президента Диаса может быть ограничено. Конечно, правительство считает это укусом руки. \n\nФрансиско Мадеро активно и явно строит заговор против правительства Диаса. Если он окажется достаточно амбициозным, он может увидеть Мексику в своем собственном заднем кармане." #NT!
  
 JAP_POWDERKEG_DESC: "Всего за 50 лет Япония превратилась из отсталого деспотичного государства, управляемого сёгуном, в настоящую современную империю, столь же могущественную, как и любая страна Европы. За это следует поблагодарить императора Мэйдзи, но, к сожалению, он и стар, и болен, и, вероятно, не сможет прожить долго. \n\nПрежде чем наследный принц Ёсихито примет корону, нужно уладить еще несколько вопросов. Пожилой император должен решить, как Япония относится к России и что делать с корейским вассалом." #NT!
  
 HOL_POWDERKEG_DESC: "После Второй Гаагской конференции 1907 года Нидерланды делают все возможное, чтобы избежать политического союза с другой европейской империей.\n\nПоскольку барабаны войны звучат у ворот Амстердама, и несмотря на твердую политику нейтралитета, мирная страна-промышленник вскоре может оказаться припертой к стене и вынужденной сделать выбор, который может навсегда изменить будущее Голландской империи.\n\nНикто не знает, как отреагирует яростно патриотичная королева Вильгельмина..." #NT!
  
 QIN_POWDERKEG_DESC: "Династия Цин находится на грани краха. Девятнадцатый век принес с собой катастрофические поражения в Опиумных войнах, восстание на юге и многочисленные неудачные реформы. Со смертью старой вдовствующей императрицы и императора Гуансюй, четырехлетний император Сюаньтун неспособен управлять страной, оставив только регентов. \n\nОппозиция быстро растет, и поскольку восстание боксеров все еще свежо в памяти многих, неясно, что станет с нацией." #NT!
  
 AST_POWDERKEG_DESC: "Золотая лихорадка и сельскохозяйственная промышленность принесли процветание. С середины 19 века во всех шести британских колониях начали устанавливаться автономные парламентские демократии. В 1901 году колонии проголосовали на референдуме за объединение в федерацию, и так появилась современная Австралия.\n\nКатастрофические засухи поразили некоторые регионы в конце 1890-х и начале 20 века и вместе с растущей чумой кроликов создали большие трудности в сельской Австралии." #NT!
  
 CAN_POWDERKEG_DESC: "Канада была верным подданным и другом Британской короны с момента ее зачатия. В такие смутные времена Канада должна искать помощи Короне и ее огромной империи. Хотя Канада большая, с огромными ресурсами и богатой землей, у нее сломанная экономика и слабая армия. Канада могла бы стать идеальным союзником во времена великой борьбы..../n/n/n Но Канада могла бы найти новую цель или новую судьбу и стать местом для канадцев. Эта молодая страна более могущественна, чем кажется!" #NT!
  
 BRA_POWDERKEG_DESC: "Республика Соединенных Штатов Бразилии была основана 15 ноября 1889 года после свержения императора Дона Педру II. С тех пор Бразилией правили военные и олигархи. \n\nВыборы были фальшивыми, но представительство было настоящим... Выборы не в счет, но депутаты и сенаторы были лучшими, какие только могла иметь Бразилия!" #NT!
  
 KOR_POWDERKEG_DESC: "Корея, страна утреннего спокойствия, была досовременным королевством, которое придерживалось политики изоляционизма. Однако неподготовленное открытие порта, которое было навязано японцами, привело к тому, что Корея была затруднена и подвержена влиянию внешних сил, пытающихся доминировать над Кореей во всех процессах. В конце концов, страной, которая выиграла все соревнования, стала их недружественная соседка Япония, и они лишили Корею ее дипломатических прав и распустили армию без какого-либо вмешательства.\n\nТеперь остается только быть аннексированной Японией. . Но корейцы горят желанием сопротивляться до конца." #NT!
  
 BEL_POWDERKEG_DESC: "Бельгия находится между молотом и наковальней. Камень — это Третья Французская Республика, а наковальня — это Германский Кайзеррейх.\n\nУ Бельгии своеобразная история: будучи созданной британцами по Лондонскому договору в качестве буквально буферного государства, она страдает от своего рода кризиса национальной идентичности. Обе провинции, Валлония и Фландрия, вопят и кричат, призывая к независимости, в то время как правящая Католическая партия отчаянно умудряется с трудом удерживать все вместе с помощью их величества короля Альберта." #NT!
  
 SWE_POWDERKEG_DESC: "Для Швеции наступают тревожные времена. Всеобщая забастовка 1909 года, хотя и провалилась по всем статьям, потрясла страну и спровоцировала классовый конфликт. Кажется, либералы собираются победить на предстоящих выборах, что не сулит ничего хорошего сельским районам страны, в которых они крайне непопулярны.\n\nЗатем наступает время грядущей бури — Швеция флиртует и с немцами, и с державами Антанты, но выберет ли нерешительное правительство наконец сторону или воспользуется конфликтом, чтобы продать ресурсы обеим сторонам?" #NT!
  
 LIB_POWDERKEG_DESC: "Либерия, земля свободы! Ну, не совсем. Партия истинных вигов правит практически без сопротивления, аристократическая диктатура, которая больше напоминает олигархическую Конфедерацию времен Гражданской войны в США, чем оплот демократии, которым являются Соединенные Штаты. Правящий афроамериканский класс имеет глубокие конфликты с коренным населением и изо всех сил пытается усмирить более глубокие внутренние районы, будучи вынужденным сотрудничать с британскими и французскими империалистами.\n75% экономики полностью зависит от Германской империи, и, учитывая нынешнюю ситуацию в Европе, это не сулит ничего хорошего в будущем..." #NT!
  
 KUW_POWDERKEG_DESC: "Watani Al Kuwait Lka Al Majdu! Inded Kuwait, слава тебе. Кувейт контролировал жемчужную промышленность и торговлю в Аравийском или Персидском заливе, в основном это зависит от того, где вы находитесь, если только вы не османы и басрайцы, которые называют его заливом Басра. Королевская семья Кувейта, Аль-Сабах, правит этой страной с 1752 года, когда Сабах I бин Джабир был единогласно избран на должность шейха Кувейта за его мудрые действия. В настоящее время Кувейт находится под османской опекой и британской защитой, своего рода как Египет." #NT!
  
 MSC_POWDERKEG_DESC: "Султанат Маскат и Оман оказался в сложной исторической ситуации, характеризующейся политической нестабильностью и внешним давлением. Будучи относительно традиционным султанатом с внутренними разногласиями и племенным соперничеством. В это время султанат Маскат и Оман также боролся с посягательствами иностранных держав, в частности Британской империи, которые стремились расширить свое влияние на регион по стратегическим причинам. Это внешнее давление в сочетании с внутренними конфликтами определило историческую траекторию султаната Маскат и Омана на протяжении всего десятилетия." #NT!
  
 OTHER_POWDERKEG_DESC: "Другие страны того периода." #NT!
  
  
  #---------------------------------------------------------------------------------------------------------------------------------- 
  # 1914 
  
 SCHLIEFFEN_NAME: "Июльский кризис (бета)" #NT!
 SCHLIEFFEN_DESC: "Барабаны войны бьют яростно. В следующем году ожидается война, как минимум, между Францией и Россией против Германии и Австро-Венгрии. Если в нее вмешаются больше держав, конфликт может стать крупнейшей войной, которую когда-либо видел мир. Одно можно сказать наверняка: для многих стран на кону само их существование." #NT!
  
 FRA_SCHLIEFFEN_DESC: "Реванш Франции скоро близок. Возвращение Триколора в Эльзас-Лотарингию и на законную французскую территорию, принадлежащую немцам в Африке, кажется ближе, чем когда-либо. Конечно, немцы так же готовы нанести удар, но пришло время Франции доказать извлеченный урок. \n\nВ конце концов, наверняка понадобится только французский «Элан», пропавший в прошлой войне, и немцев отправят собирать вещи. Конечно, ходят слухи, что долгая война может оказаться нам невыгодна, но слухи не всегда правдивы, не так ли?" #NT!
  
 USA_SCHLIEFFEN_DESC: "Соединенные Штаты являются изолированной, пацифистской страной, как это было со времен администрации Теодора Рузвельта. Однако климат в мире сегодня оставляет мало места для страны с такой мощью, как у Америки, чтобы оставаться в стороне от этих дел. Хотя Вильсон провел кампанию по изоляционизму и, похоже, не имеет особых стимулов менять курс, дух Великой войны может легко заставить США действовать. \n\n С нестабильной Мексикой и враждующими странами Европы, как долго США смогут оставаться над схваткой?" #NT!
  
 ENG_SCHLIEFFEN_DESC: "Ситуация в Европе стала невыносимой. Германия и Франция находятся слишком близко к британским позициям, чтобы британская общественность чувствовала себя комфортно. Кайзер даже имеет наглость оспаривать господство Королевского флота. Когда война, которой все боятся, вот-вот должна начаться, что-то просто необходимо сделать. Или необходимо? \n\nЕсть вариант позволить Франции и Германии перемолоть друг друга и укрепиться самим. Конечно, британские войска ДОЛЖНЫ быть задействованы, если Германия — или, возможно, Франция — в конечном итоге нападут на любого британского союзника..." #NT!
  
 GER_SCHLIEFFEN_DESC: "Предсказание господина фон Бисмарка о том, что следующая война начнется с искры из пороховой бочки Балкан, кажется, все больше и больше приближается к реальности. При всей напряженности, исходящей из региона, нет сомнений, что война между германским и французским альянсами скоро разразится. Поэтому Германия должна быть готова. \n\nВремя дипломатии прошло. Германская армия должна быть готова к тому, что может оказаться долгой, ужасной и, что хуже всего, войной на два фронта." #NT!
  
 ITA_SCHLIEFFEN_DESC: "22 года назад Италия нерешительно присоединилась к Тройственному союзу с Германией и ненавистными австрийцами, чтобы насолить Франции в Тунисе. Сегодня этот союз является самым шатким в Европе. Благодаря своему старому союзу Италия имеет шанс заполучить Савойю, Ниццу, Корсику и Тунис. Однако Антанта предоставит ей побережье Далмации — и, похоже, сможет сделать это гораздо лучше. \n\nУ Италии еще есть время до войны, чтобы принять решение. Но на чьей стороне окажется ее судьба?" #NT!
  
 AUH_SCHLIEFFEN_DESC: "Австро-Венгрия — стойкое государство, пережившее множество трудностей, в то время как другие государства были бы уничтожены. Однако растущая поддержка панславизма в России в сочетании с военным пылом на Балканах представляет угрозу, которая вполне может положить конец правлению Габсбургов. Хуже того, соперничество с итальянцами возобновилось всерьез. \n\nАвстрия должна подавить ярость балканских государств и выступить вместе с Германией против ее врагов, иначе Империя может стать просто заветным воспоминанием." #NT!
  
 RUS_SCHLIEFFEN_DESC: "Балканские войны мало что сделали для успокоения народа Российской империи. Хотя Россия и оказала поддержку южнославянским державам, только Сербия и Черногория лояльны империи на востоке, и кризис уже на горизонте, если ситуация не изменится — и сейчас. Сербские экстремисты предложили попытаться развязать войну с Австро-Венгрией, и это именно то, что нужно России. \n\nЯсные цели немецкой Польши и славянских земель в Австрии находятся в поле зрения России." #NT!
  
 TUR_SCHLIEFFEN_DESC: "То, что когда-то было величайшей империей мира, теперь почти полностью разрушено. Султанат больше не считается крупной силой в Европе, а раздел Турции между всеми европейскими державами — постоянная угроза, которая все больше приближается к реальности. Хуже того, радикальный триумвират младотурок захватил фактический контроль над правительством. \n\nПо мнению Порты, лучшим выходом будет сблизиться с Германией и надеяться, что ее могучая армия сможет защитить нас в трудную минуту." #NT!
  
 SER_SCHLIEFFEN_DESC: "Балканские войны принесли огромный успех Сербии, а также ее самому важному союзнику Греции. Однако самое сложное только началось: Габсбурги все еще удерживают регион Боснии, а также другие южнославянские территории. Хуже того, они видят в Сербии возмутителя спокойствия и были бы более чем счастливы избавить мир от этого государства в любой момент. \n\nК счастью, Россия, похоже, прониклась симпатией к Сербии, хотя, возможно, и по злонамеренным причинам. Если царь Петр воспользуется этим, мир может измениться навсегда..." #NT!
  
 BUL_SCHLIEFFEN_DESC: "Болгария ошибалась, доверяя грекам и румынам оставаться в стороне от неизбежного конфликта между ними и Сербией, и сейчас они находятся на самом низком территориальном уровне с момента обретения независимости от Османской империи. Маловероятно, что их обманут дважды. Россия, похоже, следующая в ряду ложных друзей, стремящихся только к выгоде от государства. \n\nЕдинственные страны, которые, похоже, искренне заботятся об интересах Болгарии, — это Германия и Австрия. Может быть, пришло время для нового союза?" #NT!
  
 MEX_SCHLIEFFEN_DESC: "Хотя изначально казалось, что победа Мадеро на первом этапе мексиканской гражданской войны положила ей конец, в 1913 году он был свергнут, убит и заменен одним из своих бывших генералов, Викториано Уэртой. Уэрта не популярен и не слишком компетентен, и мало кто видит, что он долго продержится у власти в стране. \n\nТем не менее, среди мексиканского населения нет согласия относительно того, кто станет следующим лидером. Некоторые сплачиваются вокруг таких экстремальных идей, как коммунизм или военная диктатура. Поднимет ли гражданская война свою уродливую голову снова?" #NT!
  
 JAP_SCHLIEFFEN_DESC: "К сожалению, оказывается, что император Тайсё проклят психическими недугами, которые серьезно повлияли на его способность править. К счастью для Японии, его министры и другие члены императорского двора начали управлять Японией, чье общество впервые ощущает вкус свободы. \n\nНо все же, что насчет войны в Европе? Будет ли это на пользу Японии? В конце концов, британско-японский союз в лучшем случае ненадежен, и Японии, возможно, лучше просто подождать, чтобы выбрать, какая сторона будет служить ее интересам." #NT!
  
 BEL_SCHLIEFFEN_DESC: "Защищаемое британцами, рассматриваемое немцами как запасной выход на Париж, позволяющий обойти укрепленную французскую армию вдоль франко-германской границы, Королевство Бельгия находится в сложной ситуации.\n\nКоролю Альберту I предстоит сделать сложный выбор: либо выступить против кайзера Вильгельма II и встать бок о бок с Антантой, либо позволить немецким войскам пройти по его территориям и выбрать другой курс действий." #NT!
  
 CHI_SCHLIEFFEN_DESC: "Революция 1911 года положила конец монархическому правлению в Китае, оставив на его месте нестабильную республику, в которой доминируют региональные военачальники. Юань Шикай захватил пост президента, но сама страна хрупка, и держится вместе только благодаря преданности его генералов.\n\nС учетом того, что в Европе скоро начнется война, еще предстоит увидеть, что произойдет с молодой республикой. Вмешательство может обнажить ее серьезную политическую нестабильность, но есть много выгод, которые можно получить от окружающих империй." #NT!
  
 SWE_SCHLIEFFEN_DESC: "В начале 20 века Швеция была страной мира. Действительно, со времен Наполеоновских войн и Кильского договора, подписанного в 1814 году, страна не пережила ни одного вооруженного конфликта и смогла извлечь выгоду из столетия мира.\n\nОднако этот хрупкий мир находится под угрозой из-за растущей напряженности между великими державами. Останется ли страна нейтральной? Никто не знает..." #NT!
  
 ALB_SCHLIEFFEN_DESC: "Албания была отмечена сложной сетью политических и территориальных сражений, находясь на перекрестке основных европейских держав.\n\nНесмотря на обретение независимости от Османской империи в 1912 году, новое государство было омрачено внутренними разногласиями и не имело стабильности и институтов, необходимых для эффективного управления. Эта слабость также сделала Албанию привлекательной целью для соседних держав, стремящихся расширить свое влияние в регионе." #NT!
  
 OTHER_SCHLIEFFEN_DESC: "Другие страны того периода." #NT!
