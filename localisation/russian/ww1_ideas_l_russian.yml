 victor_emmanuel_ww1: "Витторио Эммануэле III" #NT!
 victor_emmanuel_ww1_desc: "Единственный совет, который дал ему его отец Умберто, заключался в том, что для того, чтобы стать королем, ему нужно знать лишь, как подписаться, читать газету и ездить на лошади. И хотя его отца убил анархист, он — король, приверженный конституционному правлению." #NT!
