 ITA_questione_meridionale: "Вопрос Меридиональный" #NT!
 ITA_questione_meridionale_desc: "После объединения Юг оставался оплотом крупных землевладельцев-латифундистов. Политика правящих кругов Италии превратила Юг во внутреннюю колонию капиталистического Севера, сохранив присущую южным районам отсталость в аграрной практике и отношениях, беспощадную эксплуатацию крестьянства и хроническую безработицу; в значительной степени в социальной структуре и быту сохранялись пережитки прежних формаций. Сельское перенаселение и крайняя нищета крестьянских масс привели к массовой систематической эмиграции населения Южной Италии." #NT!
 ITA_soluzione_questione_meridionale: "Решение вопросов Меридионале" #NT!
 ITA_emigrazione_italiana: "Emigrazione Italiana" #NT!
 ITA_emigrazione_italiana_desc: "Итальянцы издавна мигрируют за границу, пытаясь справиться с нищетой и неустроенностью." #NT!
 ITA_rapid_unionisation: "Быстрое объединение в профсоюзы" #NT!
 ITA_rapid_unionisation_desc: "Итальянские рабочие быстро объединяются в профсоюзы, и забастовки становятся все более масштабными." #NT!
 ITA_roman_question: "Вопрос Романа" #NT!
 ITA_roman_question_desc: "Римский вопрос возник, когда итальянская палата депутатов провозгласила Рим столицей нового королевства, хотя тогда город входил в состав церковных государств." #NT!
 ITA_poorly_organized_armed_forces: "Плохо организованная армия" #NT!
 ITA_poorly_organized_armed_forces_desc: "Армия рассматривалась как важнейший инструмент «Инициализации» с момента объединения. Политики как слева, так и справа признавали, что региональный набор был бы более эффективным в военном отношении, а также более экономичным.\n\nПоследствия этой организационной структуры были многочисленны; прежде всего, с точки зрения логистики, это была дорогостоящая и трудоемкая система, которая значительно усложняла и замедляла процесс мобилизации. С точки зрения сплоченности подразделений, часто рассматриваемой как жизненно важный фактор поддержания боевого духа войск." #NT!
 ITA_idea_arditi: "Reparti d'assalto" #NT!
  
 FRA_scientists_exodus: "Исход ученых" #NT!
 FRA_scientists_exodus_desc: "После социалистической революции аристократическая и религиозная элита покинула страну. Эта утечка мозгов глубоко преследовала новый режим." #NT!
  
 FRA_defiant_army: "Непокорная армия" #NT!
 FRA_defiant_army_desc: "Хотя большинство генералов-националистов покинули армию, в ее рядах сохраняется сильная оппозиция. Младшие офицеры и солдаты не осознают, что Французская Республика стала социалистическим государством, и не сотрудничают с правительством в полной мере." #NT!
  
 FRA_garde_populaire_nationale: "Национальная народная гвардия" #NT!
 FRA_garde_populaire_nationale_desc: "Армия была частично расформирована после Первой мировой войны. Вместо нее партизанское ополчение, состоящее из сторонников Социалистической партии, утвердилось в качестве главной ударной силы Франции. Если этот метод позволяет даже в мирное время набрать большую военную силу, он остается менее эффективным." #NT!
  
