  #PERSIA 
 PER_idea_rural_society: "Сельское общество" #NT!
 PER_idea_rural_society_desc: "Персия, карликовая по сравнению с экономиками европейских и американских стран и проклятая политической нестабильностью, находится в трудном положении для модернизации. Быстрый упадок отвлек персидскую нацию от адаптации ее аграрной экономики, а вместе с этим идут расходы на сильную экономическую зависимость и отсутствие инфраструктуры для индустриализации. И хотя персидская армия не страдает от этого так сильно, как ей логически следовало бы из-за военных миссий, отправленных европейскими державами, Персия остается полностью уязвимой для вторжения из-за отсутствия у нее промышленной базы, даже со стороны племен внутри ее границ. Революционная нестабильность уже нанесла серьезный ущерб целостности и сплоченности нации, и это отсутствие централизации является вишенкой на торте проблем Персии." #NT!
 PER_idea_constitutional_revolution: "Конституционная революция" #NT!
 PER_idea_constitutional_revolution_desc: "XX век не был милостив к Персии. По мнению конституционалистов, Персия была страной, застрявшей во времени со своим реакционным режимом, выступающим против любых реформ. Король Мозаффар ад-Дин Шах Каджар, монарх до 1906 года, подписал конституцию незадолго до своей кончины. Наследование перешло к Мухаммеду Али-шаху, который затем отменил конституцию и разбомбил здание парламента. Проконституционные элементы затем принудили его отречься и восстановили конституцию, но не без ущерба для целостности нации. После дестабилизирующей гражданской войны и иностранных интервенций Персия теперь стоит на перепутье истории. Столкнувшись с политическим упадком и беспорядком, тот, кто преуспеет, полностью погряз в песках времени." #NT!
 PER_idea_foreign_reliance: "Иностранная зависимость" #NT!
 PER_idea_foreign_reliance_desc: "На протяжении долгого столетия Российская империя и Британская империя, в настоящее время находящиеся в центре Большой игры, смотрели на Персию как на шахматную фигуру. Из-за своего географического положения Персия рассматривалась обеими странами как буферная зона друг против друга. Персия, если бы ее контролировали британцы, обнажила бы подбрюшье России, то есть Кавказ и Среднюю Азию. Если бы она находилась под контролем России, она бы прорезала Британскую империю, обнажив Кувейт и Белуджистан. Персидские дипломаты, стремившиеся использовать эту перспективу, хотели использовать эту холодную войну, чтобы обеспечить независимость Персии, натравливая обе стороны друг на друга. Однако эта внешнеполитическая стратегия потерпела сокрушительный провал после смягчения отношений между Российской империей и Британской империей." #NT!
 PER_idea_nationalised_oil: "Англо-персидская нефтяная компания" #NT!
 PER_idea_nationalised_oil_desc: "Большая часть нефти, добываемой в нашей стране, выкачивается британскими империалистами..." #NT!
 PER_idea_government_gendarmerie: "Правительственная жандармерия" #NT!
