 TUR_workers_culture: "Культура рабочего" #NT!
 TUR_sick_man: "Больной человек Европы" #NT!
 TUR_sick_man_desc: "Угасающая Османская империя в последние десятилетия пережила крупные политические и экономические потрясения. Теряя влияние на отдаленные регионы страны и погрязая в долгах, империя получила оскорбительное прозвище Больной человек Европы." #NT!
 TUR_ittihadist_plot: "Месть итихатистов" #NT!
 TUR_ittihadist_plot_desc: "Лидеры Комитета «Единение и прогресс» не намерены передавать контроль над Ассамблеей оппозиционным силам. Они призывают своих сторонников к вооруженному восстанию." #NT!
 TUR_officers_struggle: "Борьба офицеров" #NT!
 TUR_officers_struggle_desc: "Политизированная армия разделена между враждующими группировками пашей. Офицеры сосредоточены на борьбе, дестабилизируют ситуацию, что сильно нарушает организацию в армии." #NT!
 TUR_officers_struggle_yildiz: "Офицеры Йылдыза Тешкилаты" #NT!
 TUR_officers_struggle_yildiz_desc: "Реакционные офицеры сохраняют шаткий контроль над государством, однако в армии продолжается противостояние враждующих фракций." #NT!
 TUR_officers_struggle_harbiyeli_officers: "Офицеры Харбиели" #NT!
 TUR_officers_struggle_harbiyeli_officers_desc: "Офицерская фракция Харбиели сохраняет шаткий контроль над государством, однако в армии продолжается противостояние враждующих группировок." #NT!
 TUR_harbiyeli_officers_tt: "[TUR_harbiyeli_officers_tt]" #NT!
 TUR_harbiyeli_officers_tt1: "\nЭффекты, когда мы идем на войну:\nПолучает событие «§YОфицеры Харбиели протестуют против военных решений§!»" #NT!
 TUR_harbiyeli_officers_tt2: ""
 TUR_army_of_bygone_era: "Армия ушедшей эпохи" #NT!
 TUR_army_of_bygone_era_desc: "Последняя реорганизация не повысила боеспособность и надежность нашей армии. Мы по-прежнему используем непрактичную синюю форму — наследие былой славы императорской армии, — но носить на поле боя яркий китель крайне рискованно." #NT!
 TUR_minorities: "Сепаратистские настроения" #NT!
 TUR_minorities_desc: "Балканские народы, курды, армяне и даже арабы сопротивляются ослабевшей османской власти. Если мы не стабилизируем ситуацию в стране, мы не победим сепаратистские настроения." #NT!
