 fra_unpopular_president: "\nЭтот §YНепопулярный президент§! провоцирует §Rmaluses§!" #NT!
 fra_unexperimented_president: "\nЭтот §YНеопытный президент§! провоцирует §Rmaluses§!" #NT!
  
 FRA_leon_jouhaux_desc: "Леон Жуо родился в пролетарской семье в Сен-Дени, был достойным представителем рабочего класса, работал на фабриках с 16 лет. Сразу же вступив в профсоюз, он вернулся в качестве местного представителя в §RCGT§!, прежде чем стать его §Yгенеральным секретарем§! в 1909 году.\n\nСосредоточившись на реформе общества и трудовом кодексе, он выступал за сокращение рабочего дня до 8 часов в день и улучшение условий труда шахтеров." #NT!
 FRA_edouard_vaillant_desc: "Эдуард Вайан был §Rпылким коммунаром§! в юности, активно поддерживая коммуну во время осады Парижа в 1870 году.\n\nАктивируясь в социалистической политике, Вайан был избран в Палату депутатов в 1893 году, представляя 20-й округ. Хотя раньше он был убежденным революционером, в Палате он обычно придерживался золотой середины между «революционерами», представленными §YЖюлем Гедом§!, и «реформистами», представленными §YЖаном Жоресом§!. Он был одним из основателей Французской секции Рабочего Интернационала (SFIO), социалистической партии, объединяющей революционные и реформистские группы." #NT!
 FRA_president_raymond_poincare_desc: "Получив юридическое образование, Пуанкаре был избран депутатом в 1887 году и служил в кабинете §YАлександра Рибо§!. В 1902 году он стал одним из основателей §8Демократического республиканского альянса§!, самой важной правоцентристской партии в Третьей республике.\n\nОн был известен своими резкими антигерманскими взглядами, переводом франко-русского альянса из оборонительного в наступательный, посещением России для укрепления франко-русских отношений и оказанием поддержки Франции российской военной мобилизации." #NT!
 FRA_president_jules_pams_desc: "Жюль Памс был членом §CРадикальной партии§!, умеренной социалистической части левого крыла.\n\nПамс был назначен министром сельского хозяйства в кабинете §YЭрнеста Мониса§! и сохранил этот портфель в последующих кабинетах §YЖозефа Кайо§! и §YРаймона Пуанкаре§!. Памс был создателем контроля происхождения сладких вин своего региона (Пиренеи-Ориенталь). Он также организовал большой военно-морской смотр в Порт-Вандре." #NT!
 FRA_armand_fallieres_desc: "Арман Фальер является членом §8Демократического республиканского альянса§!, объединения умеренных либералов, независимых радикалов.\n\n После долгой карьеры премьер-министра, затем министра внутренних дел при администрации §YМориса Рувье§!, затем различных кабинетов между 1885 и 1892 годами. В 1906 году он выиграл президентские выборы и занимает эту должность до сих пор. Он показал себя грозным наблюдателем и советником." #NT!
 FRA_idea_rescue_the_french: "Спасти французов" #NT!
 FRA_idea_rescue_the_french_desc: "Французские изгнанники из оскверненной метрополии следуют за факелом свободы, который несет [ROOT.GetNameDef]." #NT!
 FRA_idea_population_outflow: "Отток населения" #NT!
 FRA_idea_population_outflow_desc: "Грязная буржуазия и реакционеры соблазнили французов и бросили их в пустынных землях Африки." #NT!
 FRA_ruhr_occupation: "Оккупация Рура" #NT!
 FRA_ruhr_occupation_desc: "Оккупировать и удерживать Рур — это довольно обременительно для правительства. Но, по крайней мере, мы можем получить репарации минералами из Рура." #NT!
 FRA_ruhr_occupation2: "Оккупация Рура" #NT!
 FRA_ruhr_occupation2_desc: "Оккупация Рура наталкивается на гражданское неповиновение местного населения, что затрудняет работу администрации и жандармерии." #NT!
 FRA_disorganised_partisans: "Неорганизованные партизаны" #NT!
 FRA_idea_offensive_cult: "Оскорбительный культ" #NT!
 FRA_idea_offensive_cult_desc: "Мы, французы, ждали мести за Франко-прусскую войну. Только немедленное наступление на немецкие территории принесет абсолютную победу [ROOT.GetNameDef]. Да здравствует Франция!" #NT!
 FRA_military_disloyalty: "Военная нелояльность" #NT!
 FRA_interim_government: "Временное правительство" #NT!
 FRA_interim_government_desc: "Временное правительство всех французов было сформировано после поражения в битве за Францию. Установленное с полным пренебрежением к конституционному закону и порядку, Переходное правительство не пользуется уважением ни у кого, даже у немцев, которые его создали. Но это, по крайней мере, единственный козырь, который может спасти их от пламени Великой войны. Франция обязана быть призванной за стол мирных переговоров после полной победы Германии в конце войны." #NT!
 FRA_interim_government_tt: "§RНе могу присоединиться ни к одному союзнику с идеей §YВременного правительства§!§!" #NT!
  
