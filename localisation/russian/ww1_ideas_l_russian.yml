 QIN_idea_payments_of_indemnities_5_desc: "В соответствии с протоколом Боксера мы вынуждены выплатить 67,5 млн фунтов стерлингов, или 4,5 млрд таэлей, по годовой процентной ставке 4% в течение 39 лет, а также заложить пошлины и налоги." #NT!
 QIN_idea_payments_of_indemnities_6: "Выплаты компенсаций" #NT!
 QIN_idea_payments_of_indemnities_6_desc: "В соответствии с протоколом Боксера мы вынуждены выплатить 67,5 млн фунтов стерлингов, или 4,5 млрд таэлей, по годовой процентной ставке 4% в течение 39 лет, а также заложить пошлины и налоги." #NT!
 QIN_idea_xuantong: "Император Сюаньтун" #NT!
 QIN_idea_xuantong_desc: "Айсин-Гиоро Пуи, любезное имя Яочжи, является императором Китая как одиннадцатый монарх династии Цин. Он стал императором в возрасте двух лет в 1908 году. Его имя в эпоху императора Цин, Сюаньтун, означает «провозглашение единства»." #NT!
 QIN_idea_xuantong_young_desc: "Айсин-Гиоро Пуи, любезное имя Яочжи, является императором Китая как одиннадцатый монарх династии Цин. Он стал императором в возрасте двух лет в 1908 году. Его имя в эпоху императора Цин, Сюаньтун, означает «провозглашение единства». Он слишком молод, чтобы править. \n\n§YПока ему не исполнится 16 лет, династия Цин будет управляться регентством.§!" #NT!
 QIN_abdicated_qing_imperial_family: "Малый императорский двор династии Цин" #NT!
 QIN_abdicated_qing_imperial_family_desc: "Следуя Статьям благоприятного обращения с великим императором Цин после его отречения, императорская семья Цин и император Пуи по-прежнему живут в Запретном городе Пекине, при экономической поддержке правительства Республики, и рассматриваются как иностранная монархия. У них есть право управлять городом внутри, но немного странно иметь старого отрекшегося монарха в центре Республики. Но, что удивительно, довольно много политиков, военных деятелей и даже граждан по-прежнему склонны благоволить им." #NT!
 QIN_railway_protection_movement: "Движение защиты железных дорог" #NT!
 QIN_railway_protection_movement_desc: "Правительство заставляло людей вкладывать средства в железные дороги, заявляя, что собирается строить их без привлечения внешнего долга и только с использованием национального капитала, но теперь они национализировали все железные дороги, компенсировав лишь около 60% первоначально созданных денег. \nПо всей империи люди возмущены и пытаются остановить попытки правительства национализировать их с помощью массовых протестов, известных как Движение в защиту железных дорог." #NT!
  
 CHI_idea_support_for_revolution: "Революционная поддержка" #NT!
 CHI_idea_revolutionary_fervor: "Пятнадцать лет планирования" #NT!
 CHI_idea_revolutionary_fervor_desc: "Все к этому вело! Долой тиранов Цин!" #NT!
 CHI_idea_xinhai_revolution: "Синьхайская революция" #NT!
 CHI_idea_labour_corps: "Китайский трудовой корпус" #NT!
 CHI_idea_restore_the_nation: "Восстановить нацию" #NT!
 CHI_idea_xinhai_revolution_ends: "Восстановление после революции" #NT!
 CHI_idea_republican_plot: "Республиканский заговор" #NT!
 CHI_idea_republican_plot_desc: "Тунмэнхуэй, возглавивший Синьхайскую революцию, недоволен диктаторской властью [ROOT.GetLeader]. §RЕсли [ROOT.GetDemocraticParty] получит достаточно высокую поддержку, они могут спровоцировать еще одно восстание, чтобы свергнуть [ROOT.GetLeader]§!." #NT!
 CHI_idea_militarist_plot: "Милитаристский заговор" #NT!
 CHI_idea_militarist_plot_desc: "Чтобы встать на сторону революции, Юань Шикай потребовал от [ROOT.GetLeader] передать президентство. Но [ROOT.GetRulingParty] не сдержал своего обещания, поэтому Юань и его армия думают, что их предали. §RЕсли [ROOT.GetNeutralParty] получит достаточно высокую поддержку, они могут начать переворот против [ROOT.GetLeader]§!." #NT!
 CHI_idea_army_corruption3: "Коррупция в армии" #NT!
 CHI_idea_army_corruption3_desc: "Наши военные коррумпированы и не имеют желания сражаться." #NT!
 CHI_idea_army_corruption2: "Коррупция в армии" #NT!
 CHI_idea_army_corruption2_desc: "Наши военные коррумпированы и не имеют желания сражаться." #NT!
 CHI_idea_army_corruption: "Коррупция в армии" #NT!
 CHI_idea_army_corruption_desc: "Наша армия коррумпирована и не желает воевать." #NT!
 CHI_idea_inflation5: "Гиперинфляция" #NT!
 CHI_idea_inflation5_desc: "Наше правительство не смогло решить экономические проблемы. Наша национальная экономика разваливается сама собой." #NT!
 CHI_idea_inflation4: "Гиперинфляция" #NT!
 CHI_idea_inflation4_desc: "Наше правительство пытается решить экономическую проблему. Однако наша национальная экономика разваливается." #NT!
 CHI_idea_inflation3: "Инфляция" #NT!
 CHI_idea_inflation3_desc: "Наше правительство пытается решить экономическую проблему." #NT!
 CHI_idea_inflation2: "Инфляция" #NT!
 CHI_idea_inflation2_desc: "Наше правительство пытается решить экономическую проблему." #NT!
 CHI_idea_inflation: "Низкая инфляция" #NT!
 CHI_idea_inflation_desc: "Экономические реформы нашего правительства работают. Но экономика все еще в упадке." #NT!
 CHI_idea_beiyang_army: "Армия Бэйян" #NT!
 CHI_idea_beiyang_government: "Правительство Бэйян" #NT!
 CHI_idea_beiyang_government_desc: "Юань Шикай и его Бэйянская армия в настоящее время установили власть в качестве Бэйянского правительства, сформированного различными политическими фракциями." #NT!
 CHI_idea_communist_movement: "Коммунистическое движение" #NT!
 CHI_idea_communist_movement_desc: "С момента основания Коммунистической партии Китая они работают с нами и по сей день. Но они попытаются создать свою коммунистическую страну, если у них будет шанс." #NT!
 CHI_idea_warlord_neutrality: "Нейтралитет военачальника" #NT!
 CHI_idea_warlord_neutrality_desc: "В эпоху милитаристов в Китае было много военачальников и клик. Милитаристы, как правило, заинтересованы в расширении и сохранении своей власти, дальнейшем объединении Китая силой и не будут ввязываться в ненужные войны и т. д." #NT!
 CHI_idea_nationalist_revolution: "Националистическая революция" #NT!
 CHI_idea_nationalist_revolution_desc: "Китайские националисты находятся на пути к изгнанию всех этих коррумпированных полевых командиров со своих законных территорий Китайской Республики, которая принадлежит идеалу Синьхайской революции." #NT!
 CHI_idea_fighting_famine: "Борьба с голодом" #NT!
 CHI_idea_fighting_famine_desc: "Мы начали перенаправлять активы, чтобы обеспечить всем гражданам доступ к продовольствию, где бы они ни находились. Люди благодарны и поддерживают эту акцию." #NT!
 CHI_idea_foreign_military_aid1: "Иностранная военная помощь" #NT!
 CHI_idea_foreign_military_aid1_desc: "Вместо того чтобы использовать наши местные, не слишком блестящие учебные заведения, наше правительство посчитало, что лучше поискать в других местах возможности для достаточной подготовки и управления армией." #NT!
 CHI_idea_foreign_military_aid2: "Обширная иностранная военная помощь" #NT!
 CHI_idea_foreign_military_aid2_desc: "Вместо того чтобы использовать наши местные, не слишком блестящие учебные заведения, наше правительство посчитало, что лучше поискать в других местах возможности для достаточной подготовки и управления армией." #NT!
 CHI_idea_hongxian_emperor: "Император Хунсянь" #NT!
 CHI_idea_hongxian_emperor_desc: "Несмотря на то, что император Хунсян по-прежнему вызывает серьезные разногласия, население принимает его лучше благодаря его приверженности конституционной монархии." #NT!
 CHI_idea_beiyang_government2: "Лояльное правительство Бэйян" #NT!
 #  CHI_idea_beiyang_government2_desc: "Император Хунсянь добился лояльности армии Бэйян, заверив, что он сохранит их использование на протяжении всего правления империи в Китае. Это успокоило офицеров и повысило моральный дух в армии." #NT!
 CHI_idea_local_military_development: "Местное военное развитие" #NT!
 CHI_idea_local_military_development1_desc: "Китай когда-то гордился своей военной мощью, и хотя мы ослабли, не все потеряно. Благодаря восстановлению и реформам мы станем сильнее." #NT!
 CHI_idea_local_military_development2_desc: "Недостаточно просто адаптировать современное оборудование; мы должны полностью изменить наше мышление. Мы будем бороться за свое место среди великих держав мира, кровью и сталью." #NT!
 CHI_idea_reorganized_military_industry: "Реорганизованная военная промышленность" #NT!
 CHI_idea_reorganized_military_industry_desc: "Чтобы взять на себя обязательство по наращиванию нашей военной мощи, мы вынуждены недофинансировать нашу гражданскую экономику. Хотя это может быть пагубно, мы выдержим." #NT!
 CHI_idea_ceremonial_khan: "Церемониальный Хан" #NT!
 CHI_idea_guaranteed_religion: "Гарантированная свобода религии" #NT!
 CHI_idea_paying_for_tuva: "Плата за Туву" #NT!
 CHI_idea_payment_for_tuva: "Оплата за Туву" #NT!
 CHI_idea_paying_for_tibet: "Плата за Тибет" #NT!
 CHI_idea_payment_for_tibet: "Оплата за Тибет" #NT!
 CHI_idea_provisional_constitution: "Временная конституция" #NT!
 CHI_idea_provisional_constitution_desc: "После Синьхайской революции правительство Китайской Республики в Нанкине под временным председательством Сунь Ятсена приняло Временную конституцию Китайской Республики, которая служила временной мерой, пока они готовят и пишут настоящую конституцию." #NT!
 CHI_idea_yuan_constitution: "Новая временная конституция" #NT!
 CHI_idea_yuan_constitution_desc: "После Синьхайской революции правительство Китайской Республики в Нанкине под временным председательством Сунь Ятсена приняло Временную конституцию Китайской Республики в качестве временной меры, пока они готовят и пишут надлежащую конституцию. Поскольку надлежащая конституция для Китайской Республики еще не была принята, Юань Шикай приказал внести поправку во Временную конституцию, которая значительно увеличила полномочия президента." #NT!
 CHI_idea_reorganization_loans: "Кредиты на реорганизацию" #NT!
 CHI_idea_stable_republic: "Стабильная Республика" #NT!
 CHI_idea_no_popular_support: "Нет народной поддержки" #NT!
 CHI_idea_weak_popular_support: "Слабая народная поддержка" #NT!
 CHI_idea_improved_popular_support: "Улучшенная поддержка населения" #NT!
 CHI_idea_good_popular_support: "Хорошая народная поддержка" #NT!
 CHI_idea_no_army_support: "Нет поддержки армии" #NT!
 CHI_idea_weak_army_support: "Слабая поддержка армии" #NT!
 CHI_idea_improved_army_support: "Улучшенная поддержка армии" #NT!
 CHI_idea_good_army_support: "Хорошая поддержка армии" #NT!
 CHI_idea_guaranteed_army_support: "Гарантированная поддержка армии" #NT!
 CHI_idea_universal_opposition: "Всеобщая оппозиция" #NT!
 CHI_idea_universal_opposition_desc: "Отказываясь идти на уступки ни одной из сторон, мы оттолкнули и армию, и население. Наши генералы открыто восстают против нас, а большая часть населения призывает к прекращению этой реставрации и возвращению республики." #NT!
 CHI_idea_expand_public_works: "Развернуть Общественные работы" #NT!
 CHI_idea_increased_military_budget: "Увеличение военного бюджета" #NT!
 CHI_idea_monarchist_constitution: "Монархическая конституция" #NT!
 CHI_idea_military_constitution: "Военная конституция" #NT!
 CHI_idea_absolute_constitution: "Абсолютистская конституция" #NT!
 CHI_idea_empire_of_warlords: "Империя Военачальников" #NT!
 CHI_idea_elected_governors: "Избранные губернаторы" #NT!
 CHI_idea_military_governors: "Военные губернаторы" #NT!
 CHI_idea_centralized_governors: "Централизованное правительство" #NT!
 CHI_idea_unstable_republic: "[CHI_idea_unstable_republic]" #NT!
 CHI_idea_unstable_republic_desc: "[CHI_idea_unstable_republic_desc]" #NT!
 CHI_idea_unstable_republic_loc: "Нестабильная Республика" #NT!
 CHI_idea_unstable_republic_desc_loc: "Хотя мы успешно свергли старую династию Цин, наша новая республика оказывается нестабильной. Военные, особенно армия Бэйян, обладают значительным политическим влиянием, а республиканское дело раскололось на несколько отколовшихся движений. Пока республика остается нестабильной, иностранные державы будут неохотно взаимодействовать с нами, а наш народ не будет верить в наше руководство. §YРеспублика должна быть единой, прежде чем мы сможем проводить какую-либо внешнюю политику.§!" #NT!
 CHI_idea_unstable_empire: "Нестабильная Империя" #NT!
 CHI_idea_unstable_empire_desc: "Нестабильная республика была распущена, и Юань Шикай провозгласил себя императором Китая. Это заявление было встречено по-разному по всей стране и поляризовало как население в целом, так и высшее командование армии. Несмотря на это, новый император Хунсянь не проявляет никаких признаков отмены заявления. Однако иностранные державы выразили свое недовольство этими событиями, и ходят слухи о начале восстания на юге. §YИмперия должна быть объединена, прежде чем мы сможем проводить какую-либо внешнюю политику.§!" #NT!
 idea_qing_dynasty: "Мандат Небес" #NT!
 idea_qing_beiyang_army: "Официальная оппозиция" #NT!
 idea_qing_beiyang_army_desc: "Государственный аппарат захвачен милитаристами Бэйянской армии. Их лидер Юань Шикай находится в изгнании. И только его освобождение может остановить хаос чиновников." #NT!
 idea_qing_antimanchu: "Антиманчжурское движение" #NT!
 idea_xinhai: "Синьхайская революция" #NT!
 idea_xinhai_end: "Восстановление после революции" #NT!
 idea_xinhai_warlords: "Эра полководца" #NT!
 idea_xinhai_warlords_desc: "Некоторые регионы республики крайне недовольны новым режимом. Местные правители готовы в любой момент объявить о независимости своих земель." #NT!
 CHI_FNG_idea_backward_industry: "Отсталая промышленность" #NT!
 CHI_FNG_idea_backward_industry_desc: "Хотя Фэнтянь может содержать вторую по величине промышленную базу в Восточной Азии, его размеры скрывают устаревшую технику, неэффективные методы и серьезное неэффективное управление. Только масштабные реформы, подкрепленные большими инвестициями, могут преодолеть эти проблемы." #NT!
 CHI_FNG_idea_regionalist_sentiment: "Регионалистские настроения" #NT!
 CHI_FNG_idea_regionalist_sentiment_desc: "Национальные цели нашего правительства всегда сталкивались с более локализованными региональными посланиями, которые имеют большую привлекательность среди в целом аполитичного большинства, чем возвышенные республиканские идеалы. Хотя Чжан Цзолин когда-то привел региональное чувство к своему нынешнему положению правителя, теперь оно грозит сорвать его планы снова пойти к югу от Великой стены, завоевать Пекин и вернуть весь Китай." #NT!
 CHI_FNG_idea_kwantung_army: "Квантунская армия" #NT!
 CHI_FNG_idea_kwantung_army_desc: "Квантунская армия действует как фактическая военная миссия и оккупационная сила, защищая железные дороги, оказывая материальную помощь и давая «советы». К сожалению, игнорирование этих советов может иметь ужасные последствия." #NT!
 CHI_SCC_idea_internal_divisions: "Внутренние подразделения" #NT!
 CHI_SCC_idea_internal_divisions_desc: "В отличие от других частей Китая, провинция Сычуань разделена, и никто не берет на себя ведущую власть. В этом состоянии, если кто-то извне вмешается, они рухнут." #NT!
 CHI_SCC_idea_internal_divisions_tt: "§RНевозможно усилить закон о воинской повинности или объявить войну.\nНевозможно обучать подразделения, расформировывать подразделения или редактировать шаблоны подразделений.§!" #NT!
 CHI_XSM_idea_dispersed_society: "Рассеянное общество" #NT!
 CHI_XSM_idea_dispersed_society_desc: "Северо-западный Китай, как правило, менее сконцентрирован по населению по сравнению с востоком. В таких районах, как Нинся, Цинхай и верхняя Ганьсу, проживает мигрирующее население, а городского населения мало. Одним из преимуществ этого является то, что у наших людей есть опыт верховой езды, а также это затрудняет воздушный саботаж против наших людей. С другой стороны, нехватка людей, желающих осесть, снижает наши и без того отсталые технологические возможности." #NT!
 CHI_XSM_idea_han_hui_divide: "Han-Hui Divide" #NT!
 CHI_XSM_idea_han_hui_divide_desc: "На народность хуэй, проживающую на северо-западе и исповедующую не конфуцианские, а исламские идеалы, ханьцы смотрят свысока, как на зверей." #NT!
 CHI_SHX_idea_neutrality: "Нейтралитет Шаньси" #NT!
 CHI_SIK_idea_pushing_edge: "Раздвигая границы" #NT!
 CHI_SIK_idea_pushing_edge_desc: "[ROOT.GetLeader] имеет опыт работы с уйгурским населением и знает, до какой степени уйгуры способны выдержать большое количество притеснений. Его режим доводит эту грань до предела, и что-либо большее немедленно приведет к взрыву напряженности." #NT!
 QIN_idea_fractured_empire: "Разрушенная Империя" #NT!
 QIN_idea_fractured_empire_desc: "Империя Цин теоретически контролирует весь Китай, включая Маньчжурию, Тибет и Монголию. В реальности власть императора едва простирается за пределы стен Запретного города." #NT!
 CHI_idea_li_duan_conflict: "Конфликт Ли-Дуань" #NT!
 CHI_idea_li_duan_conflict_desc: "Заместитель председателя Ли Юаньхун и премьер-министр Дуань Цижуй конфликтуют друг с другом. Ли Юаньхун, который благосклонно относится к партийной политике и собранию, обеспокоен амбициями Дуань Цижуя, поэтому он поддерживает Фэн Гочжана, вице-президента и главу клики Чжили, которая конкурирует с кликой Аньхой Дуаня. С другой стороны, Дуань Цижуй пытается захватить правительственную власть со своей кликой." #NT!
 CHI_idea_duan_qirui: "Prime Minister Duan Qirui" #NT!
 CHI_idea_duan_qirui_desc: "Он является лидером Аньхойской клики и большой шишкой Бэйянской клики, пришедшей к власти после Юань Шикая. Хотя он амбициозен и склонен щадить свою клику, он назначен премьер-министром с подавляющей национальной и международной поддержкой." #NT!
 CHI_idea_duan_qirui_executive: "Chief Executive Duan Qirui" #NT!
 CHI_idea_duan_qirui_executive_desc: "Он является лидером Аньхойской клики и большой шишкой Бэйянской клики, пришедшей к власти после Юань Шикая. Он является главой исполнительной власти, занимающим позицию в оппозиции к президенту, а также объединяющим элементом в правительстве Бэйян, чей авторитет был поколеблен несколькими гражданскими войнами..." #NT!
