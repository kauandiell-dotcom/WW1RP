 idea_italy_triple_alliance: "Несогласие с Тройственным союзом" #NT!
 idea_italy_triple_alliance_desc: "Италия находится в Тройственном союзе и обязана вступить в войну на стороне Германии и Австро-Венгрии. Однако итальянское правительство придерживается политики нейтралитета и решительно выступает против поддержки немцев." #NT!
 idea_italian_patriotism: "«Аванти Савойя!»" #NT!
 idea_italian_patriotism_desc: "Население Италии готово сражаться за свои национальные территории в войне против австрийских агрессоров." #NT!
