 idea_italy_MAS_boat: "Мотоскафо Armato Silurante" #NT!
 idea_italy_MAS_boat_desc: "Торпедные катера (MAS) являются крупным достижением раннего итальянского судостроения. Они эффективны в борьбе с подводными лодками, охране побережья и сопровождении конвоев, а также дредноутов." #NT!
