 FRA_artisanal_industry: "Кустарная промышленность" #NT!
 FRA_artisanal_industry_desc: "Хотя Франция является в значительной степени индустриализующейся страной, процессы проектирования и методы работы часто не подходят для современной промышленности. Эта потеря конкурентоспособности может быть объяснена, в частности, отсутствием организационной модели в крупных национальных компаниях." #NT!
 FRA_memories_of_1870: "Воспоминания о 1870 году" #NT!
 FRA_memories_of_1870_desc: "Поражение 1870 года от Пруссии надолго запечатлелось в памяти французов. В результате национальная политика была оборонительной и осторожной, далекой от мысли о прямой конфронтации с [GER.getName]." #NT!
