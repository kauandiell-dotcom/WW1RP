 SOV_brest_litovsk_desc: "Подписание Позорного Брестского мира стало тяжелым ударом для всей страны. После окончания полномасштабной войны с Германией регулярная армия больше не желала продолжать войну, и многие солдаты вернулись в свои дома." #NT!
 SOV_petrogad_uprising: "Петроградское восстание" #NT!
 RUS_ww1_russian_workers: "Притеснение рабочих" #NT!
 RUS_ww1_russian_workers_desc: "Российская промышленность имеет высокие темпы роста. Но этот успех был построен на крови и поте русских трудящихся. Класс пролетариата угнетен, и очень часто происходят забастовки, приносящие серьёзные потери." #NT!
 RUS_ww1_dual_power: "Двойная власть" #NT!
 RUS_ww1_russian_revolution: "Угроза революционеров" #NT!
 RUS_ww1_russian_revolution_desc: "1905 год стал отправной точкой для начала новой эры для России. Империю раздирают революционные организации, ожидающие подходящего момента, чтобы обратить всю ярость и силу народа против царского самодержавия." #NT!
