 ENG_hmmlr_desc: "HMMLR, или Самое Верное Сопротивление Его Величества (обычно называемое просто Сопротивлением), образовалось в результате подавления демократии Германией в [ENG.GetNameDef].\n\nМногие по всей стране симпатизируют HMMLR, от политиков до генералов, от шахтеров до фермеров. §RОни нанесут удар при первой же возможности.§!" #NT!
