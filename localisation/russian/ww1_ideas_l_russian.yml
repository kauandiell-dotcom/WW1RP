 idea_pacifism: "Укоренившийся пацифизм" #NT!
 idea_pacifism_desc: "Католическая партия старательно противостоит попыткам короля Альберта нарушить постоянный нейтралитет Бельгии. Более полувека королевство находится в мире с соседями, поэтому правительство и население верят только в силу дипломатии." #NT!
 BEL_belgian_resistance: "Бельгийское Сопротивление" #NT!
 BEL_belgian_resistance_desc: "Старый король Альберт I возглавляет подпольное движение сопротивления против немецкого правления.\n\n«La Plus Loyale Résistance de Sa Majesté-Zijn Meest Loyale Verzet van Zijne Majesteit» или сокращенно LPLRSM-ZMLVZM — это монархический альянс либералов, консерваторов и старых бельгийских националистов, которые посвятили свою жизнь «освобождению» Бельгии от того, что они считают постоянной оккупационной силой.\n\nОни пользуются широкой общественной поддержкой, и нам будет трудно укрепить здесь нашу власть." #NT!
