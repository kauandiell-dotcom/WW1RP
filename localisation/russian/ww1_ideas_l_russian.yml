 TUR_crippling_illiteracy: "Парализующая неграмотность" #NT!
 TUR_crippling_illiteracy_desc: "Наша империя в основном сельская, и большая часть общества не имеет доступа к образованию. Даже те, у кого он есть, из-за религиозной индоктринации считают западную науку ересью. Из-за нашего безумно высокого уровня неграмотности у нас возникают трудности с исследованиями и производством современных технологий." #NT!
