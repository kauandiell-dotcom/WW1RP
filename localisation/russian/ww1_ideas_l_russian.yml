 SIB_russian_army: "Русская Армия" #NT!
  
  #Ukraine 
 UKR_idea_bread_peace: "Хлеб, земля и мир" #NT!
 UKR_idea_bread_peace_desc: "Пылающее пламя русской революции распространилось из Петрограда и достигло Киева. Мы не могли не протянуть руки немцам, чтобы они вытащили нас из этого горячего котла." #NT!
  
  #Assyria 
 ASY_idea_save_the_nation: "Бороться с преследованием" #NT!
 ASY_idea_save_the_nation_desc: "Ассирийцы — нехалкидонитский христианский народ в Месопотамии. Вооруженные столкновения с местным мусульманским, курдским населением и османские притеснения и репрессии оставили их без крова и на грани вымирания. Теперь, когда война распространилась на их земли, ассирийские добровольцы берутся за оружие, чтобы обеспечить свою собственную независимость." #NT!
  
  #Afghanistan 
 AFG_idea_i_hate_mountains: "Горная война" #NT!
 AFG_idea_i_hate_mountains_desc: "Знаете ли вы, что горы Афганистана настолько высоки и на них так трудно подняться с войсками? Не стоит вторгаться сюда без надлежащей подготовки. Более того, в регионе проживают тысячи племен, которые могут быть недружелюбны и агрессивны по отношению к захватчикам." #NT!
  
  #Siam 
 SIA_bamboo_diplomacy: "Сгибаясь под ветром" #NT!
 SIA_bamboo_diplomacy_desc: "Сиам когда-то правил всем Индокитаем, но чтобы выжить под натиском западных колониальных держав, он отдал большую часть своей территории и интересов колонизаторам. Однако в конце концов Сиаму удалось остаться одной из немногих независимых стран в Азии." #NT!
  
