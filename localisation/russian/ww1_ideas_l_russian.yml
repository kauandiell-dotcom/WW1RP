 CHI_idea_feng_guozhang_vice_president: "Vice President Feng Guozhang" #NT!
 CHI_idea_feng_guozhang_vice_president_desc: "Он является лидером клики Чжили, также являясь одним из больших шишек, который состоит из одной оси правительственной власти и военной силы. Как вице-президент, он действует как противовес, чтобы гарантировать, что клика Аньхой в правительстве Бэйян не станет слишком доминирующей." #NT!
 CHI_idea_feng_guozhang_president: "President Feng Guozhang" #NT!
 CHI_idea_feng_guozhang_president_desc: "Он является лидером клики Чжили, а также одним из больших шишек, который состоит из одной оси правительственной власти и военной силы. С отставкой Ли Юаньхуна он взял на себя роль заместителя президента по закону." #NT!
 CHI_idea_xu_shichang_president: "President Xu Shichang" #NT!
 CHI_idea_xu_shichang_president_desc: "Один из старейшин Бэйянских военачальников и член Аньхойской клики. Однако у него нет военной власти, поскольку он выступает за гражданскую администрацию, и по этой причине его иногда называют «президентом гражданской администрации». Хотя он является президентом Республики, он симпатизирует династии Цин, и поскольку он был избран Новой национальной ассамблеей, созданной Дуань Цижуем, легитимность его должности оспаривается." #NT!
