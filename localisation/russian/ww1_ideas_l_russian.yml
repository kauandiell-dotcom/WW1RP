 AZR_republic_founder: "Основатель Республики" #NT!
 AZR_republic_founder_desc: "Мамед Расулзаде основал первую парламентскую демократию в истории мусульманского мира, в эпоху, когда мусульманский мир был в основном охвачен глубоко реакционным и автократическим режимом. Армии, сражающиеся за эту республику, испытывают чувство долга и государственности." #NT!
  
