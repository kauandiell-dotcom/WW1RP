 unequal_treaties: "Неравные договоры" #NT!
 unequal_treaties_desc: "В последние десятилетия наша страна выживала за счет подписания несправедливых и необоснованных договоров с иностранными державами, но в какой-то момент мы должны положить этому конец и вернуть себе экономический суверенитет." #NT!
