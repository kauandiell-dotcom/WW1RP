 GRE_political_turmoil_dynamic_modifier_desc: "Со времен Греческой революции 1832 года Греция не смогла устоять из-за нестабильной республики, переворотов, революций и многих десятилетий абсолютизма. Последним инцидентом была греко-турецкая война 1897 года и ее последующее банкротство, а теперь Эллада расколота после переворота Гуди 1909 года, венизелисты и разделенные монархисты зашли в тупик. Люди не знают, какова будет ситуация Эллады в 20 веке, и поэтому вызвали большую нестабильность." #NT!
 GRE_political_normality_dynamic_modifier: "Политическая нормальность" #NT!
 GRE_political_normality_dynamic_modifier_desc: "После греческой революции 1832 года Греция не смогла устоять из-за нестабильной республики, переворотов, революций и многих десятилетий абсолютизма. Последним инцидентом была греко-турецкая война 1897 года и ее последующее банкротство, а теперь Эллада находится в расколе после переворота Гуди 1909 года. Венизелисты и разделенные монархисты зашли в тупик. Но на какое-то время кажется, что ситуация находится под контролем." #NT!
