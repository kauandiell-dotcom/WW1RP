 RUS_idea_stolyipin_reform: "Реформа Столыпина" #NT!
 RUS_idea_agrarian_empire: "Аграрная Империя" #NT!
 RUS_idea_agrarian_empire_desc: "Более 70 процентов населения России — крестьянство. Для того, чтобы завершить индустриализацию страны, нам нужно решить аграрную реформу." #NT!
 RUS_idea_dual_power: "Двойная сила" #NT!
 RUS_idea_dual_power_desc: "Хотя противостояние самодержавному царскому режиму одинаково, клики Временного правительства преследуют разные идеологии и цели. Власть в России разделена между буржуазией, которая хочет конституционной республики, и рабочими, которые хотят социалистической революции. Однако, поскольку меньшевики, которые считают, что социализм трудно осуществить сразу, пошли на компромисс с Думой, временное правительство было создано по соглашению между Временным комитетом Думы, который представляет буржуазию, и Советами, которые являются региональными рабочими советами." #NT!
 RUS_idea_strike_movement: "Забастовочное движение" #NT!
 RUS_idea_strike_movement_desc: "На крупнейших заводах почти каждый день происходят массовые забастовки." #NT!
 RUS_idea_strike_movement2: "Всероссийская забастовка" #NT!
 RUS_idea_strike_movement2_desc: "Сейчас в забастовках принимают участие более миллиона рабочих. Нужно их немедленно остановить!" #NT!
