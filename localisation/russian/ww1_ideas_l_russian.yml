 ITA_messina_earthquake_aftershock: "Афтершок после землетрясения в Мессине" #NT!
 ITA_messina_earthquake_aftershock_desc: "Землетрясение и последующее цунами опустошили южную Италию 28 декабря 1908 года. Двойная катастрофа почти полностью уничтожила Мессину, Реджо-ди-Калабрию и десятки близлежащих прибрежных городов. Это было самое разрушительное землетрясение, когда-либо обрушивавшееся на Европу.\nВ результате катастрофы погибло более 80 000 человек." #NT!
