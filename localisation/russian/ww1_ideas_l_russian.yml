 Franch_Staff: "Французский персонал" #NT!
 Franch_Staff_desc: "Во время войны начальник штаба армии брал на себя руководство генеральным штабом (GQG: Grand Quartier Général). Во время Первой мировой войны лидер французских армий именовался по-разному: верховным генералом (генералиссимусом) или главнокомандующим. В последние годы войны создание Верховного военного совета в 1917 году привело к тому, что общее командование перешло к французскому генералу Фердинанду Фошу, а к середине 1918 года командующий французской армией Петен подчинялся Фошу. Хотя война по сути закончилась перемирием в ноябре 1918 года, военная организация сохранялась до 1920 года." #NT!
 FRA_ww1_Revanchism: "Реваншизм" #NT!
 FRA_ww1_Revanchism_desc: "После Франко-прусской войны 1870 года многие националисты хотели отомстить за поражение Франции и вернуть утраченные территории Эльзаса и Лотарингии." #NT!
 FRA_interwar_Revanchism: "Реваншизм" #NT!
 FRA_interwar_Revanchism_desc: "Два унизительных поражения от Германии оставили на французском народе острый отпечаток отчаяния. И вот насколько французы жаждут мести Германии..." #NT!
