 RUS_idea_treaty_of_the_three_emperors: "Договор трех императоров" #NT!
 RUS_idea_treaty_of_the_three_emperors_desc: "Россия поддерживает королевские дома Великобритании и Германии в попытках урегулировать разногласия между империями." #NT!
 RUS_idea_federal_act: "Федеральный субъект" #NT!
 RUS_idea_federal_act_desc: "Россия подготовила проект создания единого экономического пространства для стран, ратифицировавших федеральный закон." #NT!
