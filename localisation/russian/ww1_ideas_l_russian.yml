 ENG_easter_rising: "Пасхальное восстание" #NT!
 ENG_easter_rising_desc: "Пасхальное восстание, также известное как Пасхальное восстание, было вооружённым восстанием в Ирландии во время Пасхальной недели в апреле 1916 года. Восстание было начато ирландскими республиканцами с целью положить конец британскому правлению в Ирландии и создать независимую Ирландскую Республику, пока Соединённое Королевство вело Великую войну. Это было самое значительное восстание в Ирландии со времён восстания 1798 года и первое вооружённое выступление ирландского революционного периода. Шестнадцать лидеров восстания были казнены в мае 1916 года, но восстание, характер казней и последующие политические события в конечном итоге способствовали росту народной поддержки независимости Ирландии." #NT!
