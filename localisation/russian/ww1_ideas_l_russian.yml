  #Chinese Eastern Railway 
 CER_happy_blessed_Horvatia: "Счастливая, благословенная Хорватия" #NT!
 CER_happy_blessed_Horvatia_desc: "Люди верят, что пока Хорват здесь, все защищены от всяких бед и несчастий." #NT!
 CER_strip_of_alienation: "Полоса отчуждения" #NT!
 CER_strip_of_alienation_desc: "КВЖД — это не просто железная дорога со станциями и обслуживающим персоналом. Воплощение идеи КВЖД в жизнь привело к появлению своеобразного феномена «государства в государстве». Зона отчуждения — это почти государство, со своими четко очерченными границами и территорией, со своим многонациональным населением, законодательной и исполнительной властью, со своим главой «государства» в лице Управляющего, со своими министерствами, своей полицией и армией, судом и муниципальным управлением, своей системой образования и здравоохранения и т. д." #NT!
 CER_international_city: "Международный Город" #NT!
 CER_international_city_desc: "Несколько тысяч граждан из 33 стран, включая США, Германию и Францию, переехали в Харбин. Шестнадцать стран открыли консульства для обслуживания своих граждан, которые основали несколько сотен промышленных, коммерческих и банковских компаний. Церкви были перестроены для русских православных, лютеранских протестантов и польских католиков. Китайские капиталисты также основали предприятия, особенно в пивоварении, пищевом производстве и текстильной промышленности. Харбин стал экономическим центром северо-восточного Китая и международным мегаполисом." #NT!
 russian_east_asiatic_steamship_co: "Русское Восточно-Азиатское Пароходство." #NT!
 CER_nominal_concession: "Номинальная российская концессия" #NT!
 CER_nominal_concession_desc: "Несмотря на отсутствие реальной центральной власти в России, КВЖД по-прежнему считается ее территорией и как таковая не может быть взята без международной реакции." #NT!
  
