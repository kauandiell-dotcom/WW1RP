 RUS_demobilizing_army: "Демобилизация армии" #NT!
 RUS_demobilizing_army_desc: "Правительство стремится к миру с Германией и Центральными державами. Солдаты на фронте демотивированы и не желают сражаться. По окончании переговоров им разрешат демобилизоваться и вернуться домой." #NT!
