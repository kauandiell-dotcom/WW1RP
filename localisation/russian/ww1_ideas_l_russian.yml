 ENG_orange_order: "Орден Оранжевого" #NT!
 ENG_orange_order_desc: "The Loyal Orange Institution, широко известный как Orange Order, является международным протестантским братским орденом, базирующимся в Северной Ирландии. Он также имеет ложи в Шотландии и по всей Британской империи и Соединенным Штатам. Orange Order был основан в графстве Арма в 1795 году, в период протестантско-католического сектантского конфликта, как братство в масонском стиле, поклявшееся поддерживать протестантское господство. Его возглавляет Великая Оранжистская ложа Ирландии, которая была основана в 1798 году. Ее название — дань уважения протестантскому королю-голландцу Вильгельму Оранскому, который победил армию католического короля Якова II в войне вильгельмитов и якобитов. Орден наиболее известен своими ежегодными маршами, самый большой из которых проводится около 12 июля." #NT!
