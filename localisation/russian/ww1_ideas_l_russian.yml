 QIN_idea_profit_transfer: "Перевод прибыли" #NT!
 QIN_idea_low_legitimacy_desc: "Когда-то мы гордились тем, что являемся центром мира, но наше правительство не поддерживается подавляющим большинством населения ханьцев, которые составляют большую часть нашего населения. Многие факторы, включая, помимо прочего, военные поражения, серию революций, крайнюю внутреннюю коррупцию, массовый экономический провал, неискренние реформы, вопиющий маньчжурский фаворитизм и общую некомпетентность, убедили многих, что наш мандат утерян.\n\nБолее того, мнение подданных о самой императорской семье исключительно плохое, потому что еще несколько лет назад вдовствующая императрица Цыси тиранически контролировала правительство, управляла детьми-императорами по своему желанию и закрывала и казнила чиновников, которые пытались реформировать наше правительство.\n\nСейчас двор Цин больше настроен на реформы и состоит из молодых принцев, последние приверженцы старого консервативного порядка умерли в 1909 году, но он по-прежнему исключительно консервативен во всех реформах, кроме самых необходимых, и потребуется многое, чтобы убедить людей, что наш двор достоин править." #NT!
 QIN_idea_low_legitimacy_2_desc: "Когда-то мы гордились тем, что являемся центром мира, но наше правительство не поддерживается подавляющим большинством населения ханьцев, которые составляют большую часть нашего населения. Многие факторы, включая, помимо прочего, военные поражения, серию революций, крайнюю внутреннюю коррупцию, массовый экономический провал, неискренние реформы, вопиющий маньчжурский фаворитизм и общую некомпетентность, убедили многих, что наш мандат утерян.\n\nБолее того, мнение подданных о самой императорской семье исключительно плохое, потому что еще несколько лет назад вдовствующая императрица Цыси тиранически контролировала правительство, управляла детьми-императорами по своему желанию и закрывала и казнила чиновников, которые пытались реформировать наше правительство.\n\nСейчас двор Цин больше настроен на реформы и состоит из молодых принцев, последние приверженцы старого консервативного порядка умерли в 1909 году, но он по-прежнему исключительно консервативен во всех реформах, кроме самых необходимых, и потребуется многое, чтобы убедить людей, что наш двор достоин править." #NT!
 QIN_idea_low_legitimacy_3_desc: "Когда-то мы гордились тем, что являемся центром мира, но наше правительство не поддерживает подавляющее большинство ханьцев, составляющих большую часть нашего населения. Многие факторы, включая, помимо прочего, военные поражения, серию революций, крайнюю внутреннюю коррупцию, массовые экономические неудачи, неискренние реформы, вопиющий маньчжурский фаворитизм и общую некомпетентность, убедили многих в том, что наш мандат потерян.\n\nБолее того, Мнение подданных о самой императорской семье исключительно плохое, потому что всего несколько лет назад вдовствующая императрица Цыси тиранически контролировала правительство, контролировала детей-императоров по своей воле, а также закрывала и казнила чиновников, которые пытались реформировать наше правительство. .\n\nСуд Цин сейчас более настроен на реформы и теперь состоит из более молодых принцев, а последние остатки старого консервативного порядка умерли в 1909 году, но по-прежнему исключительно консервативен во всех реформах, кроме самых необходимых, и это займет некоторое время. многое убедить народ в том, что наш суд достоин править." #NT!
 QIN_idea_low_legitimacy_4_desc: "Когда-то мы гордились тем, что являемся центром мира, но наше правительство не поддерживается многими факторами, такими как военные поражения, серия революций, крайняя внутренняя коррупция и массовый экономический крах.\nБолее того, мнение подданных об императорской семье очень плохое, потому что еще несколько лет назад вдовствующая императрица Цыси имела диктатуру и тиранию, которая управляла императорами по ее воле." #NT!
 QIN_idea_low_legitimacy_5_desc: "Несмотря на все эти тяжелые лишения, наша страна и монархия выстояли. Он восстановил свой статус, предписанный небесами." #NT!
 QIN_idea_low_legitimacy_6_desc: "Несмотря на все эти тяжкие испытания, наша страна и монархия выжили. Она действительно вернула себе статус, предписанный ей небесами." #NT!
