 ENG_british_officers_independent_egypt: "Британские офицеры" #NT!
 ENG_british_officers_independent_egypt_desc: "Несмотря на то, что мы сбросили оковы британской диктатуры, офицеры британской армии в нашей армии остались и продолжают укреплять наше военное присутствие. Нет никаких причин для их ухода, и они играют важную роль в организации обороны нашей страны. Они также обладают бесценным опытом борьбы с турками. И все, что они просят, это достойная солдатская зарплата? Мало причин не держать их здесь." #NT!
 ENG_colonist_militia: "Колонистская милиция" #NT!
 ENG_colonist_militia_desc: "Наша армия довольно нетрадиционна, поскольку на самом деле представляет собой ряд независимых, полуавтономных колониальных ополчений, которые, как следует признать, были сформированы довольно хаотично." #NT!
 ENG_g_k_chesterton: "Г. К. Честертон" #NT!
 ENG_rudyard_kipling: "Редьярд Киплинг" #NT!
 ENG_rudyard_kipling_desc: "Автор «Книги джунглей» и известный поэт, Киплинг является одним из самых ярых сторонников британского империализма и теории «бремени белого человека».\n\nРодившийся на Цейлоне, он пользуется широкой популярностью как среди колонистов, так и среди местных жителей." #NT!
 ENG_imperial_refuge: "Имперское убежище" #NT!
 ENG_imperial_refuge_desc: "Британская империя рухнула. Лондон попал в руки коммунистов. Только королевской семье, белой армии и их сторонникам удалось сбежать сюда. Британцы будут ждать своего часа здесь, точа мечи мести." #NT!
 ENG_imperial_refuge_neutrality: "Имперское убежище" #NT!
 ENG_imperial_refuge_neutrality_desc: "Британская империя рухнула. Лондон попал в руки коммунистов. Только королевской семье, белой армии и их сторонникам удалось сбежать сюда. Британцы будут ждать своего часа здесь, точа мечи мести." #NT!
 ENG_two_power_standard: "Стандарт двух держав" #NT!
 ENG_lords_opposition: "Лорды Оппозиция" #NT!
 ENG_lords_opposition_desc: "Палата лордов находится в состоянии фрустрирующего противодействия нашему правительству. Они постоянно блокируют законопроекты и акты и фактически остановили наше законотворчество. Все больше распространяется мнение, что для их сдерживания придется предпринять радикальные действия, если они не изменят свое отношение и не изменят его быстро." #NT!
 ENG_golden_age_espionage: "Золотой век шпионажа" #NT!
 ENG_golden_age_espionage_desc: "Это Золотой век британского шпионажа! Повальное надувательство, секреты и шалости в изобилии, верные имперские агенты по всему миру собирают жизненно важную разведывательную информацию для короля и страны.\n\nОднако мы не одиноки, поскольку гунны, франки и русские занимаются похожей деятельностью прямо у нас под носом.\n\n\nДаже японцы теперь вмешиваются! Как ужасно волнительно." #NT!
