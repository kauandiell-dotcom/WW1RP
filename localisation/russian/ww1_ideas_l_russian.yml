 #Brazil 
 BRA_idea_coronelism: "Коронелизм" #NT!
 BRA_idea_coronelism_desc: "«Правление коронелей» — это система, которая централизует политическую власть в руках местного олигарха, известного как коронель, который раздает милости в обмен на лояльность." #NT!
 BRA_idea_coffee_with_milk: "Кафе с легкой политикой" #NT!
 BRA_idea_coffee_with_milk_desc: "Землевладельцы Сан-Паулу и Минас-Жерайс доминируют в политике [BRA.GetAdjective]. Политические машины патрон-клиент в сельской местности позволили аграрным олигархам, особенно плантаторам кофе в доминирующем штате Сан-Паулу, доминировать в государственных структурах в своих интересах, особенно в слабых центральных государственных структурах, которые фактически делегировали власть местным аграрным олигархиям." #NT!
 BRA_idea_amazon_rubber_boom: "Амазонский резиновый бум" #NT!
 BRA_idea_amazon_rubber_boom_desc: "Промышленная революция в Европе привела к спросу на этот натуральный каучук, и он добывается исключительно в бассейне Амазонки. Каучуковый бум и связанная с ним потребность в большой рабочей силе оказывают значительное негативное влияние на коренное население по всей Бразилии. Рабство и систематическая жестокость широко распространены." #NT!
 BRA_idea_amazon_rubber_boom_2: "Амазонский резиновый бум" #NT!
 BRA_idea_amazon_rubber_boom_2_desc: "Промышленная революция в Европе привела к спросу на этот натуральный каучук, и он добывается исключительно в бассейне Амазонки. Каучуковый бум и связанная с ним потребность в большой рабочей силе оказывают значительное негативное влияние на коренное население по всей Бразилии. Рабство и систематическая жестокость широко распространены." #NT!
