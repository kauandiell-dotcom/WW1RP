 prohibition_accepted: "Запрет вступил в силу" #NT!
 prohibition_accepted_desc: "С ратификацией 18-й поправки и соответствующего законодательства производство, продажа или транспортировка алкоголя внутри, в или из США теперь являются незаконными. Недостаток алкоголя приведет к снижению спроса на потребительские алкогольные товары, но этот великий политический крестовый поход сделает будущие политические решения гораздо более спорными." #NT!
 prohibition_rejected: "Запрет отклонен" #NT!
 prohibition_rejected_desc: "Несмотря на огромную поддержку христианских организаций и многочисленных групп по защите прав женщин, последняя попытка запретить алкоголь в Соединенных Штатах провалилась. Это, безусловно, расколет общественное мнение и заставит общественность обратиться к материализму, чтобы отвлечься." #NT!
 bootleggers: "Бутлегеры" #NT!
 bootleggers_desc: "Запрет алкоголя в США имел большой непредвиденный и крайне негативный побочный эффект: рост преступных синдикатов, которые удовлетворяют ненасытный спрос общественности на спиртное. Невероятный уровень насилия, связанный с этими гангстерами, вредит этой стране, а огромные суммы денег, вовлеченные в это, развращают сознание и политику Америки, возможно, навсегда." #NT!
  
