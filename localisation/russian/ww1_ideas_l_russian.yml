 RUS_cossack_volnitsa: "Казачья вольница" #NT!
 RUS_cossack_volnitsa_desc: "В старину люди, в основном из тех, кто бежал от тяжелых условий крепостного права, подневольного труда, селились на окраинах России, ныне известных как казачьи войска. Стремящиеся защищать свою землю, но не воевать за ее пределами." #NT!
  
