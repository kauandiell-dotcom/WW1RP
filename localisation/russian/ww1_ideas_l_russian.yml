 VIN_bleeding_us_dry: "Высасывая из нас всю кровь" #NT!
 VIN_bleeding_us_dry_desc: "Колониальная администрация жестоко и эффективно извлекает из Индокитая столько, сколько может. Хотя небольшие реформы были проведены здесь и там, в конце концов, все, что мы для жителей материка — это огромное денежное корыто, в которое они суют свои грязные, жадные лапы." #NT!
 VIN_dysfunctional_government: "Недееспособное правительство" #NT!
 VIN_dysfunctional_government_desc: "Правительство Индокитая работает невероятно плохо, с автономной военной администрацией и заброшенной гражданской администрацией. Корпорации дичают, а коррупция процветает." #NT!
  
 VIN_union_of_protectorates: "Союз Протекторатов" #NT!
 VIN_union_of_protectorates_desc: "Союз Индокитая объединяет территорию Кохинхины и ряд протекторатов, созданных в период с 1883 по 1907 год. Управление шестью штатами, входящими в эту федерацию, затруднено, особенно из-за различий в культуре и религиозных убеждениях местных народов." #NT!
  
 VIN_french_exploitation: "[Root.Overlord.getAdjective] Эксплуатация" #NT!
 VIN_french_exploitation_desc: "Индокитай эксплуатируется [Root.Overlord.getName] и не считается колонией-поселением, как Северная Африка. В результате местные ресурсы отправляются в метрополии, продаются по непревзойденной цене, в ущерб гражданам Индокитая." #NT!
  
 VIN_colonial_army: "Колониальная армия" #NT!
 VIN_colonial_army_desc: "Армия Индокитайского союза является лишь продолжением армии [Root.Overlord.getAdjective], которая не привлекает много добровольцев. Хотя помощь метрополии позволяет содержать небольшую армию, последняя может быстро исчерпать мотивированных людей..." #NT!
  
 VIN_popular_mystic_army: "Популярная мистическая армия" #NT!
 VIN_popular_mystic_army_desc: "Вооруженные силы следуют принципам Дао Дай, новому принципу, поощряемому императором Фан Сич Лонгом, ссылающимся на божественное превосходство вьетнамского народа и его явную судьбу." #NT!
  
