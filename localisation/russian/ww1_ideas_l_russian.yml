 war_of_liberation: "Освободительная война" #NT!
 SER_nationalist_agitation: "Националистическая агитация" #NT!
 SER_idea_pig_war: "Война Свиней" #NT!
 SER_idea_pig_war_desc: "Свиная война — название торговой войны между Австрией и Сербией, которая велась почти 5 лет. Прямой искрой для нее стал артиллерийский вопрос в 1905 году, когда сербское правительство отказалось от австрийской артиллерии в пользу французской. В результате Австрия закрыла свои границы для сербского импорта и экспорта. Поскольку основным сербским экспортом был скот, в частности свиньи, эта торговая война получила название Свиная война. \nОна заставила сербское правительство обратить внимание на внешний экспорт, но в отличие от экспорта в Австрию, сербская нация не может экспортировать живой скот, поэтому торговая война вынудила сербское правительство наконец начать индустриализацию." #NT!
