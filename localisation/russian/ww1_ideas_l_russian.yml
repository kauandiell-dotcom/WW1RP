  #Burma 
 BRM_agrarian_society: "Аграрное общество" #NT!
 BRM_agrarian_society_desc: "Традиционно промышленностью Бирмы было сельское хозяйство; британские колониальные власти работали над тем, чтобы сделать регион дельты самым богатым зерновым полем в мире, поэтому производство риса здесь очень высокое. Обратной стороной этого является то, что инфраструктура Бирмы недостаточно развита, а ее население далеко от преимуществ современной промышленности." #NT!
  
  #South Russian government 
 SRA_industrial_chaos: "Промышленный Хаос" #NT!
 SRA_industrial_chaos_desc: "Последствия Великой войны и продолжающаяся гражданская война оставили наши отрасли в руинах. Нехватка оборудования, перебои с электроэнергией и отсутствие компетентного управления преследуют наши заводы. Возникший хаос серьезно затрудняет наши производственные возможности и должен быть устранен." #NT!
 SRA_military_chaos: "Военные в хаосе" #NT!
 SRA_military_chaos_desc: "Конфликт внутри наших границ привел в замешательство наши вооруженные силы. Отсутствие централизованного командования, а также нестабильность лояльности и морального духа в войсках сделали нашу оборону слабой и нескоординированной. Чтобы навести порядок в военном хаосе, необходимы срочные реформы." #NT!
 SRA_industrial_chaos_light: "Промышленный Хаос" #NT!
 SRA_industrial_chaos_light_desc: "Последствия Великой войны и продолжающаяся гражданская война оставили наши отрасли в руинах. Нехватка оборудования, перебои с электроэнергией и отсутствие компетентного управления преследуют наши заводы. Возникший хаос серьезно затрудняет наши производственные возможности и должен быть устранен." #NT!
 SRA_industrial_chaos_lighter: "Промышленный Хаос" #NT!
 SRA_industrial_chaos_lighter_desc: "Последствия Великой войны и продолжающаяся гражданская война оставили наши отрасли в руинах. Нехватка оборудования, перебои с электроэнергией и отсутствие компетентного управления преследуют наши заводы. Возникший хаос серьезно затрудняет наши производственные возможности и должен быть устранен." #NT!
 SRA_land_reforms: "Земельные реформы" #NT!
 SRA_land_reforms_desc: "В попытке стабилизировать регион и заручиться поддержкой населения мы провели широкомасштабные земельные реформы. Предоставляя большую автономию и права собственности крестьянам, мы не только расширяем их возможности, но и стимулируем нашу аграрную экономику, переломив ход конфликта." #NT!
 SRA_peasant_strike: "Крестьянская забастовка" #NT!
 SRA_peasant_strike_desc: "В попытке стабилизировать регион и заручиться поддержкой населения мы провели широкомасштабные земельные реформы. Предоставляя большую автономию и права собственности крестьянам, мы не только расширяем их возможности, но и стимулируем нашу аграрную экономику, переломив ход конфликта." #NT!
 SRA_resource_administration: "Администрация ресурсов" #NT!
 SRA_resource_administration_desc: "Осознавая стратегическую важность наших природных ресурсов, мы создали централизованное Управление ресурсами. Этот орган обеспечивает эффективное распределение и использование наших активов, подпитывая наши военные усилия и помогая восстановлению и росту наших отраслей." #NT!
 SRA_internal_rivalries: "Внутреннее соперничество" #NT!
 SRA_internal_rivalries_desc: "Несмотря на нашу общую цель по обеспечению безопасности южнорусского региона, наше правительство пронизано внутренним соперничеством. Борьба за власть и идеологические разногласия между фракциями нарушают процессы принятия решений и угрожают подорвать наш авторитет и эффективность. Единство является крайней необходимостью в эти трудные времена." #NT!
