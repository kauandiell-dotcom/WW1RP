 SER_idea_failed_parliamentarism_desc: "Демократия и парламентаризм потерпели крах. Вместо слов политические оппоненты начали использовать кулаки и даже оружие друг против друга. Кризис слишком велик, чтобы его можно было решить традиционными демократическими средствами." #NT!
