 SIB_gold_reserve_dynamic_modifier: "Имперский золотой резерв" #NT!
 SIB_gold_reserve_dynamic_modifier_desc: "Нам удалось захватить бывший Российский императорский золотой запас, который, поскольку он является одним из крупнейших в мире, мы можем легко использовать для укрепления нашей экономики или для импорта иностранного оружия." #NT!
 SIB_fiscal_crisis: "Гиперинфляция" #NT!
 SIB_fiscal_crisis_desc: "Великая война и революция разрушили российскую экономику. Уровень инфляции неудержим, доверие к нашей валюте подорвано, а неспособность справиться с экономическим кризисом лишает легитимности наше правительство. Мы должны стабилизировать правительство и взять ситуацию в свои руки, чтобы справиться с таким уровнем инфляции." #NT!
 SIB_railroads_in_chaos: "Железные дороги в хаосе" #NT!
 SIB_railroads_in_chaos_desc: "Даже до Революции железные дороги имели серьезные проблемы в работе железных дорог. Хаос гражданской войны превратил нашу железнодорожную сеть в руины, без особой надежды на восстановление, если мы не примем радикальных мер по их исправлению." #NT!
 SIB_red_partisans: "Красные партизаны" #NT!
 SIB_red_partisans_desc: "Большевики за время своего короткого правления сумели убедить достаточно людей бороться за их дело. Партизаны, в основном состоящие из крестьян, которые сражаются за землю, которую они экспроприировали после большевистского переворота, представляют серьезную угрозу стабильности наших тылов." #NT!
 SIB_low_eser_influence: "Низкое влияние социалистов-революционеров" #NT!
 SIB_medium_eser_influence: "Среднее влияние социалистов-революционеров" #NT!
 SIB_high_eser_influence: "Высокое влияние социалистов-революционеров" #NT!
 SIB_suppressed_eser_opposition: "Подавление эсеровской оппозиции" #NT!
 SIB_czech_garrisons: "Чехословацкие гарнизоны" #NT!
