 GER_hungarian_crisis: "Венгерский кризис" #NT!
 GER_hungarian_crisis_desc: "Из-за неожиданного объявления войны из-за статуса [HUN.GetNameDef] армия [GER.GetAdjective] оказалась совершенно неподготовленной к началу полномасштабного вторжения в [FRA.GetNameDef]." #NT!
