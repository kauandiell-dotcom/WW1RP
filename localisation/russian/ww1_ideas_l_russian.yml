 interwar_recovery_desc: "Экономики стран, переживших Великую войну, фактически перестраиваются с нуля. Ограничения, наложенные в результате войны, требуют полной демобилизации государств.\n" #NT!
 interwar_recovery_tt: "\n§GЭкономическое восстановление§! начнется после §Yмирного соглашения§! посредством §Yмиссии§!!" #NT!
  
 roaring_twenties: "Ревущие двадцатые" #NT!
 roaring_twenties_desc: "Также называемое "Années folles", это десятилетие было созрело для культурных, общественных и научных инноваций. Американская промышленность не является исключением в этом отношении и вкладывает огромные средства в гражданскую промышленность и исследования." #NT!
  #GENERIC 
