 SOV_idea_sailor_mutiny_desc: "Матросы замышляют против большевиков. Они недовольны реформами флота и репрессиями против командиров. Если мы не подавим мятеж, они поднимут вооруженное восстание." #NT!
 SOV_idea_soldier_rebellion: "Солдатское восстание" #NT!
 SOV_idea_soldier_rebellion_desc: "Армия вышла из-под контроля. Из-за низкой организации армии и отсутствия армейской реформы солдаты стали чаще дезертировать и нападать на командиров. Если не разгромить мятежные армейские части, то враг вскоре разгромит нас." #NT!
 SOV_idea_peasant_uprising: "Крестьянское восстание" #NT!
 SOV_idea_peasant_uprising_desc: "Крестьяне подняли неорганизованное восстание против большевиков. Они недовольны нашей радикальной экономической политикой. Если вы их не остановите, то крестьяне создадут свою армию, чтобы свергнуть нас." #NT!
 SOV_idea_municipalization: "Программа муниципализации земель" #NT!
 SOV_idea_municipalization_desc: "Муниципализация земли — программа меньшевиков, противостоящая национализации. Он должен был решить аграрный вопрос путем формирования в стране демократического местного самоуправления." #NT!
