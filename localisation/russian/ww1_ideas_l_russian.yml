 gre_the_megali_idea: "Мегали Идея" #NT!
 gre_the_megali_idea_desc: "После окончания греческой войны за независимость в 1829 году великие державы предоставили только регионы Пелопоннес, Киклады и Румелию недавно основанной Греческой республике, при этом большинство этнических греков все еще проживали в границах Османской империи. После революции 1843 года этот термин впервые появился во время дебатов премьер-министра Иоанниса Колеттиса, лидера Французской партии, с королем Отто, которые предшествовали обнародованию конституции 1844 года. Согласно идее Мегали, греческая нация должна собраться с силами для освобождения населенных греками территорий, находящихся под иностранным правлением, конечной целью которой является освобождение бывшей восточно-римской столицы и культурного центра эллинов Константинополя. Когда Георг I взошел на престол в 1863 году, титул, предложенный ему Национальным собранием Греции, не был «королем Греции», титулом его свергнутого предшественника, короля Оттона; а скорее «Царь эллинов». Вдобавок к этому, на протяжении десятилетий королевство переживало быстрое расширение с аннексией Ионических островов в соответствии с Лондонским договором в 1864 году и аннексией Фессалии и Арты в соответствии с Константинопольской конвенцией в 1881 году. Надежды все еще велики, и Идея Мегали постепенно становится конкретной реальностью, а не идеализированной концепцией." #NT!
 gre_university_of_athens: "Афинский университет" #NT!
 GRE_idea_george_i_desc: "Король Георгиос I из дома Глюксбургов был избран королем эллинов Греческой национальной ассамблеей 30 марта 1863 года после свержения непопулярного короля Оттона I из дома Виттельсбахов. Объединяющий и популярный монарх, король Георгиос руководил расширением Эллады с приобретением Ионических островов в 1864 году у Британии и аннексией Фессалии после русско-турецкой войны 1877-1878 годов. Во время катастрофической греко-турецкой войны 1897 года именно благодаря обращению короля к великим державам Эллада сохранила свою независимость. Король правил Элладой почти 50 лет, и его преклонный возраст начал его догонять. Таким образом, принц Константин, наследник короля, в значительной степени взял на себя большую часть обязанностей своего отца как короля." #NT!
 GRE_idea_constantine_desc: "Король Константинос I из дома Глюксбургов вступил на престол после убийства своего отца, бывшего короля Георгиоса. Будучи военным, Константинос приобрел свою репутацию, лично возглавляя Королевскую Греческую армию во время войны. Будучи храбрым и волевым, Константинос пользуется уважением офицеров и солдат. Однако многие либеральные политики не могут не заметить его авторитарных наклонностей. Не секрет, что король высоко ценит имперский немецкий стиль правления, и многие политики опасаются, что он может преследовать свою собственную абсолютистскую цель..." #NT!
 GRE_idea_alexander_desc: "Король Александрос I из дома Глюксбургов вступил на престол после отречения своего отца, бывшего короля Константиноса. Второй сын Константиноса, Александрос, был выбран венизелистами в качестве монарха, связанного конституцией, поскольку его старший брат наследный принц Георгиос разделял абсолютистские взгляды их отца. Будучи человеком открытого ума, Александрос изначально выступал против политики Венизелоса, но недавно начал понимать и соглашаться с премьер-министром по многим вопросам. С его восхождением шрамы национального раскола могут начать медленно заживать." #NT!
