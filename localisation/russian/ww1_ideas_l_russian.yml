 SER_idea_bloody_throne: "Кровавый Трон" #NT!
 SER_idea_bloody_throne_desc: "Петр I не получил трон традиционными способами. Его правление стало возможным благодаря кровавому перевороту 1903 года, совершенному против соперничающей династии. Многие люди в настоящее время считают его нелегитимным королем, как в Сербии, так и в европейском сообществе, особенно в Западной Европе." #NT!
 SER_idea_grand_coalition: "Большая коалиция" #NT!
 SER_idea_grand_coalition_desc: "В настоящее время нами правят остатки концентрационной коалиции 1909 года. Эта коалиция и парламентское расположение должны были просуществовать всего несколько месяцев, но чрезвычайные обстоятельства во внешней политике искусственно продлили мандат парламента. Теперь, когда ситуация во внешней политике остывает, коалиция становится все более и более обузой." #NT!
