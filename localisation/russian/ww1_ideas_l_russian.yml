 RUS_idea_transsib_railway_modernization: "Модернизация Транссибирской магистрали" #NT!
 RUS_idea_volunteer_army: "Профессиональная армия" #NT!
 RUS_idea_volunteer_army_desc: "В нашем стремлении к военному совершенству мы установили строгие стандарты набора и обучения. Только лучшие кандидаты, те, кто демонстрирует исключительные способности и непоколебимую преданность, отбираются для вступления в наши ряды." #NT!
 RUS_idea_volunteer_army_tt: "§RДух будет потерян, как только будет объявлена ​​всеобщая мобилизация!§!" #NT!
