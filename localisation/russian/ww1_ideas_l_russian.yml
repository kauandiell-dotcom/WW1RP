 KOR_idea_uimin_desc: "28-й король Чосон и третий император Кореи" #NT!
 KOR_idea_uihwa: "Император Ыйхва" #NT!
 KOR_idea_uihwa_desc: "28-й король Чосон и третий император Кореи" #NT!
 KOR_disbanded_army: "Расформированная армия" #NT!
 KOR_disbanded_army_desc: "В 1907 году под предлогом Гаагского инцидента Япония насильственно отреклась от короля Годжона, взвела на трон короля Сунджона и вынудила заключить договор о захвате всей власти Корейской империи. И мы обменялись дипломатическим меморандумом в качестве приложения к договору. Среди них: «(3) Военные силы должны быть организованы следующим образом». В разделе было оговорено, что нынешняя армия должна быть расформирована в качестве подготовительного шага для создания более элитной новой армии путем введения в действие закона о воинской повинности в будущем.\nЭто был последний шаг в вторжении Японии, выигравшей русско-японскую войну. Война предприняла попытку установить свой контроль над Корейской империей." #NT!
 KOR_disbanded_army_tt: "§RНевозможно усилить закон о воинской повинности или объявить войну.\nНевозможно обучать подразделения, расформировывать подразделения или редактировать шаблоны подразделений.§!" #NT!
 KOR_risk_of_famine: "Риск голода" #NT!
 KOR_risk_of_famine_desc: "Япония — островная страна, поэтому мы не можем выращивать много зерна из-за нехватки сельскохозяйственных угодий. Однако, поскольку население резко возросло из-за модернизации, потребовалось большое количество зерна. Поэтому японцы вывозят зерно в больших количествах по низкой цене из Кореи. Если производство зерна будет нарушено, корейцы будут страдать от голода даже в хороший год." #NT!
 KOR_famine: "Голод" #NT!
 KOR_famine_desc: "Инфляция увеличила цены на зерно в четыре раза, и Япония вынудила Корею импортировать зерно, чтобы решить проблему нехватки риса на материковой части Японии, поэтому цены на зерно в Корее растут." #NT!
 KOR_agrarian_society: "Аграрное общество" #NT!
 KOR_agrarian_society_desc: "Корея заперла двери страны до 1876 года и поддерживала досовременное общество. С тех пор корейцы не добились активной модернизации и индустриализации, а основной отраслью промышленности является сельское хозяйство." #NT!
 KOR_industrializing_society: "Индустриализирующееся общество" #NT!
 KOR_industrializing_society_desc: "В настоящее время Корея осуществляет индустриализацию, отходя от досовременного аграрного общества." #NT!
 KOR_industrializing_society2: "Индустриализирующееся общество" #NT!
 KOR_industrializing_society2_desc: "В настоящее время Корея осуществляет индустриализацию, отходя от досовременного аграрного общества." #NT!
 KOR_industrialized_society: "Индустриализированное общество" #NT!
 KOR_industrialized_society_desc: "После пяти лет интенсивных усилий по индустриализации Корея превратилась в индустриальное общество." #NT!
 KOR_idea_land_investigation: "Исследование земель" #NT!
 KOR_idea_land_investigation_desc: "Помимо прежней системы учета земель, в Корее была введена современная система землевладения." #NT!
 KOR_idea_ship_purchase: "Покупка корабля" #NT!
 KOR_idea_ship_purchase_desc: "Корейцы купили у нас военный корабль." #NT!
 KOR_idea_ship_purchased: "Корабль куплен" #NT!
 KOR_idea_ship_purchased_desc: "Мы купили военный корабль, поэтому нам и приходится платить цену." #NT!
 KOR_idea_mass_conscription: "Массовая воинская повинность" #NT!
 KOR_idea_mass_conscription_desc: "Все мужчины обязаны отслужить в армии не менее трех лет." #NT!
 KOR_idea_army_tradition: "Традиция Праведной Армии" #NT!
 KOR_idea_army_tradition_desc: "Миллион солдат Новой Кореи,\nВаша Родина зовет вас!\nНаши тридцать миллионов соотечественников в трёх тысячах миль\nЭто мы с вами спасём!" #NT!
