 QIN_idea_purchase_restriction: "Ограничение на покупку" #NT!
 QIN_idea_beiyang_army: "Армия Бэйян" #NT!
 QIN_idea_beiyang_army_desc: "Армия Бэйян (армия Северного океана), названная в честь региона Бэйян, является крупной имперской китайской армией западного образца, созданной правительством династии Цин в конце 19 века. Она является центральным элементом общей реконструкции военной системы Китая династии Цин. Но теперь она также играет важную роль в политике под руководством влиятельных военачальников, таких как Юань Шикай." #NT!
 QIN_idea_beiyang_army_2: "Альянс с армией Бэйян" #NT!
 QIN_idea_beiyang_army_2_desc: "Династия Цин не смогла вернуть свою военную мощь от военачальника Бэйян, вместо этого они согласились передать им часть полномочий, чтобы получить их лояльность к династии. По крайней мере, они не будут мятежными на мгновение, но не будет никаких шансов снова реформировать падающую империю." #NT!
 QIN_idea_purge: "Бэйянский Purge" #NT!
 QIN_idea_purge_desc: "Династия Цин сумела устранить всех военачальников Бэйян, забрав их военную мощь. Это было крайне критично, но это было необходимо для реформирования падающей империи." #NT!
 QIN_idea_tongmenghui: "Tongmenghui" #NT!
 QIN_idea_tongmenghui_desc: "Интеллектуалы и реформаторы все больше отдаляются от консервативных императорских дворов. Тайные организации, такие как «Тунмэнхуэй» во главе с Сунь Ятсеном, дестабилизируют страну." #NT!
 QIN_idea_boxer_protocol: "Боксерский протокол" #NT!
 QIN_idea_boxer_protocol_desc: "В августе 1900 года Восемь держав подавили Боксерское восстание, оккупировали Пекин и в следующем году оказали давление на правительство Цин, чтобы оно подписало этот неравноправный договор." #NT!
