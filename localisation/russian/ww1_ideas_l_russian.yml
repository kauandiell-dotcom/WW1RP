 ROM_memories_of_1907_desc: "То, что изначально начиналось как небольшой протест, быстро переросло в общенациональное крестьянское восстание против помещиков. Либеральное правительство положило конец восстанию, отправив армию, которая безжалостно подавила крестьян." #NT!
 ROM_inexperienced_army: "Неопытная армия" #NT!
 ROM_inexperienced_army_desc: "Наша армия не имела боевого опыта почти 40 лет. На эту непроверенную силу нельзя положиться..." #NT!
 ROM_inexperienced_army_tt: "§RИстинное состояние армии будет видно в Великой войне!§!" #NT!
  
 ROM_idea_german_control: "Немецкая экономическая гегемония" #NT!
 ROM_idea_german_control_desc: "Согласно Бухарестскому договору, большая часть румынской промышленности и ресурсов находится под контролем немецко-австрийских корпораций. Наиболее важной из них является Oil-lands Leasehold Company Ltd, которая эксплуатирует нефтяные месторождения Плоешти, находящиеся в собственности Германии. Кроме того, эти корпорации владеют большой частью румынской железнодорожной сети, что фактически тормозит развитие румынской промышленности.\n\n§RНефтяные месторождения Плоешти остаются под контролем Германии.§!" #NT!
  
  #PERU 
 PRU_aristocratic_republic: "Аристократическая Республика" #NT!
 PRU_aristocratic_republic_desc: "Большинство президентов, правивших страной, были выходцами из социальной элиты." #NT!
  
  #United Baltic Duchy 
 UBD_byzantine_government: "Византийская политическая система" #NT!
 UBD_byzantine_government_desc: "Политическая система [UBD.GetNameDef] основана на многовековой традиции, берущей начало в Ливонской конфедерации или, в некоторых случаях, даже раньше. Система полупрямого представительства через ландтаги, неизменная лояльность к гражданскому праву провинции Остзее и автономный характер балтийских рыцарей, несомненно, являются частью идентичности балтийских немцев, и тем не менее, эта система остро нуждается в реформировании." #NT!
  
  #Papal States 
 PAP_holy_see: "Святой Престол" #NT!
 PAP_holy_see_desc: "[PAP.GetNameDefCap] — это временное местопребывание власти Католической церкви, возглавляемое Папой, епископом Рима и по должности лидером Церкви. С более чем 300 миллионами верующих по всему миру действия и слова Папства имеют уникальный вес, который не наблюдается больше нигде на земле." #NT!
  
  #Morocco/The Rif 
 RIF_idea_breeze_of_freedom: "Бриз Свободы" #NT!
 RIF_idea_breeze_of_freedom_desc: "Холодные дни жаркой осени. Эль-Хосейма и Тарджест, Бахаа Айт Тузан. Танжер и Тетуан, о цветок Ашауна. С Востока на Запад — это страна Риф. Риф — наша родина! Риф — наша родина!" #NT!
  
