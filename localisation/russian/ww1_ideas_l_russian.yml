  #Mutasarrifate of Jerusalem 
 PAL_moj: "Международная жандармерия" #NT!
 PAL_sectarian_divide: "Сектантский раскол" #NT!
 PAL_sectarian_divide_desc: "Чувствуя себя преданными международным сообществом и своим халифом, суннитские арабы региона яростно выступают против быстрого роста еврейской общины на своей родине, что приводит к гражданскому неповиновению, протестам и забастовкам. Международная жандармерия, размещенная в зоне для поддержания порядка, борется, поскольку напряженность растет с каждым новым прибытием." #NT!
  
