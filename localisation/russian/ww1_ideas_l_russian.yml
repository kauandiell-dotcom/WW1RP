 FRA_germans_and_italians_are_allied: "Альпийский фронт" #NT!
 FRA_germans_and_italians_are_allied_desc: "С неожиданной ратификацией Тройственного союза и присоединением [ITA.GetNameDef] к войне против нас, нам внезапно пришлось признать, что большой фронт в этой войне будет находиться в Альпах.\n\nПоэтому мы были вынуждены значительно адаптироваться наши стратегии и наша способность вести войну, чтобы противостоять угрозе Рима." #NT!
 FRA_germans_and_russians_are_allied: "Клин против немецкой гегемонии" #NT!
 FRA_germans_and_russians_are_allied_desc: "С нечестивым союзом Германии и России, предположительно доминирующим над всей Европой, Франция должна положить им конец! С таким геополитическим развитием событий наши соотечественники стали еще более ревностными в защите родины.\n\nПетух Запада будет торжествовать над Орлами Востока!" #NT!
