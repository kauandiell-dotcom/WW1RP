 ENG_Staff: "Английский персонал" #NT!
 ENG_Staff_desc: "Британская армия во время Первой мировой войны могла проследить свою организацию до растущих требований имперской экспансии. Основой была добровольная система набора и полковая система, которые были определены реформами Кардуэлла и Чайлдерса конца 19 века. Британская армия была подготовлена ​​и в первую очередь призвана для решения имперских вопросов и последующих колониальных войн. В последние годы 19 века армия была вовлечена в крупный конфликт, Вторую англо-бурскую войну (1899-1902), которая выявила недостатки в ее тактике, руководстве и управлении." #NT!
