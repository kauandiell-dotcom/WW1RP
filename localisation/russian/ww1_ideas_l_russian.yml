 CHI_idea_sun_yatsen_president: "Генералиссимус Сунь Ятсен" #NT!
 CHI_idea_sun_yatsen_president_desc: "Сунь Ятсен, ключевой архитектор Китайской республиканской революции, является генералиссимусом правительства конституционной защиты в Гуанчжоу, провинция Гуандун. Но его положение шаткое, поскольку у него нет военной власти." #NT!
 CHI_idea_sun_yatsen_president_2_desc: "Сунь Ятсен, ключевой архитектор Китайской республиканской революции, является генералиссимусом правительства конституционной защиты в Гуанчжоу, провинция Гуандун. Он вернулся в Гуанчжоу, чтобы возглавить южное правительство в сотрудничестве с гуандунским военачальником Чэнь Чжунмином. Он мечтает о националистической революции оттуда в Пекин." #NT!
