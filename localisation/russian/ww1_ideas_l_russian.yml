 GER_idea_tokyo_pact: "Пакт Токио-Берлин" #NT!
 GER_idea_tokyo_pact_desc: "§!Подписавшие Токийско-Берлинский пакт обязаны присоединиться§! §YГермании§!§! или§! §YЯпонии§! §!в случае колониальной войны.§!" #NT!
 GER_idea_nazism: "Националистическая агитация" #NT!
 GER_idea_nazism2: "Нацистская агитация" #NT!
 GER_idea_nazi_purge: "Ночь длинных ножей" #NT!
 GER_idea_nazi_purge_desc: "После прихода к власти Адольфа Гитлера он очистил Sturmabteilung, военизированные формирования нацистской партии и немецкого вермахта, а также других антинацистов. Теперь никто не может бросить вызов его власти в Германии." #NT!
