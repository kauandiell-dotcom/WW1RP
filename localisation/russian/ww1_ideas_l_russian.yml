 GER_idea_schutztruppe: "Schutztruppe" #NT!
 GER_idea_colonial_exploitation: "Колониальная эксплуатация" #NT!
 GER_idea_abwehr_support: "Немецкое золото" #NT!
 GER_idea_abwehr_support_desc: "Революция спонсируется немецкими властями. Среди лидеров большевиков много агентов Абвера, и им успешно удаётся скрыть этот факт от революционеров." #NT!
 GER_idea_abwehr_supports_revolution: "Финансирует русских революционеров" #NT!
 GER_idea_freikorps: "Националистический Фрайкор" #NT!
 GER_idea_freikorps_desc: "Поскольку немецкая армия сократилась, немецкие солдаты формируют собственные добровольческие корпуса, чтобы сохранить целостность нации." #NT!
 GER_idea_kiel_mutiny: "Кильский мятеж" #NT!
 GER_idea_kiel_mutiny_desc: "Подавление восстания матросов в Киле отразилось на революционном движении. Общество раскололось. Для Германии наступили тяжелые времена." #NT!
 GER_idea_stuggle_for_power: "Борьба за власть" #NT!
 GER_idea_stuggle_for_power_desc: "Германская Республика нестабильна, политические силы социалистов, коммунистов и даже консерваторов сейчас ведут кровавую борьбу за установление собственной власти." #NT!
 GER_idea_OHL: "Генеральный штаб" #NT!
 GER_idea_OHL_desc: "Oberste Heeresleitung (OHL) — высший эшелон командования армией Германской империи. Влияние штаба настолько велико, что он может стать опасной политической силой в стране." #NT!
 GER_idea_OHL1: "Генеральный штаб" #NT!
 GER_idea_OHL1_desc: "Oberste Heeresleitung (OHL) — высший эшелон командования армией Германской империи. Влияние штаба настолько велико, что он может стать опасной политической силой в стране." #NT!
 GER_idea_OHL2: "Генеральный штаб" #NT!
 GER_idea_OHL2_desc: "Oberste Heeresleitung (OHL) — высший эшелон командования армией Германской империи. Влияние штаба настолько велико, что он может стать опасной политической силой в стране." #NT!
 GER_idea_OHL3: "Генеральный штаб" #NT!
 GER_idea_OHL3_desc: "Oberste Heeresleitung (OHL) — высший эшелон командования армией Германской империи. Влияние штаба настолько велико, что он может стать опасной политической силой в стране." #NT!
 GER_idea_OHL_dictatorship: "Диктатура Генерального штаба" #NT!
 GER_idea_OHL_dictatorship_desc: "Oberste Heeresleitung (OHL) — высший эшелон командования армией Германской империи. Практически все внутренние дела страны находятся в ведении OHL. Генералы способны навязывать свою волю даже кайзеру, что может подорвать авторитет правителя." #NT!
 GER_idea_norddeutscher_bund_legacy: "Наследие Северогерманского союза" #NT!
 GER_idea_norddeutscher_bund_legacy_desc: "Германия нерушима и неделима! Наследие прошлых лет на многие столетия вперед определило величие Германской империи." #NT!
 GER_idea_gross_kaiserreich: "Большой императорский рейх" #NT!
 GER_idea_republican_spirit: "Республиканский дух" #NT!
 GER_idea_republican_spirit_desc: "Германия готова пожертвовать империалистическими амбициями ради создания идеального демократического общества." #NT!
 GER_idea_prussian_militarism: "Прусский милитаризм" #NT!
 GER_idea_prussian_militarism_desc: "Немецкая армия пройдёт маршем от Берлина до вражеской столицы. Как это делали наши отцы и деды." #NT!
 GER_idea_isolation_of_adriatic_sea: "Изолированное Адриатическое море" #NT!
 GER_idea_isolation_of_adriatic_sea_desc: "Германия и Италия оказывают экономическое давление, блокируя торговые пути в Адриатике. Похоже, они к чему-то готовятся." #NT!
 GER_idea_german_military_advisors: "немецкие советники" #NT!
 GER_idea_german_military_advisors_desc: "Часть командных функций в нашей армии взял на себя немецкий штаб." #NT!
 GER_idea_hindenburg_programme: "Программа Гинденбурга" #NT!
 GER_idea_militarize_youth: "Милитаризация молодежи" #NT!
 GER_idea_wilhelm_ii: "Кайзер Вильгельм II" #NT!
 GER_idea_wilhelm_ii_desc: "Мы, Вильгельм, милостью Божией, король Пруссии, маркграф Бранденбурга, государь и верховный герцог Силезии, великий герцог Нижнего Рейна и Познани, герцог Саксонии, Вестфалии и Померании, Люнебурга и Бремена, Гольштейна, Шлезвига. и Лауэнбург, бургграф Нюрнберга, ландграф Гессен, принц Восточной Фризии, Оснабрюка и Хильдесхайма, Нассау и Фульды, граф Гогенцоллерн, лорд Франкфурта." #NT!
 GER_idea_army_reform: "Реформа армии" #NT!
 GER_idea_army_reform2: "Бундешир" #NT!
 GER_idea_army_reform3: "Элитный Бундескорпс" #NT!
 GER_idea_reformed_staff: "Реформированный Генеральный штаб" #NT!
 GER_idea_abwehr: "Императорский абвер" #NT!
 GER_idea_central_powers_joint_staff: "Объединенный штаб центральных держав" #NT!
 GER_idea_central_powers_joint_staff2: "Объединенный штаб Центральных держав" #NT!
 GER_idea_aviation_cult: "Культ авиации" #NT!
 GER_idea_colonial_elite: "Немецкая колониальная элита" #NT!
 tokyo_pact: "§YГермано-японский пакт§!" #NT!
 GER_legation_profits: "Прибыль посольских учреждений" #NT!
 GER_legation_profits_desc: "Мы создали Международное концессионное правительство и пожинаем плоды." #NT!
 SHL_kiel_canal_profits: "Прибыль от канала Кайзера Вильгельма" #NT!
 SHL_kiel_canal_profits_desc: "Канал кайзера Вильгельма является жизненно важным районом для торговли на Балтике, и мы извлекаем из этого значительную выгоду." #NT!
 GER_german_staff_planning_auh: "Планирование немецкого персонала" #NT!
 GER_german_staff_planning_auh_desc: "Немецкие штабы сосредоточили внимание на нашем фронте." #NT!
 GER_german_staff_planning: "Совместное планирование" #NT!
 GER_german_staff_planning_desc: "Наш штаб отправил в расположение союзной армии несколько высокопоставленных генералов." #NT!
 GER_state_in_blockade: "Государство в блокаде" #NT!
 GER_state_in_blockade_desc: "Страна находится во вражеской блокаде. Они ожидают, что полная экономическая изоляция спровоцирует голод, подорвет наш моральный дух." #NT!
 GER_quenched_militarism: "Погасший милитаризм" #NT!
 GER_quenched_militarism_desc: "Победа всегда имеет свою цену, и Вельткриг не был похож ни на одну войну, которую когда-либо видел мир. Хотя мы, возможно, и победили, это не вернуло наших парней домой. Наши семьи до сих пор ясно помнят ту боль и не горят желанием испытать ее снова." #NT!
 GER_mitteleuropa: "Миттельевропа" #NT!
 GER_mitteleuropa_desc: "Мы являемся лидером Mitteleuropa, пакта об экономическом сотрудничестве, который помогает нам проецировать силу." #NT!
 GER_reformed_economy: "Реформированная экономика" #NT!
 GER_representative_reform_idea: "Реформа представительства" #NT!
 GER_idea_hitler_arrested: "Пивной путч провалился" #NT!
 GER_idea_hitler_arrested_desc: "Адольф Гитлер был арестован за провал путча в Мюнхенской пивной. Но его сторонники все еще существуют, и даже в суде его считали настоящим патриотом." #NT!
 GER_ss_idea: "Schutzstaffel" #NT!
 GER_ss_idea_desc: "Schutzstaffel (SS) — крупнейшая военизированная организация Адольфа Гитлера и нацистской партии в нацистской Германии." #NT!
 GER_idea_colonial_exploitation_interwar: "Колониальная эксплуатация" #NT!
 GER_idea_colonial_exploitation_interwar_desc: "Колониальная администрация жестоко и эффективно извлекает отсюда столько, сколько может. Хотя небольшие реформы были проведены здесь и там, в конце концов, все, что мы для жителей материка — это огромное денежное корыто, в которое они суют свои грязные, жадные лапы." #NT!
 GER_dysfunctional_government: "Недееспособное правительство" #NT!
 GER_dysfunctional_government_desc: "Правительство [ROOT.GetName] невероятно плохо управляется, с автономной военной администрацией и заброшенной гражданской администрацией. Корпорации дичают, а коррупция процветает." #NT!
 GER_roter_frontkampferbund: "Roter Frontkampferbund" #NT!
 GER_political_commissars_idea: "Политические комиссары" #NT!
 GER_military_out_of_control: "Военные вышли из-под контроля" #NT!
 GER_military_out_of_control_desc: "Наши войска еще не смирились с поражением в Великой войне. Они поддерживают потерянную империю, а не нашу республику, и весьма консервативны. Их невозможно контролировать без переговоров с главой армейского командования Гансом фон Сектом." #NT!
 GER_holy_order: "Святой Орден" #NT!
 ger_famine: "Зимняя репа" #NT!
 ger_famine_desc: "Единственная еда, которая у нас есть, — это хлеб Гинденбург..." #NT!
 ger_famine_early: "Нехватка продовольствия" #NT!
 ger_famine_early_desc: "Солдаты и граждане [ROOT.GetNameDef] сейчас голодают из-за вражеских морских блокад..." #NT!
 GER_idea_ludendorff_offensive: "Наступление Людендорфа" #NT!
 GER_idea_ludendorff_offensive_desc: "Наша армия делает все возможное, чтобы прорваться через Западный фронт, который застрял в позиционной войне. Как будто это последний раз..." #NT!
 GER_idea_treaty_of_rapallo: "Рапалльский договор" #NT!
 GER_idea_treaty_of_rapallo_desc: "Тост за нашу германо-советскую дружбу!" #NT!
 GER_idea_kapp_illegitimate_government: "Незаконное правительство" #NT!
 GER_idea_kapp_illegitimate_government_desc: "Действующее правительство не признано легитимным на национальном уровне. Политические беспорядки будут продолжаться, пока мы не стабилизируем ситуацию." #NT!
 GER_idea_sino_german_company: "Китайско-германская компания" #NT!
 GER_idea_sino_german_company_desc: "Тост за нашу китайско-германскую дружбу!" #NT!
 GER_financial_crisis_of_agadir: "Финансовый кризис Агадира" #NT!
 GER_idea_default: "По умолчанию" #NT!
 GER_idea_default_desc: "Нет возможности выплатить эти репарации. Теперь мы разорены." #NT!
 GER_idea_default_tt: "§YВыплата возмещения полностью остановлена, и на вас не повлияют никакие модификаторы, связанные с идеей возмещения.§!" #NT!
 GER_idea_hyperinflation: "Гиперинфляция" #NT!
 GER_idea_naval_arms_race_desc: "Больше дредноутов! Больше орудий!" #NT!
 OST_colonial_question: "Колониальный вопрос" #NT!
 OST_colonial_question_desc: "Количество рабочей силы, которую может набрать наше наземное подразделение, сильно ограничено. Строгие правила, касающиеся вступления иностранных граждан, и общее отсутствие желания со стороны местных жителей подавляют наши попытки создать более крупные силы." #NT!
 OST_Protecting_GER_interest: "Защита интересов Германии" #NT!
 OST_Protecting_GER_interest_desc: "Основная цель [OST.GetName] — обеспечить продолжение торговли с [GER.GetName], а часть этой цели — обеспечить защиту интересов Германии..." #NT!
 race_to_the_sea: "Гонка к морю" #NT!
 MAF_colonial_budget_idea: "[GetYear] Бюджет" #NT!
 MAF_colonial_budget_idea_desc: "Основную часть нашего бюджета мы получаем за счет субсидий и торговли, а также за счет свежих войск из Германии." #NT!
 MAF_British_Settlers: "Мандаты" #NT!
 MAF_British_Settlers_desc: "Бывшие британские колонии находятся под немецким мандатом с момента распада Британской империи после Первой мировой войны. Их правительственные структуры остаются в значительной степени нетронутыми, хотя власть все больше консолидируется в руках горстки богатых землевладельцев.\n\nПоскольку мы не можем напрямую взаимодействовать с их управлением, это может оказаться проблемой в долгосрочной перспективе." #NT!
 MAF_belgian_investment: "Бельгийские инвестиции" #NT!
 MAF_belgian_investment_desc: "Бельгийцы были здесь задолго до нас как колониальная держава, и они никогда не уезжали. У нас удобные и рабочие отношения со многими горнодобывающими компаниями, которые фактически расширили свои первоначальные владения в Конго. Если мы продолжим эту политику, мы сможем пожинать плоды их капитала." #NT!
  
 socialism_banned: "Социализм под запретом" #NT!
  
  #AUSTRIA-HUNGARY 
 AUH_ww1_House_Habsburg_Lorraine: "Дом Габсбургов-Лотарингских" #NT!
 AUH_ww1_House_Habsburg_Lorraine_desc: "Дом Габсбургов-Лотарингских — один из самых влиятельных королевских домов Европы и правящая династия Австро-Венгрии. Длительное наследие этой семьи на троне Империи дает им большую часть необходимой легитимности для поддержания своего правления, пока они могут его поддерживать." #NT!
 Austrian_staff: "Австрийский персонал" #NT!
 Austrian_staff_desc: "Имперский и королевский генеральный штаб Австро-Венгрии был частью военного министерства. Его возглавлял начальник Генерального штаба всех вооруженных сил, который имел прямой доступ к императору. Генеральный штаб отвечал за планирование и подготовку, в то время как Armeeoberkommando (AOK) было оперативным верховным командованием. Фактически, поскольку AOK находился под прямым командованием императора, а начальник генерального штаба был его главным советником, на практике AOK находился под контролем начальника генерального штаба." #NT!
 AUH_ww1_Trialism: "Триализм" #NT!
 AUH_ww1_Trialism_desc: "В истории Австро-Венгрии триализмом называют политическое движение, целью которого было преобразование двусоставной империи в трехсоставную, создание хорватского государства, равного по статусу Австрии и Венгрии." #NT!
 AUH_czech_separatism: "Парламент Чехии" #NT!
 AUH_czech_separatism_desc: "Богемия — промышленный центр империи. Однако наша администрация подвергается политическим нападкам со стороны чешских профсоюзов и националистов. Чтобы обеспечить себе господство над Богемией, мы должны одержать над ними верх." #NT!
 AUH_croatian_separatism: "Южнославянские террористы" #NT!
 AUH_croatian_separatism_desc: "В южных субъектах империи националистические организации используют радикальные методы борьбы за свою независимость. Мы уверены, что Сербия поддерживает националистов в этом регионе." #NT!
 AUH_croatian_separatism2: "Борьба с сербским терроризмом" #NT!
 AUH_croatian_separatism2_desc: "Полиция Австрии расследует теракты в Боснии и Хорватии. Мы обнаружили и полностью уничтожили несколько революционных групп, но в стране все еще существуют националистические движения." #NT!
 AUH_croatian_separatism_tt: "\n§YФранц Фердинанд§! может стать жертвой §Rтеррористической атаки§!." #NT!
 AUH_polish_separatism: "Бедность Галисии" #NT!
 AUH_polish_separatism_desc: "Регион Галисия подвергся широкомасштабной нищете при австрийской администрации. Голод, болезни и алкоголизм свирепствуют, в то время как австро-венгерское правительство и класс богатых землевладельцев эксплуатируют регион ради природных ресурсов. Галисия находится в ужасном бедственном положении, и мы должны выделять ресурсы в регион, чтобы предотвратить постепенное подрыв доверия к нашим институтам." #NT!
 AUH_polish_separatism2: "Эксплуатация Галицкой области" #NT!
 AUH_hungarian_opposition: "Венгерская оппозиция" #NT!
 AUH_hungarian_opposition_desc: "В Венгрии разразился политический кризис после расширения избирательных прав в королевстве. Хотя двойная монархия гарантирует Венгрии равный статус в пределах Империи, в нашей системе все еще присутствует венгерская оппозиция по некоторым вопросам." #NT!
 Austrian_international_staff: "Многонациональная армия" #NT!
 AUH_church_secularization: "Секуляризация церкви" #NT!
 AUH_church_secularization_desc: "Помимо католической и протестантской церквей, признаны крупнейшие церкви национальных меньшинств федерации." #NT!
 AUH_escort_production: "Австрийский Ллойд" #NT!
 AUH_escort_production_desc: "Государство реализует программу финансирования эскортных кораблей." #NT!
