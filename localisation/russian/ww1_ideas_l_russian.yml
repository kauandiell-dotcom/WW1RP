 TUN_caid_administration: "Администрация Каида" #NT!
 TUN_caid_administration_desc: "[TUN.getNameDef] управляется регионально каидами, назначаемыми генеральным резидентом. Эта местная элита сама назначает шейхов, ответственных за управление наиболее изолированными частями Туниса. Эта относительная автономия позволяет учитывать, защищать и облагать налогами местное население." #NT!
  
 TUN_resident_general_dictatorship: "Диктатура Генерального Резидента" #NT!
 TUN_resident_general_dictatorship_desc: "Хотя [TUN.getLeader] правит официально, вся национальная администрация находится в руках резидента-генерала Габриэля Алапетита. Относительная автономия протектората остается только тем, что французы готовы нам предоставить." #NT!
  
 MLI_disorganized_tribes: "Неорганизованные племена" #NT!
 MLI_disorganized_tribes_desc: "Несмотря на объединение вокруг [ROOT.getLeader], племена [ROOT.getAdjective] по-прежнему расходятся во мнениях по многим вопросам распределения и управления территорией, что порождает опасную фракционность внутри правительства." #NT!
  
