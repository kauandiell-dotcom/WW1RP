 CHI_idea_manchu_ethnic_problem_desc: "Династия Цин, китайская иммигрантская династия, основанная чжурчжэнями или маньчжурами, считала Маньчжурию своим местом происхождения и убежища и на некоторое время запретила китайцам-ханьцам въезд. Однако ограничение было снято в конце династии Цин, и многие китайцы-ханьцы мигрировали на обширные маньчжурские равнины. Кроме того, русские, японцы и корейцы также переселились в этот регион, расчищая и заселяя земли." #NT!
