 RUS_threat_of_revolution3_desc: "Движения социалистов-революционеров, большевиков и многих других планируют свергнуть царскую династию и установить республику. Однако каждое движение имеет свои собственные взгляды на то, как должна выглядеть будущая республика, и, вероятно, политическая борьба не закончится одной революцией." #NT!
