 FRA_jaures_in_danger_desc: "§YЖан Жорес§! §!может стать жертвой §!§Rтеррористической атаки.§!\n\nЧасть французского населения выступает против социальных мер, установленных с момента прихода к власти SFIO. Как представитель партии и нации, Жан Жорес становится привилегированной мишенью для крайне правых фанатиков." #NT!
