 garrison:0 "Гарнизон"
 garrison_desc:0 "Гарнизон — это войска второй линии, используемые для защиты ценных объектов вдали от линии фронта. Им не хватает тяжелой техники и транспорта, что делает их неподвижными, за исключением стратегической передислокации. Они имеют ограниченные противотанковые возможности, но могут быть использованы для высвобождения более боеспособных войск и техники для использования на передовой."