 desertinfantry_at:0"Пустынная пехота I"
 desertinfantry_at_desc:0"Песчаные горы пустыни могут быть опасны для вашей обычной пехоты. Чтобы справиться с такой ситуацией, мы можем обучить нашу пустынную пехоту одерживать верх в пустыне.\n \n§GЭтот тип отряда не учитывается при расчете лимита для спецназа, но вместо этого требует 5 единиц вспомогательного оборудования на батальон§!"
