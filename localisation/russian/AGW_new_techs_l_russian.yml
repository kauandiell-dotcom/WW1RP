 jaeger:0"Ягеря"
 jaeger_desc:0"На улице холодно, или это только у меня такое? \n \n§GЭтот тип отряда не учитывается при расчете лимита спецназа, но вместо этого требует 5 вспомогательного оборудования на батальон§!"

 jungletroop:0"Пехота джунглей"
 jungletroop_desc:0"Специалисты по джунглям обучены выдерживать суровые условия войны в джунглях и бросать вызов врагу на их условиях.\n \n§GЭтот тип отряда не учитывается при расчете лимита спецназа, но вместо этого требует 5 единиц вспомогательного оборудования на батальон§!"

 desertinfantry:0"Desert Infantry"
 desertinfantry_desc:0"Combat in the Desert ranges exposes troops to many perils but sometimes cannot be avoided. We can minimize these risks by providing our soldiers with specialized training for this environment.\n \n§GThis unit type does not count toward the Special Forces cap but instead requires 5 Support Equipment per Battalion§!"

 shocktroop:0"Ударные войска"
 shocktroop_desc:0"Ударные войска используются для мощного штурма оборонительных линий противника с целью прорыва в определенных местах. Эти подразделения имеют более высокий прорыв и сильную атаку по сравнению с обычной пехотой. Однако Ударные войска или Штоструппены также имеют более высокий расход припасов и увеличенное время восстановления."

