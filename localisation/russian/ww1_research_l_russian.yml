 early_grenades: "Ранние гранаты" #NT!
 early_grenades_desc: "На рубеже XX века неэффективность имеющихся типов ручных гранат в сочетании с их опасностью для пользователя и сложностью эксплуатации привели к тому, что они стали считаться все более устаревшим видом военного снаряжения." #NT!
 basic_grenades: "Ручные гранаты" #NT!
 basic_grenades_desc: "После успеха самодельных гранат в условиях позиционной войны была быстро проведена переоценка с целью разработки практичной ручной гранаты." #NT!
 improved_grenades: "Гранаты осколочные" #NT!
 improved_grenades_desc: "Первая «безопасная граната». Стальные канистры, заполненные взрывчатым веществом, с пусковым штифтом и характерной глубокой насечкой на поверхности. Часто ошибочно полагают, что сегментация способствует фрагментации," #NT!
 advanced_grenades: "Газовые гранаты" #NT!
 advanced_grenades_desc: "Гранаты калибра 26 мм, снаряженные этилбромацетатом или хлорацетоном." #NT!
  
