 electrical_engineering: "Электротехника" #NT!
 electrical_engineering_desc: "Используя невидимые электроны, которые есть практически повсюду, мы можем создавать разнообразные электрические устройства и оборудование, выходящие за рамки простого физического функционирования." #NT!
 mechanical_engineering: "Двигатель внутреннего сгорания" #NT!
 mechanical_engineering_desc: "Газ высокой температуры и давления, образующийся при сгорании топлива и окислителя, заставляет механические устройства двигателя, такие как поршни, выталкиваться. Речь идет о преобразовании этой энергии в импульс." #NT!
 chemical_research: "Химические исследования" #NT!
 chemical_research_desc: "В нашем мире существует бесчисленное множество элементов, в отличие от того, что древние люди привыкли думать, что только вода, огонь, воздух и почва — это все в мире. И если мы научимся обращаться с этими вещами, мы сможем создать огромное количество соединений. И здесь есть бесконечные возможности." #NT!
 aircraft_engine: "Авиационный двигатель" #NT!
 aircraft_engine_desc: "Двигатель с большой мощностью даже поднимет в небо тяжелую технику." #NT!
 UNLOCK_VEHICLE: "Позволяет исследовать моторизованные транспортные средства." #NT!
 UNLOCK_AIRCRAFT: "Позволяет исследовать авиационную технику." #NT!
 UNLOCK_AIRCRAFT2: "Позволяет исследовать самолеты Interbellum." #NT!
 UNLOCK_TANKS: "Позволяет исследовать первый танк." #NT!
 UNLOCK_TANKS2: "Позволяет исследовать подтехнологии танков." #NT!
 UNLOCK_SUBMARINE: "Позволяет исследовать подводные технологии." #NT!
 UNLOCK_SUBMARINE2: "Позволяет исследовать подводную лодку класса «Атлантик»." #NT!
 tank_design: "Проектирование прототипа танка" #NT!
 tank_design_short: "Прототип танка" #NT!
 tank_design_desc: "Чтобы положить конец ужасной позиционной войне, мы построили машины, оснащенные толстыми стальными пластинами по всему периметру, чтобы они были практически неуязвимы для пехотного огня, и имеющие гусеницы вместо колес, чтобы безопасно передвигаться по неровной местности." #NT!
 generator_battery: "Дизельный генератор и аккумулятор" #NT!
 generator_battery_desc: "Всего несколько десятилетий назад немецкий инженер по имени Рудольф Дизель разработал другой способ двигателя, который получал энергию путем распыления топлива в горячий сжатый воздух и заставлял его самовозгораться. И он называется дизельным двигателем в его честь." #NT!
 turbocharger: "Турбокомпрессор" #NT!
 turbocharger_desc: "Сжимая воздух и делая его плотным, он может доставлять в двигатель больше кислорода. Это означает, что он становится более эффективным." #NT!
 tank_classification: "Классификация танков" #NT!
 tank_classification_desc: "Классификация танков" #NT!
 advanced_generator: "Расширенный генератор" #NT!
 advanced_generator_desc: "Расширенный генератор" #NT!
 tank_design_standartization_and_unification: "Стандартизация и унификация конструкций резервуаров" #NT!
 tank_design_standartization_and_unification_desc: "Стандартизация и унификация конструкций резервуаров" #NT!
 advanced_aircraft_design: "Усовершенствованная конструкция самолета" #NT!
 advanced_aircraft_design_desc: "Усовершенствованная конструкция самолета" #NT!
 amplitude_modulation: "Амплитудная модуляция" #NT!
 amplitude_modulation_desc: "Модуляция сигнала позволяет отправлять голосовые сообщения или транслировать музыку по беспроводной связи." #NT!
 advanced_radio: "Расширенное радио" #NT!
 advanced_radio_desc: "Дальнейшее развитие радио заключается не только в повышении мощности сигнала, появлении дуплексной связи, но и в уменьшении габаритов станций, что сделало их более мобильными." #NT!
 analytical_engine: "Аналитическая машина" #NT!
 analytical_engine_desc: "Аналитическая машина" #NT!
 electromechanical_adding_machine: "Электромеханическая счетная машина" #NT!
 electromechanical_adding_machine_desc: "Электромеханическая счетная машина" #NT!
 differential_analyzer: "Дифференциальный Анализатор" #NT!
 differential_analyzer_desc: "Дифференциальный анализатор можно считать первым аналоговым компьютером." #NT!
 basic_electronic_engineering: "Основы электронной инженерии" #NT!
 basic_electronic_engineering_desc: "Основы электронной инженерии" #NT!
 basic_cryptography: "Базовая криптография" #NT!
 basic_cryptography_desc: "Базовая криптография" #NT!
 advanced_cryptography: "Расширенная криптография" #NT!
 advanced_cryptography_desc: "Расширенная криптография" #NT!
 encryption_machine: "Шифровальная машина" #NT!
 encryption_machine_desc: "Устройства, которые могут выполнять логические операции для шифрования передаваемого кода. Разведки всего мира готовы сделать все, чтобы расшифровать шифр машины Энигма." #NT!
 basic_cryptanalysis: "Базовый криптоанализ" #NT!
 basic_cryptanalysis_desc: "Базовый криптоанализ" #NT!
 advanced_cryptanalysis: "Расширенный криптоанализ" #NT!
 advanced_cryptanalysis_desc: "Расширенный криптоанализ" #NT!
 decryption_machine: "Машина дешифрования" #NT!
 decryption_machine_desc: "Машина для расшифровки" #NT!
 early_fire_control_system: "Ранняя система управления огнем" #NT!
 early_fire_control_system_desc: "Ранние системы управления огнем создавались на основе оригинальных механических вычислительных устройств. В некотором смысле, это были гигантские калькуляторы для расчета дальности или направления." #NT!
  # LAND DOCTRINES 
 ww1_landdoctrine: "Культ наступления" #NT!
 ww1_landdoctrine_desc: "Наступательные возможности современных армий стали настолько обширными, что оборона оказалась почти устаревшей. Мы должны сосредоточиться на концентрации всех наших усилий на наступлении, сделав единственным жизнеспособным методом обороны контратаку. Жизненный порыв наших солдат — ключ к победе в современной войне." #NT!
 ww1_lead_by_order: "Руководить по приказу" #NT!
 ww1_lead_by_order_desc: "Тактический уровень войны неотделим от стратегического уровня. Наше верховное командование разработало стратегические планы военных кампаний, в то время как работа младших офицеров заключается в том, чтобы подчиняться приказам и передавать их своим подчиненным, заставляя армию действовать как единое целое." #NT!
 ww1_lead_by_task: "Руководствуйтесь задачей" #NT!
 ww1_lead_by_task_desc: "Стратегический уровень войны неотделим от тактического уровня. Наше верховное командование придумало множество блестящих планов, но не всегда их планы соответствуют реалиям поля боя. С другой стороны, наши младшие офицеры имеют больше информации для понимания того, как выполнить задачу с минимальными потерями, и мы должны поощрять это." #NT!
 ww1_entrenchment: "Окопная война" #NT!
 ww1_entrenchment_desc: "Война не закончилась так быстро, как мы ожидали, и чтобы удержать наши недавно завоеванные территории, нам нужно начать укреплять наши линии фронта. Строительство траншей обеспечит достаточное укрытие для наших войск, пока мы будем готовить прорыв, чтобы победить врага." #NT!
 ww1_preliminary_bombardment: "Предварительная бомбардировка" #NT!
 ww1_preliminary_bombardment_desc: "Лучший способ прорваться через вражеские линии — уничтожить вражеских защитников с помощью нашей тяжелой артиллерии. Проводя предварительную бомбардировку, мы сможем очистить траншеи противника, чтобы наша пехота захватила их с минимальными потерями." #NT!
 ww1_infiltration: "Проникновение" #NT!
 ww1_infiltration_desc: "Иногда качество превосходит количество. Вместо того, чтобы бросать нашу обычную пехоту в волновые атаки, мы могли бы обучить специальные подразделения, оснащенные нашими новейшими технологиями, прорываться через самые слабые места противника, чтобы получить позиционное преимущество." #NT!
 ww1_creeping_barrage: "Ползучий шквал" #NT!
 ww1_creeping_barrage_desc: "Вместо того, чтобы пытаться разбомбить вражескую армию до основания, мы могли бы использовать артиллерию для поддержки наших войск в их продвижении. Обстреливая нейтральное пространство артиллерией в темпе пехоты, мы можем нейтрализовать способность противника атаковать наших людей до тех пор, пока не станет возможным ближний бой." #NT!
 ww1_bite_and_hold: "Укуси и держи" #NT!
 ww1_bite_and_hold_desc: "Вместо того чтобы стремиться к решительной победе в одном наступлении, мы могли бы начать довольно мелкомасштабную операцию, чтобы вклиниться в линию обороны противника и удерживать ее при поддержке нашей артиллерии, заставляя противника терять людей в бесчисленных контратаках." #NT!
 ww1_defence_in_depth: "Глубокая оборона" #NT!
 ww1_defence_in_depth_desc: "Вместо того чтобы сосредоточить нашу пехоту на одной линии фронта, всегда готовую к атаке, мы распределим нашу оборону по нескольким линиям, сделав фланги противника уязвимыми для контратак нашего мобильного резерва и вызвав его истощение." #NT!
 ww1_hurricane_bombardment: "Ураганная бомбардировка" #NT!
 ww1_hurricane_bombardment_desc: "Вместо того, чтобы последовательно бомбардировать противника в течение нескольких дней, мы должны сосредоточиться на интенсивных, но коротких бомбардировках прямо перед нашим наступлением. В отличие от предварительной бомбардировки или ползучего заграждения, ураганная бомбардировка, которая нацелена на коммуникации и пушки противника, дезорганизует противника и затрудняет для него определение точного момента нашей атаки." #NT!
 ww1_tank_support: "Бронированная поддержка" #NT!
 ww1_tank_support_desc: "Мы создали настоящего технологического монстра. Танки, гусеничные крепости с пушками, могут стать дополнительным средством поддержки прорыва нашей пехоты из-за своей защищенности, которая позволяет им сокрушать проволочные заграждения и пулеметные гнезда противника, позволяя пехотинцам безопасно вступать в бой." #NT!
 ww1_artillery_support: "Materialschlacht" #NT!
 ww1_artillery_support_desc: "К сожалению, мы не смогли вовремя понять ценность некоторых великих технологических достижений, таких как бронемашины или танки. Будучи врагом, превосходящим нас в новых технологиях, мы можем компенсировать это, сосредоточившись на снабжении нашей пехоты большим количеством автоматов, стальных касок, гранат и артиллерийской поддержки. Лучший материал выиграет войну, и наша промышленность обеспечит его." #NT!
 ww1_combined_arms: "Совместные войска" #NT!
 ww1_combined_arms_desc: "Танки, газ и авиация навсегда изменили облик современной войны. С появлением новых технологий и методов, разработанных для обеспечения преимущества над противником, стало ясно, что война на истощение больше не является жизнеспособной стратегией для победы в этой войне. Вместо этого мы бросим все оружие на врага, чтобы обеспечить победу в едином наступлении по всей линии фронта." #NT!
  
 motorised_infantry2: "Моторизованная пехота" #NT!
 motorised_infantry2_desc: "Расширяя использование автотранспортных средств для перевозки пехоты в полевых условиях, можно значительно повысить мобильность пехотных подразделений, которые в противном случае передвигались бы медленно, что позволит быстрее реагировать и разрабатывать новые стратегии." #NT!
