 ENG_destroyer_1918_desc: "Эти эсминцы включали классы Admirality и Thornycroft V и W. Они были построены в рамках Программы чрезвычайной военной помощи. Они были окончательной эволюцией британского дизайна эсминцев во время Первой мировой войны, воплощая в себе усовершенствования своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено на поздних этапах Первой мировой войны и впоследствии стало основой флотилий эсминцев Королевского флота. Начиная с 1930-х годов они были переведены в резервные флоты, в конечном итоге использовались для сопровождения конвоев. Это были достаточно вооруженные, быстрые суда с хорошей дальностью плавания." #NT!
