 # GUIs:
 OPEN_INSULT_EXPANDED_DIPLO_ACTIONS_TT: "§GClick§! чтобы посмотреть дипломатические действия."
 
 SEND_INSULT_DIPLO_ACTION_TITLE: "Отправить послание"
 SEND_INSULT_DIPLO_ACTION_TT: "Отправить дипломатическое послание правительству §Y[This.GetNameWithFlag]§!. [This.GetSendInsultConditionsTooltip]"
 
 INSULT_EXPANDED_POPUP_SENDER_TITLE: "Послание"
 INSULT_EXPANDED_POPUP_SENDER_SHORT_DESC: "Отправить дипломатическое послание правительству §Y[?selected_country_to_insult.GetNameWithFlag]§!."
 INSULT_EXPANDED_POPUP_SENDER_DESC: "Вы точно хотите отправить послание §Y[?selected_country_to_insult.GetNameWithFlag]§!? \n\n§YЭто будет иметь такие еффекты:§! [This.GetSendInsultStabilityEffect]\nБазовая поддержка войны: §R-2.00%§!. [This.GetInsultTensionEffect]\n\n(§Y§Y[?selected_country_to_insult.GetNameWithFlag]§!§!): [This.GetReceiveInsultStabilityEffect]\nМнение [This.GetFlag] §Y[This.GetName]§! §R-50§!. \nДает следующие бонусы на §Y30 дней§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя оправдания цели войны: §G-10.0%§! \nМировая напряженность для фабрикации цели войны: §Y-5.0%§! \nДает следующие бонусы на §Y180 дней§!: \nБонус на атаку против [This.GetName]: §G+10.0%§!"
 INSULT_EXPANDED_POPUP_SENDER_ENTRY: "§H[This.GetRandomizedInsultEntry]§!"
 INSULT_EXPANDED_POPUP_SENDER_CUSTOM_ENTRY: "§H[This.GetInsultTypedText]§!"
 RANDOMIZE_INSULT_BUTTON_TT: "§GClick§! выбрать другое случайное послание. \n§GRight-click§! чтобы открыть или закрыть список со всеми оскорблениями которые вы можете выбрать."
 
 SEND_INSULT_BUTTON_TT: "§Y[This.GetNameWithFlag]§! отправляет выбранное послание §Y[?selected_country_to_insult.GetNameWithFlag]§!. [This.GetSendInsultButtonConditionsTooltip]"
 
 INSULT_EXPANDED_POPUP_RECEIVER_TITLE: "Дипломатическое послание"
 INSULT_EXPANDED_POPUP_RECEIVER_SHORT_DESC: "Мы только что получили это непристойное послание. \n§Y[This.GetNameWithFlag]§! должен заплатить за это неприемлемое действие!"
 INSULT_EXPANDED_POPUP_RECEIVER_ENTRY: "§H[This.GetReceivedInsultEntry]§!"
 INSULT_EXPANDED_POPUP_RECEIVER_CUSTOM_ENTRY: "§H[This.GetInsultTypedReceivedText]§!"
 INSULT_EXPANDED_POPUP_RECEIVER_DESC: "§YThis послание будет иметь следующие еффекты:§! [This.GetReceiveInsultStabilityEffect]\nМнение об §Y[This.GetNameWithFlag]§! §R-50§!. \nGains the following bonuses for §Y30 days§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя оправдания цели войны: §G-10.0%§! \nМировая напряженность для фабрикации цели войны: §Y-5.0%§! \nДает следующие бонусы на §Y180 дней§!: \nБонус на аттку  против [This.GetName]: §G+10.0%§! \n\n(§Y[This.GetNameWithFlag]§!): [This.GetSendInsultStabilityEffect]\nБазовая поддержка войны: §R-2.00%§!. [This.GetInsultTensionEffect]"
 
 RECEIVED_INSULT_OK_BUTTON_TT: "§Y[This.GetNameWithFlag]§! Послание нам."
 
 INSULT_BACK: "Ответное послание"
 INSULT_BACK_TT: "Отправить Послание обратно. [This.GetSendInsultConditionsTooltip]"
 
 ROOT_COULD_INSULT_TARGET_NORMALLY_TOO: "Мы можем отправить послание в эту страну"
 
 WRITE_INSULT_BUTTON_TT: "§GClick§! войти или выйти из режима написания собственного послания. \n§GRight-click§! чтобы убрать уже написанное послание."
 WRITE_INSULT_BUTTON_TT_DELAYED: "§RМаксимальный размер послания - 1000 символов.§!\n§HТолько Послания от А до Я, цифры и некоторые специальные символы разрешенны.§! \nВы можете написать послания обычно и удалите последний символ, нажав £DEL£. \n\nМожно использовать следующие специальные символы, горячая клавиша для их ввода указана в скобках позади них: \n§YМИНУС§! (§G-§!) \n§YПРОБЕЛС§! (§Gклавиша пробела§!) \n§YЗАПЯТАЯ§! (§G,§!) \n§YВопросительный знак§! (§GCtrl + Q§!) \n§YАпостроф§! (§GShift + ^§!) \n§Yточка§! (§G.§!) \n§YQuotation Mark§! (§GShift + 2§!) \n§YФигурные скобочки§! (§GShift + 1§!) \n§YОткрытая круглая скобка§! (§GShift + 8§!) \n§YЗакрытая круглая скобка§! (§GShift + 9§!)"
 
 SAVE_INSULT_BUTTON_TT: "§GClick§! чтобы открыть или закрыть окно для §Yсохранения§! и §Yзагрузки§! написанных оскорблений."
 
 INSULT_SAVE_BUTTON: "[This.GetInsultSaveButtonText]"
