 INSULT_SAVE_BUTTON_TT_DELAYED: "[This.GetInsultSaveButtonTooltipDelayed]"
 
 HAS_TYPED_INSULT: "The typed Послание has at least §Y1§! character"
 
 USE_INSULT_BUTTON: "[This.GetInsultListEntryName]"
 USE_INSULT_BUTTON_TT: "Текст этого послания: \n"§Y[This.GetInsultListEntryName]§!""
 USE_INSULT_BUTTON_TT_DELAYED: "§GClick§! чтобы выбрать это послание."
 
 # Scripted Localisation:
 string_cannot_send_insult_because_players_did_not_vote_yet: "\n\n§RОпрос между игроками еще не завершен. Как только станет известен результат, можно отправить оскорбление.§W"
