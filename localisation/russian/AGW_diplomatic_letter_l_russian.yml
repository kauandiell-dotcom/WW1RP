 string_cannot_send_insult_to_enemy: "\n\n§RМы не можем Послание §Y[This.GetNameWithFlag]§!, потому что мы уже воюем друг с другом.§W"
 string_cannot_send_insult_because_no_or_too_short_insult: "\n\n§RВы должны выбрать послание или ввести послание, длинной по крайней мере, §Y3§! символов.§W"
