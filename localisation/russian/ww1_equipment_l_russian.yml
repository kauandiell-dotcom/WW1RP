    strategic_bomber:   "Тяжелый бомбардировщик и жесткий дирижабль-бомбардировщик"

    armored_car_equipment_1:   "Ранний бронеавтомобиль"
    armored_car_equipment_1_desc:   "Если предыдущие бронеавтомобили представляли собой простые коммерческие модели с тонкими стальными пластинами, то эта модель была разработана с нуля для перевозки брони и легкого вооружения."  
    armored_car_equipment_2:   "Базовый бронированный автомобиль"  
    armored_car_equipment_2_desc:   "Улучшенная внутренняя компоновка и дополнительное место для хранения боеприпасов делают бронеавтомобиль более эффективным."  
    armored_car_equipment_3:   "Улучшенный бронеавтомобиль"  
    armored_car_equipment_3_desc:   "Изменения на поле боя требуют гораздо более тяжелого вооружения и более толстой брони, чтобы победить легкие подразделения противника и выжить, чтобы доложить об этом."  
    armored_car_equipment_4:   "Усовершенствованный бронированный автомобиль"  
    armored_car_equipment_4_desc:   "Изменения на поле боя требуют гораздо более тяжелого вооружения и более толстой брони, чтобы победить легкие отряды противника и выжить, чтобы доложить об этом."  
    howitzer_equipment:   "Гаубица"  
    howitzer_equipment_desc:   "Основная функция гаубицы — обеспечить эффективную и точную огневую поддержку пехоте во время атак и продвижения по полю боя. Это ценный актив для пехотных дивизий, предлагающий превосходную огневую мощь, тактическую универсальность, относительную мобильность и значительное психологическое воздействие."  
    howitzer_equipment_1:   "Гаубица"  
    howitzer_equipment_2:   "Улучшенная гаубица"  
    howitzer_equipment_2_desc:   "Длинноствольные гаубицы были, как правило, тяжелее и имели большую дальность стрельбы, чем короткоствольные. Они использовались для атаки укрепленных позиций и для дальней поддержки."  
    howitzer_equipment_3:   "Усовершенствованная гаубица"  
    howitzer_equipment_3_desc:   "Длинноствольные гаубицы были, как правило, тяжелее и имели большую дальность стрельбы, чем короткоствольные. Они использовались для атаки укрепленных позиций и для дальней поддержки."  
