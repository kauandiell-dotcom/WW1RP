    ENG_infantry_equipment_0:   "Ли-Метфорд MkI"  
    ENG_infantry_equipment_0_short:   "МЛМ"  
    ENG_infantry_equipment_0_desc:   "Основное пехотное снаряжение, разработанное в 19 веке"  
    ENG_infantry_equipment_1:   "Короткий магазин Lee-Enfield MkI"  
    ENG_infantry_equipment_1_desc: Smelly  "Укороченная и облегченная версия оригинального MLE — Rifle, Short, Magazine, Lee-Enfield или SMLE (иногда ее называют «Smelly», а не S, M, L, E) — была представлена ​​1 января 1904 года. Ствол теперь был по длине на полпути между оригинальной длинной винтовкой и карабином, 25,2 дюйма (640 мм). Визуальной торговой маркой SMLE был его тупой нос, и только прилив штыка выступал на небольшую часть дюйма за носовую часть, будучи смоделированным по образцу шведского кавалерийского карабина модели 1894 года."  
    ENG_infantry_equipment_1_short:   "SMLE МкI"  
    ENG_infantry_equipment_2:   "Короткий магазин Lee-Enfield MkIII"  
    ENG_infantry_equipment_2_short:   "СМЛЕ МкIII"  
    ENG_infantry_equipment_2_desc:   "SMLE MkIII отличался упрощенным расположением заднего прицела и фиксированным, а не скользящим, установленным на головке болта, направляющим заряжания. Конструкция цевья и магазина также была улучшена, а патронник был адаптирован для стрельбы новыми боеприпасами Mk VII High Velocity spitzer .303. Многие ранние модели, Magazine Lee-Enfield (MLE), Magazine Lee-Metford (MLM) и SMLE, были переделаны в соответствии со стандартом Mk III. Они называются Mk IV Cond., с различными звездочками, обозначающими подтипы."  
    ENG_infantry_equipment_3:   "Винтовка № 1 Mk V"  
    ENG_infantry_equipment_3_short:   "СМЛЭ МкВ"  
    ENG_infantry_equipment_3_desc:   "Конструкция SMLE была относительно дорогой в производстве из-за множества операций ковки и обработки. В 1920-х годах был проведен ряд экспериментов, приведших к изменениям конструкции, чтобы помочь решить эти проблемы, сократив количество сложных деталей и улучшив производственные процессы. SMLE Mk V (позже Rifle No. 1 Mk V) приняла новую апертурную прицельную систему, установленную на ствольной коробке, которая переместила задний прицел из его прежнего положения на стволе."  

