l_russian:
 super_heavy_tank_chassis_0: "Раннее шасси сверхтяжелого танка" #NT!
 side_hulled_canons: "Боковые каноны" #NT!
 side_hulled_canons_desc: "Две пушки, расположенные по бокам танка для увеличения огневой мощи." #NT!
 expanded_hull: "Удлиненный корпус" #NT!
 expanded_hull_desc: "Удлинение транспортного средства позволит ему преодолевать более широкие траншеи и повысит эффективность." #NT!
 defensive_assets: "Защитные Активы" #NT!
 defensive_assets_desc: "Чтобы повысить устойчивость наших кошек, нам нужно подумать о новых технологиях защиты." #NT!
 secondary_engine: "Вторичный двигатель" #NT!
 secondary_engine_desc: "Меньший двигатель помогает основному двигателю, чтобы получить большую скорость." #NT!
 tank_steam_engine: "Паровой двигатель" #NT!
 tank_steam_engine_desc: "Старомодный паровой двигатель, обеспечивающий минимальную мощность при более низкой себестоимости производства." #NT!
  
 maintenance_optimisation: "Оптимизация обслуживания" #NT!
 maintenance_optimisation_desc: "Транспортные средства стоят дорого и должны быть просты в обслуживании." #NT!
  
 turret_improvement: "Полностью вращающаяся башня" #NT!
 turret_improvement_desc: "Внедрение единой полностью вращающейся башни, несущей основное вооружение машины, превзойдет неподвижные надстройки." #NT!
  
 fuhrer_turret_improvement: "Улучшенные турели" #NT!
 fuhrer_turret_improvement_desc: "Наши текущие модели башен устарели и не используют весь потенциал современной войны. Верхний корпус должен быть увеличен для размещения двух членов экипажа." #NT!
  
 multi_turret_design: "Улучшение улучшенной башни" #NT!
 multi_turret_design_desc: "Мы можем повысить эффективность наших любимых, создав большие башни, способные вместить магазин, наводчика и командира." #NT!
  
 periscope: "Ранний Перископ" #NT!
 tank_periscope: "Ранний перископ" #NT!
 periscope_desc: "Перископ, используемый пехотой в окопах, представляет собой инновационную систему, позволяющую пользователю наблюдать за полем боя из безопасного места." #NT!
  
 strobe_sight: "Стробоскопический прицел" #NT!
 strobe_sight_desc: "Стобоскопическая башня с узкими щелями позволяет командиру наблюдать за полем боя, практически не имея шансов получить пулю." #NT!
  
 tank_pigeons: "Голуби" #NT!
 tank_pigeons_desc: "Голубей можно обучить доставлять сообщения в штаб-квартиру, хотя иногда они так и не возвращаются." #NT!
  
 tank_flags: "Флаги" #NT!
 tank_flags_desc: "Командир взвода использует различные флаги для связи со своей группой." #NT!
  
 long_range_radio: "Радиосвязь дальнего действия" #NT!
 long_range_radio_desc: "Вооружение танка оснащено системой радиосвязи, позволяющей передавать информацию в штаб в режиме реального времени." #NT!
  
 tank_long_range_radio: "Радиосистема" #NT!
  
 EQ_MOD_CAT_tank_long_range_radio_TITLE: "Радиосистема" #NT!
  
 light_tank_signal_chassis_0: "Ранний сигнальный легкий танк" #NT!
 light_tank_signal_chassis_desc: "Небольшой командирский радиотанк." #NT!
 light_tank_signal_chassis_1: "Базовый сигнальный световой танк" #NT!
 light_tank_signal_chassis_2: "Улучшенный сигнальный легкий танк" #NT!
 light_tank_signal_chassis_3: "Усовершенствованный сигнальный световой танк" #NT!
 medium_tank_signal_chassis_0: "Средний танк раннего сигнала" #NT!
 medium_tank_signal_chassis_desc: "Среднего размера машина, несущая в башне сигнальную установку для атаки укреплений и домов." #NT!
 medium_tank_signal_chassis_1: "Базовый сигнальный средний танк" #NT!
 medium_tank_signal_chassis_2: "Улучшенный сигнальный средний танк" #NT!
 medium_tank_signal_chassis_3: "Усовершенствованный сигнальный средний танк" #NT!
 heavy_tank_signal_chassis_0: "Ранний сигнальный тяжелый танк" #NT!
 heavy_tank_signal_chassis_desc: "Крупная машина, несущая в башне сигнальную установку для атаки укреплений и домов." #NT!
 heavy_tank_signal_chassis_1: "Базовый сигнальный тяжелый танк" #NT!
 heavy_tank_signal_chassis_2: "Улучшенный сигнальный тяжёлый танк" #NT!
 heavy_tank_signal_chassis_3: "Усовершенствованный сигнальный тяжелый танк" #NT!
 light_tank_signal_chassis: "Сигнальный световой танк" #NT!
 medium_tank_signal_chassis: "Средний танк сигнала" #NT!
 heavy_tank_signal_chassis: "Тяжелый танк сигнала" #NT!
