  ### Unit Limit Rules ### 
 RULE_GROUP_BATTALION_LIMIT_RULES: "Установка лимита батальона" #NT!
  
 RULE_BATTALION_LIMIT_OPTIONS: "Ограничения по батальонам" #NT!
 RULE_OPTION_STANDARD: "Применимо ко всем" #NT!
 RULE_UNIT_LIMIT_OPTIONS_STANDARD_DESC: "Были применены ограничения на количество батальонов, которые может построить ИИ, на основе количества их заводов и уровня экономического закона. Как только ИИ достигает этого предела, он просто прекращает строить новые батальоны. Этот предел также применяется к игроку, хотя для него это мягкий предел, и он получает штраф в зависимости от того, насколько сильно он превзошел лимит.\n\n§RОбратите внимание, что эта система введена для уменьшения неизбежного замедления, которое происходит по мере развития игры, поскольку именно количество действующих батальонов является основной причиной задержки системы.§!" #NT!
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY: "Применимо только к ИИ" #NT!
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY_DESC: "Были применены ограничения на количество батальонов, которые ИИ может построить, в зависимости от количества заводов и уровня экономического закона. Как только ИИ достигнет этого предела, они просто перестанут строить новые батальоны. При таких настройках нет ограничений на количество батальонов, которые игрок может построить, кроме их способности поставлять рабочую силу и оборудование.\n\n§RОбратите внимание, что это даст игроку значительное преимущество перед странами ИИ, которые в противном случае были бы полезны. сопоставимые сильные стороны.§!" #NT!
 RULE_OPTION_TURN_OFF: "Выключать" #NT!
 RULE_UNIT_LIMIT_OPTIONS_TURN_OFF_DESC: "Это полностью отключает систему ограничения батальонов.\n\n§RРекомендуется делать это только в том случае, если вас не смущает, что скорость игры по мере ее развития значительно снижается, или у вас ОЧЕНЬ мощный компьютер для запуска игры.§!" #NT!
  
 RULE_DEMOB_BATTALION_OPTIONS: "Демобилизация батальонов мирного времени" #NT!
 RULE_OPTION_DEMOB_EXISTS: "По умолчанию" #NT!
 RULE_OPTION_DEMOB_EXISTS_DESC: "В мирное время игроку будет предложено снизить экономику и/или законы о воинской повинности до уровней, разрешенных в мирное время и в соответствии с его военной поддержкой в ​​течение четырех месяцев. ИИ сделает то же самое, хотя он сделает это быстрее и будет стремиться снизить свои законы до более низких уровней, чем требуется игроку. Если ограничения по юнитам применяются к ИИ, это также будет побуждать его сократить количество активных юнитов по соображениям производительности." #NT!
 RULE_OPTION_DEMOB_AI_ONLY: "Применяется только к ИИ" #NT!
 RULE_OPTION_DEMOB_AI_ONLY_DESC: "В мирное время ИИ сократит свою экономику и/или законы о воинской повинности. Если ограничения юнитов применяются к ИИ, это также побудит его сократить количество активных юнитов по соображениям производительности. Однако игроку никогда не будет предложено сократить свои законы." #NT!
 RULE_OPTION_DEMOB_OFF: "Выключать" #NT!
 RULE_OPTION_DEMOB_OFF_DESC: "Ни игроку, ни ИИ никогда не будет предложено сократить экономику и/или законы о воинской повинности в мирное время.\n\n§RМы рекомендуем вам делать это только в том случае, если вас не смущает, что скорость игры по мере ее развития значительно снижается, или у вас ОЧЕНЬ мощный компьютер для запуска игры.§!" #NT!
