 communism: "Социалиализм" #NT!
 communism_noun: "Социализм" #NT!
 democratic: "Демократия"
 democratic_noun: "Демократия"
 _noun: "Democracy" #NT!
 fascism: "Протофашизм" #NT!
 fascism_noun: "Протофашизм" #NT!
 fascism_real: "фашизм" #NT!
 fascism_desc: "Диктаторский режим" #NT!
 communism_desc: "Социалистический режим" #NT!
 democratic_desc: "Демократический режим"
 conservatism: "Социальный консерватизм" #NT!
 conservatism_desc: "Считая быстрые изменения и инновации для общества потенциально вредными, консерватизм отдает предпочтение традиционным ценностям и обычаям, а не социальным и экономическим реформам." #NT!
 socialism: "Социал-демократия" #NT!
 socialism_desc: "Стремясь к равенству и социалистическому государству реформаторскими методами, социал-демократия стремится отменить или смягчить последствия капитализма с помощью общественного мандата." #NT!
 marxism: "Марксизм"
 marxism_desc: "Марксизм охватывает широкий спектр экономических и исторических воззрений. Политики-марксисты пытаются использовать идеи Маркса в социальной практике. Общее для всех марксистских идеологий — признание классовой борьбы и необходимости перехода к общественной собственности."
 nazism: "Национал-социализм" #NT!
 nazism_desc: "Национал-социализм, укорененный в крайнем национализме, движим идеями расового превосходства. Он пропагандирует агрессивный экспансионизм и тоталитарное государство, где народ объединен под руководством лидера с абсолютной властью." #NT!
 gen_nazism: "Националистический социализм" #NT!
 gen_nazism_desc: "Националистический социализм — политика, основанная на принципе, согласно которому в каждой стране средства достижения конечных целей социализма должны определяться национальными условиями, а не образцом, установленным в другой стране." #NT!
 fascism_ideology: "Фашизм"
 fascism_ideology_desc: "Фашизм, охватывающий множество ультранационалистических движений, обычно почитает преданность государству и объединение этнических людей под сильным лидером. Фашизм родился как относительно новое движение в результате недовольства Великой войной, его истоки были связаны с протофашистскими идеологиями." #NT!
 falangism: "Фалангизм"
 falangism_desc: "Фалангизм — авторитарная идеология с чертами фашизма и консерватизма, делающая ставку на национальное и католическое самосознание."
 rexism: "Рексизм"
 rexism_desc: "Рексизм противопоставляет себя одновременно и либеральным, и коммунистическим идеологиям. Это сугубо консервативное националистическое движение, ратующее за корпоративную экономическую политику. Используя популистскую и авторитарную риторику, постепенно сближается с фашистскими движениями."
 neutrality: "Авторитаризм" #NT!
 neutrality_noun: "Авторитаризм" #NT!
 neutrality_desc: "Авторитарный режим"
  #TGWR 
 autocracy: "Абсолютная монархия" #NT!
 autocracy_desc: "Абсолютная монархия — это форма правления, при которой один человек — обычно король или королева — обладает абсолютной, самодержавной властью. В абсолютных монархиях власть обычно передается по наследству, а трон переходит между членами правящей семьи." #NT!
 semi_constitutional_monarchy: "Полуконституционная монархия" #NT!
 semi_constitutional_monarchy_desc: "Полуконституционная монархия — это форма правления, при которой монарх имеет влияние на государство почти на уровне абсолютной монархии, но ограничен в некоторых небольших отношениях, возможно, промонархистской конституцией." #NT!
 semi_constitutional_monarchy_reserve: "Полуконституционная монархия" #NT!
 semi_constitutional_monarchy_reserve_desc: "Полуконституционная монархия — это форма правления, при которой монарх имеет влияние на государство почти на уровне абсолютной монархии, но ограничен в некоторых небольших отношениях, возможно, промонархистской конституцией." #NT!
 despotism: "Деспотизм" #NT!
 despotism_desc: "Деспотизм — это форма правления, при которой единый орган власти в лице организации или лица управляет страной, обладая абсолютной властью, часто прибегая при необходимости к репрессивным и жестоким мерам." #NT!
 oligarchism: "Олигархия" #NT!
 oligarchism_desc: "Олигархия — это форма правления, при которой избранные с абсолютной властью правят народом. Олигархи прикрепляют свои институты к аппарату своей территории." #NT!
 authoritarian_democracy: "Авторитарная демократия" #NT!
 authoritarian_democracy_desc: "Авторитарная демократия — это форма правления, которая подразумевает чрезвычайно могущественную исполнительную власть, сохраняя при этом некоторую степень местной демократии или выборы на чисто консультативные роли. Авторитарные демократы призывают к сильному объединяющему правительству, которое не будет полностью зависеть от прихоти франшизы, но при этом сохранит некоторую степень народного мандата." #NT!
 theocracy_ideology: "Теократия" #NT!
 theocracy_ideology_desc: "Теократия — это форма правления, при которой Бог или божество какого-либо типа признается высшей правящей властью, дающей божественное руководство человеческим посредникам, которые управляют повседневными делами правительства." #NT!
 anarcho_primitivism: "Анархо-примитивизм" #NT!
 anarcho_primitivism_desc: "Анархо-примитивизм — анархистская критика истоков и прогресса цивилизации. Ответвление школы мысли Теда Качиньского, анархо-примитивисты стремятся повернуть человечество вспять в прогрессе и развитии по причинам, связанным с массовыми психологическими страданиями современного общества, а также с большим экологическим и природоохранным ущербом." #NT!
  #Proto-Fascism 
 stratocracy: "Военная диктатура" #NT!
 stratocracy_desc: "Стратократия — это система управления, в которой военные осуществляют существенный контроль над аспектами общества и политики страны. Стратократии часто являются чрезвычайными правительствами, в которых военные отдаются под командование для восстановления порядка, но это также рассматривается немногими как руководящий принцип для тех, кто верит в сильную нацию и государство." #NT!
 fundamentalism: "Фундаментализм" #NT!
 fundamentalism_desc: "Фундаментализмом называют любую секту или движение в рамках религии, которое подчеркивает строгую приверженность тому, что оно считает основополагающими принципами своей веры, что обычно приводит к осуждению альтернативных практик и толкований." #NT!
 national_syndicalism: "Национальный синдикализм" #NT!
 national_syndicalism_desc: "Национальный синдикализм — это синкретическая идеология, объединяющая крайне левый синдикализм с крайне правой интегральной националистической повесткой дня. Национальный синдикализм стремится перестроить общество, чтобы лучше поощрять националистическую риторику внутри социальных классов, и часто выступает за возвращение некоторых традиционных ценностей, таких как восстановление католицизма в национальных законах. Национальный синдикализм описывается как протофашистская идеология, которая выступает против либерализма, капитализма и коммунизма." #NT!
 ittihadism: "Иттихатизм" #NT!
 ittihadism_desc: "Иттихатизм — идеология, характеризующаяся национализмом и верой в передовые технологии как источник национальной мощи. Он сопровождается социальным дарвинизмом и научным расизмом, а также пропагандой социальной модернизации и вестернизации. Иттихатисты были вдохновлены французским ученым Гюставом Лебоном и немецким генералом бароном Кольмаром фон дер Гольцем, которые продвигали правление научной элиты и милитаризм. Османская империя рассматривается как лидер всех мусульман во главе с «турецкой расой»." #NT!
 revolutionary_nationalism: "Революционный национализм" #NT!
 revolutionary_nationalism_desc: "Революционный национализм, также известный как радикальный национализм, — это идеологическая теория, призывающая к созданию национального сообщества, объединенного общим чувством цели и судьбы." #NT!
  #Socialism 
 vanguardism: "Авангардизм" #NT!
 vanguardism_desc: "Политическая идеология, основанная на марксистской мысли, авангардизм стремится создать социалистическое государство с помощью авангардной партии, возглавляющей революцию, свергающую капиталистическое общество. Придя к власти, партия правит посредством системы, в которой политика открыта для внутренних дебатов до тех пор, пока не будет принято решение." #NT!
 has_government_vanguardism_tt: "Текущая правящая партия — §YVanguardist§!" #NT!
 reformist_socialism: "Реформистский социализм" #NT!
 reformist_socialism_desc: "Считая революционную риторику многих социалистических и марксистских кругов контрпродуктивной, реформистский социализм полагает, что установление социализма должно осуществляться путем постепенного реформирования существующих институтов." #NT!
 anarchist_communism: "Анархический коммунизм"
 anarchist_communism_desc: "Анархо-коммунизм — идеология, включающая идею коммунизма как безгосударственного общества, отвергает идею переходного социалистического государства и выступает за общество, основанное на добровольных объединениях и взаимопомощи." #NT!
 syndicalism: "Синдикализм" #NT!
 syndicalism_desc: "Синдикализм определяется концепциями революционной спонтанности и прямого действия - убеждением, что сами рабочие, организованные в профсоюзы, должны бороться с капитализмом, а не полагаться на внешнего агента, такого как политическая партия. Трансформация капиталистического общества в синдикалистское должна произойти посредством всеобщей забастовки - общенационального отказа от капитализма и передачи всех средств производства профсоюзам." #NT!
 anarcho_syndicalism: "Анархо-синдикализм" #NT!
 anarcho_syndicalism_desc: "Политическая философия и анархистская школа мысли, которая рассматривает революционный промышленный профсоюзный движимий или синдикализм как метод, позволяющий рабочим в капиталистическом обществе получить контроль над экономикой и, таким образом, оказывать влияние на общество в целом." #NT!
 agrarian_socialism: "Аграрный социализм" #NT!
 agrarian_socialism_desc: "Аграрный социализм — идеология, которая сочетает аграрный образ жизни с социалистической экономической системой. Аграрные социалисты делают акцент на общественном контроле, владении и использовании земли, а не других средств производства или национального государства." #NT!
 market_socialism: "Рыночный социализм" #NT!
 market_socialism_desc: "Рыночный социализм относится к различным экономическим системам, в которых средства производства находятся либо в общественной собственности, либо в кооперативной собственности и эксплуатируются с целью получения прибыли в рыночной экономике. Фундаментальное различие между рыночным социализмом и традиционной социалистической экономикой заключается в существовании рынка средств производства и капитальных благ." #NT!
 religious_communism: "Религиозный социализм" #NT!
 religious_communism_desc: "Религиозный социализм — это ветвь социализма, которая включает религиозные принципы и мысли в свое кредо. Веря в то, что религия и социализм совместимы, религиозный социализм отвергает понятие атеизма." #NT!
  #democrats 
 liberal_conservatism: "Либеральный консерватизм" #NT!
 liberal_conservatism_desc: "Либеральный консерватизм — это политическая идеология, сочетающая консервативную политику с либеральными позициями, особенно по экономическим вопросам, но также и по социальным вопросам, представляющая собой разновидность политического консерватизма, находящегося под сильным влиянием либерализма. Идеология включает в себя классическую либеральную точку зрения на экономический интервенционизм, согласно которой люди должны быть свободны участвовать в рынке и создавать богатство без вмешательства правительства. Однако либеральные консерваторы также считают, что нельзя полностью полагаться на людей, чтобы они действовали ответственно в других сферах жизни; поэтому они считают, что сильное государство необходимо для обеспечения закона и порядка, а институты необходимы для воспитания чувства долга и ответственности перед своей семьей и своей страной. Они также поддерживают гражданские свободы, наряду с некоторыми социально консервативными позициями." #NT!
 classical_liberalism: "Классический либерализм" #NT!
 classical_liberalism_desc: "Классический либерализм — идеология свобод, прав, индивидуализма, разума и терпимости. Он выступает за ограниченное смешанное правительство с правом голоса." #NT!
 social_liberalism: "Социальный либерализм" #NT!
 social_liberalism_desc: "Социальный либерализм — это идеология коллективных свобод и прав, которая выступает за социальное благосостояние и справедливость. В отличие от классического либерализма, который выступает за свободу в вопросах государства, социальный либерализм смешивает классически консервативные пункты, такие как налогообложение, регулирование отдельных лиц, групп и предприятий и многое другое, в попытке обеспечить социальную справедливость и социальное благосостояние через правительство." #NT!
 tridemism: "Тридемизм" #NT!
 tridemism_desc: "Три принципа народа, созданные Сунь Ятсеном, включают национализм, демократию и благосостояние. Национализм призван создать единую китайскую идентичность. Демократия должна предоставить людям широкий доступ к правительству. А благосостояние необходимо для того, чтобы правительство заботилось о своем народе." #NT!
 agrarianism: "Аграрность" #NT!
 agrarianism_desc: "Аграрианизм — политическая идеология, отличающаяся поддержкой общества, основанного на сельском хозяйстве, и рассматривающая сельское хозяйство как образ жизни, способный сформировать идеальные общественные ценности." #NT!
 libertarianism: "Либертарианство" #NT!
 libertarianism_desc: "Либертарианство — философия, выступающая за максимизацию индивидуальных свобод в политическом и экономическом контексте. Либертарианство считает необходимым, чтобы правительство и государственная власть были сведены только к сохранению функционирования нации и общества, поскольку в противном случае государство будет стремиться вторгаться в свободу и личность. Либертарианцы часто призывают к устранению вмешательства государства в экономику путем установления капитализма Laissez-Faire." #NT!
  
  
