 FRA_parliament_title: "Национальное собрание" #NT!
 FRA_parliament_desc: "Национальное собрание является центральным органом Третьей республики. Потеря большинства в этом институте помешает нам принимать политические, экономические и даже военные решения." #NT!
 FRA_parliament_desc2: "Мы контролируем [?democrat_alliance|Y0] мест ([?democrat_alliance_percent] %)" #NT!
  
 party_1_text: "§RSFIO§!" #NT!
 party_1_text_desc: "§LОснованная в 1905 году популярными деятелями, такими как §YЖан Жорес§!, §YЖюль Гед§! и §YЛеон Блюм§!, французская секция Интернационала рабочих является революционной социалистической партией. Сторонники §RSFIO§!, часто сосредоточенные на символических действиях, состоят из §RSoreliens§!, §RGuesdiens§! и других «типов» радикальных левых активистов.\n\n§RSFIO§!, безусловно, является наименее стабильной группой в парламенте, идея социализма, которую они представляют, является «мильфеем» различных идеологий борьбы рабочих, от анархизма до синдикализма.§!" #NT!
 party_2_text: "§OНезависимые социалисты§!" #NT!
 party_2_text_desc: "§LСостоящие в основном из левых выборных должностных лиц, отказывающихся присоединяться к радикализму §RSFIO§!, независимые социалисты являются реформистами, следующими линии §OPSF (Французской социалистической партии)§!.\n\nНезависимые по своей природе оппортунисты, часто меняют приверженность, лавируя между осторожной поддержкой радикалов и более умеренным республиканским альянсом.§!" #NT!
 party_3_text: "§8Демократический республиканский альянс§!" #NT!
 party_3_text_desc: "§L§YДемократический республиканский альянс§! — молодая партия, основанная в 1901 году §YЛеоном Гамбеттой§! и §YРаймоном Пуанкаре§!. Она представляет собой широкую коалицию либералов и умеренных, выступающих против радикального активизма крайних партий.\n\nПрогрессивная и выступающая за §Y«невмешательство»§!, это либеральная реформистская партия.§!" #NT!
 party_4_text: "§CРадикально-социалистическая партия§!" #NT!
 party_4_text_desc: "§L§CРеспубликанская, радикальная и радикальная социалистическая либеральная рабочая партия§!, выступающая за частную собственность, социальную справедливость и секуляризм. Частично возглавляемая §YЖоржем Клемансо§!, партия, находившаяся у власти в период с 1906 по 1909 год, провела крупные социальные реформы, такие как создание Министерства труда и введение воскресного отдыха.\n\nКак ключевая партия, она может рассчитывать на важные фигуры начала века, такие как §YКамиль Пеллетан§! (бывший военно-морской министр) или §YЭмиль Комб§! (также бывший премьер-министр).§!" #NT!
 party_5_text: "§1Независимые радикалы§!" #NT!
 party_5_text_desc: "§LСчитающиеся §1"левыми республиканцами"§!, независимые радикалы являются видными антиклерикалами, защитниками республиканских ценностей и строгого применения принципов республики. Менее сосредоточенные на социализме, чем §8Демократический республиканский альянс§! или §CРадикальная социалистическая партия§!, они образуют "центристскую" партию, которая не называет своего названия.\n\nКак неформализованное образование, преданность членов этой группы очень изменчива, что делает их большими оппортунистами....§!" #NT!
 party_6_text: "§BРеспубликанская Федерация§!" #NT!
 party_6_text_desc: "§LОснованная в 1903 году, это главная либеральная правая партия, поддерживающая консервативную программу. Объединяя умеренных и прогрессистов, выступающих против левых групп, также называемых §O"левым картелем"§!, они борются вместе с популярными политиками, такими как §YАлександр Рибо§! или §YЖюль Мелин§!.\n\nЛюбимая буржуазией и лидерами бизнеса, партия выступает против социальных реформ и поддерживает децентрализацию государственных отраслей.§!" #NT!
 party_7_text: "§WConservatives§!" #NT!
 party_7_text_desc: "§LОбъединяя ярых консервативных политических деятелей, это движение поддерживает государственную религию и сдержанно поддерживает §gmonarchists§! и объединяет многих праворадикальных оппортунистов.\n\nДалеко не являясь официальной партией, оно представляет собой не более чем остатки республиканского правого крыла §Bтретьей Французской империи§.§!" #NT!
 party_8_text: "§WНезависимые республиканцы§!" #NT!
 party_8_text_desc: "§LБольше §Y«состояние дел»§!, чем партия, республиканские независимые концентрируют избранных должностных лиц, которые не пожелали присоединиться к монархистам или республиканской федерации.\n\nЭта мрачная сила не имеет реального политического будущего как субъект и является лишь формой перехода для политиков, переходящих от одной идеологии к другой.§!" #NT!
 party_9_text: "§gНародное либеральное действие§!" #NT!
 party_9_text_desc: "§LЛиберальная монархическая партия в постоянной войне со своим политическим соперником §g «Французское действие»§!. Группа была основана в 1901 году §YЖаком Пиу§! и §YАльбером де Мун§! под руководством §YПапы Льва XIII§!. \n\nК сожалению, партия потеряла поддержку Папы с 1908 года из-за действий Франции, что привело к медленному снижению ее популярности.§!" #NT!
 party_10_text: "§LNationalists§!" #NT!
 party_10_text_desc: "§LСлияние §gЛиги французской родины§! и §gЛиги патриотов§!, эта неформальная коалиция глубоко §gантидрейфусарская§! и антилевая картель. Суверенистская и популистская, партия поддерживает монархистов и реваншизм против Германии.\n\nВо главе с §YГодфруа де Кавеньяком§!, партия окончательно закрепилась как дополнение к националистической политике §gкружка Прудона§!.§!" #NT!
 party_11_text: "§WVacant§!" #NT!
 party_11_text_desc: "§LИз года в год количество мест в парламенте может меняться, что иногда приводит к появлению пустых мест.§!" #NT!
 error: "§HДа здравствует Франция§!" #NT!
  
