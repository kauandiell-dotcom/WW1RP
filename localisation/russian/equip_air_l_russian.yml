l_russian:
 fighter: "Истребитель"
 fighter_equipment_desc: "Истребители — самолеты быстрые, маневренные и подходят для различных задач: это превосходство в воздухе, сопровождение союзных бомбардировщиков и перехват бомбардировщиков врага."
 cv_fighter: "боец" #NT!
 cv_fighter_equipment_desc: "Истребители — самолеты быстрые, маневренные и подходят для различных задач: это превосходство в воздухе, сопровождение союзных бомбардировщиков и перехват бомбардировщиков врага."
 cas: "Штурмовик" #NT!
 CAS_equipment_desc: "Штурмовики предназначены для оказания поддержки в наземных боях." #NT!
 nav_bomber: "Морской бомбардировщик"
 nav_bomber_equipment_desc: "Морские бомбардировщики способны атаковать корабли противника." #NT!
 seaplane: "Гидросамолет" #NT!
 seaplane_equipment_desc: "Гидросамолеты способны атаковать корабли противника." #NT!
 tac_bomber: "Тактический бомбардировщик"
 tac_bomber_equipment_desc: "Тактические бомбардировщики небольшие и быстрые; они способны помогать наземным силам и уничтожать вражеские сооружения."
 heavy_fighter: "Тяжелый истребитель"
 heavy_fighter_equipment_desc: "Тяжелые истребители отличаются дальностью и вооружением и могут успешно сопровождать союзные бомбардировщики и перехватывать вражеские. Низкая маневренность при этом создает трудности в бою с обычными истребителями."
 strat_bomber: "Тяжелый бомбардировщик" #NT!
 strat_bomber_equipment_desc: "Тяжелые бомбардировщики атакуют вражеские здания и инфраструктуру, лишая их драгоценной промышленности." #NT!
 transport_plane: "Транспорт"
 transport_plane_equipment_desc: "Доставляет воздушный десант в точку высадки."
 fighter_equipment: "Истребитель"
 cv_fighter_equipment: "Палубный истребитель"
 strat_bomber_equipment: "Тяжелый бомбардировщик" #NT!
 scout_plane: "Самолет-разведчик" #NT!
 scout_plane_short: "Разведывательный самолет" #NT!
 scout_plane_equipment_desc: "Самолет, разработанный специально для фоторазведки. Чтобы выжить, полагается в первую очередь на скорость и скрытность и проиграет в любом бою в стойке." #NT!
 scout_plane_equipment: "Разведывательные самолеты" #NT!
 scout_plane_equipment_1: "Разведывательный самолет" #NT!
 scout_plane_equipment_1_desc: "Сбор разведывательной информации о передвижениях войск противника и предоставление отчетов о дислокации военно-морских сил противника является важной задачей." #NT!
 scout_plane_equipment_2: "Разведывательный самолет II" #NT!
 scout_plane_equipment_2_desc: "Разрабатывая самолёты специально для разведки с воздуха и дальней разведки, мы обеспечиваем себе регулярное поступление точных данных о намерениях и возможностях нашего противника."
 scout_plane_equipment_3: "Разведывательный самолет III" #NT!
 scout_plane_equipment_3_desc: "Разрабатывая специальные самолеты для воздушного наблюдения и дальней разведки, мы обеспечиваем получение и поддержание точной картины намерений и возможностей нашего противника." #NT!
 fighter_equipment_0: "Ранний боец" #NT!
 fighter_equipment_0_short: "Ранний боец" #NT!
 fighter_equipment_0_desc: "Прошло совсем немного времени с тех пор, как были изобретены эти летающие машины. И совсем недавно мы думали о том, чтобы использовать их на войне. Но мы предполагаем, что от этого должна быть какая-то польза." #NT!
 aerial_bombs: "Воздушные бомбы" #NT!
 aerial_bombs_desc: "Бомбу можно загрузить на самолеты, чтобы ее можно было сбросить сверху и поразить наземную цель. Бомбы теперь можно прикреплять к фюзеляжу, а не бросать экипаж вручную." #NT!
 synchronizer: "Синхронизатор" #NT!
 synchronizer_desc: "Синхронизатор пушки или прерыватель - это устройство, позволяющее одномоторному самолету тягачей стрелять из своего направленного вперед вооружения по дуге вращающегося винта без попадания пуль в лопасти. Это позволяет наводить на цель самолет, а не пушку." #NT!
 allow_fighter_and_seaplane_techs: "Разрешить исследование §YFighters§! и §YSeaplanes§!." #NT!
 allow_bomber_techs: "Разрешить исследовать §YЛегкие бомбардировщики§! и §YТяжелые бомбардировщики§!." #NT!
 fighter_equipment_1: "Истребитель I"
 fighter_equipment_1_short: "Истреб. I"
 fighter_equipment_1_desc: "Темпы развития истребителей поразительны, и поэтому мы должны продолжать внедрять эти технологии, а также совершенствовать существующие концепции. Наш новый истребитель должен быть более надежным, иметь лучшую скорость и подвижность, чем другие самолеты. Кроме того, он должен быть правильно вооружен." #NT!
 fighter_equipment_2: "Истребитель II"
 fighter_equipment_2_short: "Истреб. II"
 fighter_equipment_2_desc: "Внедрение экспериментальных, но инновационных технологий, таких как синхронизированная передача и конструкция триплана, могло бы дать нам преимущество в воздушных боях на истребителях." #NT!
 fighter_equipment_3: "Истребитель III"
 fighter_equipment_3_short: "Истреб. III"
 fighter_equipment_3_desc: "При этом истребительная авиация претерпела множество изменений. Мы должны начать воплощать достижения гражданских технологий в военное применение." #NT!
 strat_bomber_equipment_1: "Тяжелый бомбардировщик I" #NT!
 strat_bomber_equipment_1_short: "Тяжелый бомбардировщик I" #NT!
 strat_bomber_equipment_1_desc: "Мы должны иметь бомбардировщик, способный бомбить военные объекты и крупные города противника. Ему нужно будет летать высоко и на хорошей скорости и нести большую полезную нагрузку. Для этого потребуется большой планер с несколькими двигателями. У него также будет некоторый оборонительный потенциал." #NT!
 strat_bomber_equipment_2: "Тяжелый бомбардировщик II" #NT!
 strat_bomber_equipment_2_short: "Тяжелый бомбардировщик II" #NT!
 strat_bomber_equipment_2_desc: "Бомбардировки успешно подрывают способность врага вести боевые действия. Улучшенное оборонительное вооружение и повышенная скорость позволят новым самолетам возвращаться невредимыми, а увеличенные бомбовая нагрузка и дальность полета повысят эффективность ударов."
 strat_bomber_equipment_3: "Тяжелый бомбардировщик III" #NT!
 strat_bomber_equipment_3_short: "Тяжелый бомбардировщик III" #NT!
 strat_bomber_equipment_3_desc: "Чтобы снизить потери от огня орудий ПВО и перехватчиков, нужно повысить максимальную высоту полета. Новая модель будет еще крупнее и сможет нести увеличенную бомбовую нагрузку и большой запас топлива, чтобы повысить дальность полета."
 tac_bomber_equipment: "Легкий бомбардировщик" #NT!
 tac_bomber_equipment_1: "Легкий бомбардировщик I" #NT!
 tac_bomber_equipment_1_short: "Легкий бомбардировщик I" #NT!
 tac_bomber_equipment_1_desc: "Первые легкие бомбардировщики предназначались для сброса бомб в горизонтальном полете над целью." #NT!
 tac_bomber_equipment_2: "Легкий бомбардировщик II" #NT!
 tac_bomber_equipment_2_short: "Легкий бомбардировщик II" #NT!
 tac_bomber_equipment_2_desc: "Широко распространено мнение, что следующая война будет выиграна полностью за счет бомбардировок противника до полного его уничтожения. Крайне важно начать проектирование собственного бомбардировщика, способного нести тяжелые полезные нагрузки на адекватной скорости." #NT!
 tac_bomber_equipment_3: "Легкий бомбардировщик III" #NT!
 tac_bomber_equipment_3_short: "Легкий бомбардировщик III" #NT!
 tac_bomber_equipment_3_desc: "Более тяжелые конструкции тактических бомбардировщиков могут увеличить дальность полета, полезную нагрузку и скорость, сохраняя при этом способность самолетов выполнять широкий спектр задач." #NT!
 transport_plane_equipment: "Транспортный самолет"
 transport_plane_equipment_1: "Транспортный самолет" #NT!
 transport_plane_equipment_1_short: "Транспортный самолет"
 transport_plane_equipment_1_desc: "§LСамолеты, доставляющие десант к месту высадки.§!"
 nav_bomber_equipment: "Палубный бомбардировщик"
 nav_bomber_equipment_1: "Морской бомбардировщик I"
 nav_bomber_equipment_1_short: "Морск. бомбардировщик I"
 nav_bomber_equipment_1_desc: "Морская авиация будет крайне востребована в связи с изменениями в характере войны на море — в частности, усилением роли подводных лодок. Потребуются гидросамолеты, способные выполнять роль разведчиков и пикирующих бомбардировщиков."
 nav_bomber_equipment_2: "Морской бомбардировщик II"
 nav_bomber_equipment_2_short: "Морск. бомбардировщик II"
 nav_bomber_equipment_2_desc: "Улучшенная аэродинамика и новые двигатели заметно повышают скорость и боевую эффективность морской авиации."
 nav_bomber_equipment_3: "Морской бомбардировщик III"
 nav_bomber_equipment_3_short: "Морск. бомбардировщик III"
 nav_bomber_equipment_3_desc: "Цельнометаллические корпуса и аэродинамические тормоза заметно сказываются на летных свойствах. Платить за это приходится увеличенной численностью экипажа."
 seaplane_equipment: "Гидросамолет" #NT!
 seaplane_equipment_1: "Гидросамолет I" #NT!
 seaplane_equipment_1_short: "Гидросамолет I" #NT!
 seaplane_equipment_1_desc: "Морская авиация будет иметь жизненно важное значение в ближайшее десятилетие для противостояния новым тенденциям в военно-морской войне, таким как возросшее значение подводных лодок. Пригодятся гидросамолеты, способные работать в качестве разведывательных машин." #NT!
 seaplane_equipment_2: "Гидросамолет II" #NT!
 seaplane_equipment_2_short: "Гидросамолет II" #NT!
 seaplane_equipment_2_desc: "Новые технологии двигателей и улучшенная аэродинамическая конструкция значительно повысят разведывательные возможности военно-морских самолетов." #NT!
 seaplane_equipment_3: "Гидросамолет III" #NT!
 seaplane_equipment_3_short: "Гидросамолет III" #NT!
 seaplane_equipment_3_desc: "Цельнометаллическая конструкция и мощные воздушные тормоза позволяют выполнять более сложную морскую авиацию. Однако самолетам будущего потребуется более крупный экипаж для управления этими передовыми системами." #NT!
 CAS_equipment: "Штурмовик" #NT!
 CAS_equipment_1: "Штурмовик I" #NT!
 CAS_equipment_1_desc: "Штурмовик как роль поддержки сухопутных войск на поле боя. Поддержка на поле боя обычно делится на непосредственную поддержку с воздуха и противодействие с воздуха на поле боя, причем первое требует строгого, а второе - только общего сотрудничества с дружественными надводными силами." #NT!
 CAS_equipment_2: "Штурмовик II" #NT!
 CAS_equipment_2_desc: "Наша доктрина CAS требует самолета, способного наносить высокоточные удары по надводным целям. Хотя эти самолеты несут меньшую полезную нагрузку по сравнению с нашими более крупными тактическими бомбардировщиками, они способны атаковать и уничтожать небольшие цели путем обстрела и бомбардировки с пикирования." #NT!
 CAS_equipment_3: "Штурмовик III" #NT!
 CAS_equipment_3_desc: "Опыт ранних войн показал, что повышенная скорость, броня и маневренность необходимы для живучести самолетов CAS против истребителей противника и огня с земли. Это следующее поколение штурмовиков также будет использовать более крупные бомбы, пушки и пулеметы, чтобы наносить больший ущерб своим целям." #NT!
 cv_fighter_equipment_1: "Палубный истребитель I"
 cv_fighter_equipment_1_short: "Авианосец Истребитель I" #NT!
 cv_fighter_equipment_1_desc: "Ранний истребитель, модифицированный для взлета с и посадки на авианосец."
 cv_fighter_equipment_2: "Палубный истребитель II"
 cv_fighter_equipment_2_short: "Авианосец-истребитель II" #NT!
 cv_fighter_equipment_2_desc: "Улучшенный истребитель, модифицированный для взлета с и посадки на авианосец."
 cv_fighter_equipment_3: "Палубный истребитель III"
 cv_fighter_equipment_3_short: "Авианосец Истребитель III" #NT!
 cv_fighter_equipment_3_desc: "Современный истребитель, модифицированный для взлета с и посадки на авианосец."
