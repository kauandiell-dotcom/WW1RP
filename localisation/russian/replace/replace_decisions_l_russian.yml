l_russian:
 MAN_banditry_category_desc:0 "Маньчжурия была признана святилищем Цин, а это означает, что ханьцам был запрещен въезд, но ограничения были сняты, и в последние десятилетия сюда въехали многие ханьцы. Кроме того, попытки России и Японии колонизировать Маньчжурию привели к отсутствию контроля со стороны центрального правительства, и с тех пор в стране процветает бандитизм. \nТаких бандитов называют Мазеями (Конные бандитисты), потому что они обычно путешествуют в кавалерийских формированиях верхом на лошадях, совершая набеги и совершая набеги на поселения и людей. Есть группы, которые в некоторой степени упорядочены и действуют как местные ополченцы, но большинство из них представляют собой не более чем преступников низкого уровня и бродяг."

 greater_italy_category_desc:1 "Ранние стадии итальянского ирредентизма восторжествовали вместе с il Risorgimento еще в 19 веке, но помимо этого существуют этнические регионы, которые еще не были восстановлены для истинного воплощения идей объединения Италии. Эти идеи выйдут на поверхность, и Италия выстоит на протяжении веков. Viva l'Italia!!"