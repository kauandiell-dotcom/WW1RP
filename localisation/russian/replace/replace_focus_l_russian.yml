l_russian:
 SOV_planned_economy_desc:0 "Государство должно взять под контроль экономику, чтобы эффективно регулировать разрушенную советскую экономику."
 RAJ_jungle_training_effect:0 "Включаетs §HОбучение в джунглях§!\n§HМорская пехота\n    Джунгли§!\n      Атака: §G+5%§!\n      Скоростьt: §G+10%§!\n§HГорная пехота\n    Джунгли§!\n      Атака: §G+5%§!\n      Скорость: §G+10%§!\n"
 ITA_war_with_france:0 "Riprenderci ciò che è nostro!"
 ITA_war_with_france_desc:0 ""
 CHI_land_reform:0 "Земельная реформа"
 CHI_land_reform_desc:0 "Часть крестьянства продолжает использовать в своих занятиях неэффективную и отсталую технику. Кроме того, некоторые землевладельцы недостаточно эффективно используют свою собственность. Небольшой комплекс реформ должен исправить эту ситуацию."
 TUR_invoke_the_methods_of_mehmed_ii:0 "Методы Мехмета Второго"
 TUR_invoke_the_methods_of_mehmed_ii_desc:0 "Мехмед Второй показывает нам огромный факт: если вы поместите в него достаточно пороха и артиллерии, вы сокрушите каждого из своих врагов. Как это верно, какой это замечательный метод!"
 CAN_Patriation:0 "Немедленная Патриация"
 CAN_Patriation_desc:0 "Мы требуем свободы от этих британских цепей, нас не будут сдерживать иностранные бюрократы."
 ITA_bersaglieri_desc:0 "Корпус Берсальери на момент своего создания в 1836 году представлял собой высокомобильную легкую пехоту, и его конкретная ситуация менялась по мере изменений в боевых действиях. В девятнадцатом веке Берсальери действовали как застрельщики или ударные отряды, передвигаясь с места на место бегом. Обновление их велосипедными батальонами только повысит их эффективность."
 POL_import_submarine_technology:0 "Импорт подводных технологий"
 SWE_folkhemmet:0 "Folkhemmet!"
 SWE_folkhemmet_desc:0 "Народ восстал против тирана-короля! Folkhemmet уже рядом!"
 SWE_en_svensk_tiger_desc:0 "Мы могли бы сами заняться производством брони..."
 FRA_fortification_focus_desc:0 "Какими бы важными ни были наши форты, нам необходимо найти способы построить их более эффективно. Форт был мощным средством сдерживания вражеских сил на протяжении всей истории, мы могли бы использовать безопасность большего количества подобных оборонительных сооружений."
 CHI_opposition:0 "Присоеденение к правительству Бэйяна"
 CHI_opposition_desc:0 "Ситуация в Китае буквально представляет собой хаос и разрушения, бесконечные гражданские войны и безудержные диктаторские полевые командиры, и если мы хотим выжить, нам придется навести в провинции свой собственный порядок."
 CHI_cooperation_with_the_nationalists:0 "Принять национализм"
 CHI_cooperation_with_the_nationalists_desc:0 "Националисты предлагают лучший шанс объединить страну и стабилизировать провинцию."
 CHI_cooperation_with_the_communists:0 "Вместе с социалистами"
 CHI_cooperation_with_the_communists_desc:0 "Мы пытались, но не смогли построить современную нацию. Страна более разделена, чем когда-либо, крестьяне живут в страхе перед правительством, коррупция процветает на всех уровнях правительства, а империалисты сидят прямо за границами. Возможно, социализм – лучшее видение будущего."
 CHI_join_the_chinese_soviet:0 "Советская провинция"
 CHI_purchase_tanks_tt:0 "Мы получим 30 старых лёгких танков от нашего сторонника."
 CHI_mission_to_the_soviet_union:0 "Миссия в Советской России"
 CHI_mission_to_the_soviet_union_desc:0 "[SOV.GetNameDefCap] выразил интерес к Китаю, главным образом, чтобы создать противовес колониальному экспансионизму. Нам следует послать миссию в Москву, чтобы посмотреть, совпадают ли наши цели."