l_russian:

 LOADING_TIP_0:0 "Чтобы подготовить генерал-майора, нужно 15 000 жертв.\n- Фердинанд Фош"
 
 LOADING_TIP_1:0 "Вы будете дома до того, как с деревьев упадут листья.\n – Кайзер Вильгельм II, август 1914 года"
 
 LOADING_TIP_2:0 "Однажды великая европейская война разразится из-за какой-то чертовски глупой вещи на Балканах. Отто фон Бисмарк, 1888 год"
 
 LOADING_TIP_3:0 "Четырнадцать очков? У самого доброго Господа было только десять.\n- Жорж Клемансо, жалуясь на концепцию самоопределения"

 LOADING_TIP_4:0 "Лампы гаснут по всей Европе, и мы больше никогда не увидим их зажженными.\n- Эдвард Грей, июль 1914 года."

 LOADING_TIP_5:0 "Две армии, сражающиеся друг с другом, подобны одной большой армии, которая совершает самоубийство.\n- Анри Барбюс"

 LOADING_TIP_6:0 "Это война, которая положит конец всем войнам.\n- Вудро Вильсон."

 LOADING_TIP_7:0 "Если бы женщины на фабриках прекратили работу на двадцать минут, союзники проиграли бы войну.\n- Жозеф Жоффр"

 LOADING_TIP_8:0 "Это конец и начало эпохи. Это нечто гораздо большее, чем Французская революция или Реформация, и мы живем в этом.\n- Герберт Уэллс, 1916 год"

 LOADING_TIP_9:0 "Мы находимся на измеримом или вообразимом расстоянии от настоящего Армагеддона. К счастью, кажется, нет причин, по которым мы должны быть кем-то большим, чем просто зрителями.\n — Генри Асквит, 24 июля 1914 год"

 LOADING_TIP_10:0 "Независимое мышление не поощряется в профессиональной армии. Это форма мятежа. Послушание – высшый добродетель.\n-Дэвид Ллойд Джордж"

 LOADING_TIP_11:0 "Генералы на местах всегда недооценивают тыл. И все же именно здесь была выиграна и проиграна Великая война. Тыл России, Болгарии, Австрии и Германии распался еще до того, как рухнули их армии.\n- Дэвид Ллойд Джордж"

 LOADING_TIP_12:0 "Патриоты всегда говорят о смерти за свою страну и никогда об убийстве за свою страну.\n- Бертран Рассел"

 LOADING_TIP_13:0 "ВСЕ ПРОШЛО ХОРОШО. Наши войска успешно выполнили свои задачи, все контратаки были отбиты, большое количество пленных взято.\n- The Times, репортаж о битве на Сомме."

 LOADING_TIP_14:0 "Однако мир делает вид, что разделился, но сегодня в мире есть только два разделения — люди и немцы.\n — Редьярд Киплинг"

 LOADING_TIP_15:0 "После обеда мы пошли в сад выпить кофе, и я включил Главного хирурга с его графиками, процентами и т. д. больных и раненых, чтобы развлечь премьер-министра.\n- Фельдмаршал Хейг"

 LOADING_TIP_16:0 "Ничья земля под снегом подобна лику луны: хаотичная, изрытая кратерами, непригодная для жизни, ужасная, обитель безумия.\n- Уилфред Оуэн"

 LOADING_TIP_17:0 "Мы как-то обсуждали, какие войска в окопах были самыми чистыми, взятыми по национальностям.\n- Роберт Грейвс"

 LOADING_TIP_18:0 "В книге учета Великой войны вырвана страница с записью потерь русских. Цифры неизвестны. Пять миллионов или восемь? Мы сами этого не знаем.\n- Пауль фон Гинденбург, 1917 г."

 LOADING_TIP_19:0 "С уверенностью можно сказать, что никто не знал, сколько стоит награда, кроме человека, который ее получил.\n- Зигфрид Сассун"

 LOADING_TIP_20:0 "Мы не вели войну против Германии, нам приказывали в войне короля с Германией.\n- Герберт Уэллс"

 LOADING_TIP_21:0 "Я раздавлю всякого, кто попытается помешать моей задаче.\n- Кайзер Вильгельм II, 1913 г."

 LOADING_TIP_22:0 "Те, кто убит, не могут жаловаться, раненые отдали бы гораздо больше, чтобы спастись, а нераненые рассматривают деньги как утешительный приз за то, что они все еще здесь.\n- Роберт Грейвс".

 LOADING_TIP_23:0 "За все четыре года войны не было ни одной по-настоящему хорошей настоящей военной книги. Единственным настоящим произведением искусства, появившимся во время войны, были стихи. Одна из причин этого в том, что поэтов арестовывают не так быстро, как прозаиков.\n- Эрнест Хемингуэй."

 LOADING_TIP_24:0 "Ты был между дьяволом и глубоким синим морем. Если вы пойдете вперед, вас, скорее всего, застрелят, если вы вернетесь, вас отдадут под трибунал и расстреляют, так что, черт возьми, вы будете делать? Что ты можешь сделать?\n- У. Хэй"

 LOADING_TIP_25:0 "Пулемет — оружие, рейтинг которого сильно переоценен.\n — Фельдмаршал Хейг, 1915 год."

 LOADING_TIP_26:0 "Сильный нажим справа. Мой центр поддается. Невозможно маневрировать. Ситуация отличная. Я атакую.\n- Фердинанд Фош, сентябрь 1914 г."

 LOADING_TIP_27:0 "Все зависит от того, будем ли мы иметь противниками этих французских обманщиков или этих дерзких негодяев, англичан. Я предпочитаю английский. Зачастую их смелость можно назвать только глупостью.\n- Манфред фон Рихтгофен"

 LOADING_TIP_28:0 "Они не пройдут!\n- Филипп Петэн, Верден, 1916 год."

 LOADING_TIP_29:0 "TЧары Трафальгара разрушены.\n- Кайзер Вильгельм II"

 LOADING_TIP_30:0 "Сражайтесь и летите до последней капли крови и последней капли топлива, до последнего удара сердца.\n- Манфред фон Рихтгофен"

 LOADING_TIP_31:0 "Я умер в аду.\n- Зигфрид Сассун"

 LOADING_TIP_32:0 "Главное — всегда иметь план; если это не лучший план, то это, по крайней мере, лучше, чем отсутствие плана вообще.\n- Сэр Джон Монаш"

 LOADING_TIP_33:0 "Если я выйду из этой войны живым, мне будет больше удачи, чем мозгов. Я люблю летать, а не убивать.\n- Манфред фон Рихтгофен"

 LOADING_TIP_34:0 "Ничто так не принесет с нами сочувствия Америки, как пролитая на поле боя американская кровь.\n – Уинстон Черчилль, 5 сентября 1914 г."

 LOADING_TIP_35:0 "Да ладно вам, сукины дети, вы хотите жить вечно?\n- Дэниел Дейли"

 LOADING_TIP_36:0 "Жириновский в США. Подходит к нему темнокожий БОМЖ с табличкой, на котором написано "HELP ME".\n — Молодец Ме, что учишь русский язык! Только букву Г в слове НЕГР ты написал неверно."

 LOADING_TIP_37:0 "Сегодня в одиннадцать часов утра закончилась самая жестокая и ужасная война, которая когда-либо била человечество. Я надеюсь, что мы можем сказать, что таким образом в это роковое утро пришел конец всем войнам.\n- Дэвид Ллойд Джордж, 11 ноября 1918 г."

 LOADING_TIP_38:0 "На полях Фландрии маки развеваются \nМежду крестами, ряд за рядом\n — Джон МакКрэй, 1915 год."

 LOADING_TIP_39:0 "Идёт еврей по улице, видит - кошелек лежит. Поднял, пересчитал деньги - а там не хватает!"

 LOADING_TIP_40:0 "Что бы вы ни делали, вы теряете много людей.\n- Чарльз Манжен"

 LOADING_TIP_41:0 "Самое мощное оружие на земле — это горящая человеческая душа\n — Фердинанд Фош"

 LOADING_TIP_42:0 "Армения. Звонок по тел:\n— Алло... \n— Это «секс по телефону»? \n— Да, брат..."

 LOADING_TIP_43:0 "Никакое превосходство в вооружении и боеприпасах, каким бы большим оно ни было, не позволит одержать победу без принесения в жертву человеческих жизней.\n – Фельдмаршал Хейг, июнь 1916 г."

 LOADING_TIP_44:0 "Все пошло как по маслу... Бой у нас идет очень хорошо и немцы уже добровольно сдаются в плен. Врагу так не хватает людей, что он собирает их со всех частей линии фронта.\n- Фельдмаршал Хейг"

 LOADING_TIP_45:0 "Выигранная битва – это битва, которую мы не признаем проигранной.\n- Фердинанд Фош"

 LOADING_TIP_46:0 "Исход войны решился в первые двадцать дней боев, и все, что происходило потом, состояло из сражений, которые, хотя и были тяжелыми и опустошительными, были лишь отчаянными и тщетными апелляциями против решения Судьбы.\n- Уинстон Черчилль"

 LOADING_TIP_47:0 "Все договоры между великими государствами перестают иметь обязательную силу, когда они вступают в противоречие с борьбой за существование.\n- Отто фон Бисмарк"

 LOADING_TIP_48:0 "Нам нужно восемь, и мы не будем ждать!\n- лозунг Британской военно-морской лиги, призывающий к восьми дредноутам."

 LOADING_TIP_49:0 "Именно солдат и армия, а не парламентское большинство и решения, спаяли Германскую империю воедино. Я доверяю армии.\n- Кайзер Вильгельм II, 1891 г."

 LOADING_TIP_50:0 "Несмотря на отсутствие необходимого флота, мы завоевали себе место под солнцем. Теперь моя задача - позаботиться о том, чтобы это место под солнцем оставалось нашим бесспорным владением.\n- Кайзер Вильгельм II, 1901 г."

 LOADING_TIP_51:0 "Наступление эры беспроводной связи сделает войну невозможной, потому что она сделает войну нелепой.\n – Гульельмо Маркони, 1912 год."

 LOADING_TIP_52:0 "Позвольте мне заверить султана и его 300 миллионов мусульман... что немецкий император всегда будет их другом.\n- Кайзер Вильгельм II"

 LOADING_TIP_53:0 "Львы во главе с ослами.\n – Неизвестный немецкий офицер описывает британские войска."

 LOADING_TIP_54:0 "Если произойдет худшее, Австралия сплотится с Родиной, чтобы помочь и защитить ее до последнего человека и до последнего шиллинга. Эндрю Фишер, август 1914 г."

 LOADING_TIP_55:0 "Я думаю, на мне должно лежать проклятие, потому что я люблю эту войну. Я знаю, что каждое мгновение оно разбивает и разрушает жизни тысяч людей, и все же я ничего не могу с этим поделать — я наслаждаюсь каждой секундой этого.\n- Уинстон Черчилль, 1916 год."

 LOADING_TIP_56:0 "Ни один командир никогда не имел чести возглавить более сильные силы; ни один командующий никогда не черпал большего вдохновения от действий своих войск.\n- Джон Дж. Першинг"

 LOADING_TIP_57:0 "Девонширцы удерживали эту траншею, Девонширы держат ее до сих пор\n- Маркер, Девонширское кладбище"

 LOADING_TIP_58:0 "Когда мы начали стрелять, нам оставалось только зарядить и перезарядить. Они падали сотнями. Целиться не надо было, мы просто по ним стреляли.\n- Немецкий пулеметчик"

 LOADING_TIP_59:0 "Он уберег нас от войны.\n – демократический лозунг, используемый от имени президента Вильсона."

 LOADING_TIP_60:0 "Во время изменений на карте Европы дела шли своим чередом.\n – Уинстон Черчилль, 9 ноября 1914 г."

 LOADING_TIP_61:0 "Я еще не готов быть царем. Я ничего не знаю о деле правления.\n- Царь Николай II"

 LOADING_TIP_62:0 "Tсреди людей нет справедливости.\n- Царь Николай II"

 LOADING_TIP_63:0 "Я больше не знаю никаких партий, только немцы!\n- Кайзер Вильгельм II, 4 августа 1914 г.)"

 LOADING_TIP_64:0 "Царь не коварен, но он слаб. Слабость не является предательством, но она выполняет все свои функции.\n- Кайзер Вильгельм II"

 LOADING_TIP_65:0 "Вы можете забыть все свои тренировки; вы пришли сюда, чтобы показать всем своим людям, как умирать.\n- Неизвестный командир Британского экспедиционного корпуса."

 LOADING_TIP_66:0 "Сегодня что-то не так с нашими проклятыми кораблями.\n- Дэвид Битти"

 LOADING_TIP_67:0 "Они не состарятся, как стареем мы, оставшиеся. Мы будем помнить их.\n- Роберт Биньон"

 LOADING_TIP_68:0 "Единственный человек с обеих сторон, который мог проиграть войну за один день.\n- Уинстон Черчилль (об адмирале сэре Джоне Джеллико)"

 LOADING_TIP_69:0 "Война слишком важна, чтобы ее оставлять на усмотрение генералов.\n- Жорж Клемансо"

 LOADING_TIP_70:0 "Джентльмены, битва окончена, победа за нами.\n- Адмирал Джордж Дьюи"

 LOADING_TIP_71:0 "Весь принцип морского боя заключается в том, чтобы иметь возможность идти куда угодно со всеми чертовыми вещами, которыми обладает флот.\n- Сэр Джон Фишер"

 LOADING_TIP_72:0 "На войне главный принцип — не подчиняться приказам. Любой дурак может подчиняться приказам!\n- Сэр Джон Фишер"

 LOADING_TIP_73:0 "У меня больше нет резервов. Единственные люди, которые у меня остались, — это часовые у моих ворот. Я возьму их туда, где линия прорвана, и последний из англичан погибнет в бою.\n- Сэр Джон Френч"

 LOADING_TIP_74:0 "В военное время ни один солдат не имеет права говорить то, что он думает; после войны никого не волнует, что думает солдат.\n- сэр Ян Гамильтон"

 LOADING_TIP_75:0 "Я лучше буду младшим лейтенантом с DSC (Крестом за выдающиеся заслуги), чем генералом без него.\n- Джордж Паттон"

 LOADING_TIP_76:0 "Вы не думаете, что я вернусь?\n- Манфред фон Рихтгофен, 21 апреля 1918 г."

 LOADING_TIP_77:0 "Главное — всегда иметь план; если это не лучший план, то это, по крайней мере, лучше, чем отсутствие плана вообще.\n- Сэр Джон Монаш"
 
 LOADING_TIP_78:0 "Бедная Мексика, так далека от Бога и слишком близка к США.\n- Порфирио Диас"
 
 LOADING_TIP_79:0 "Мадеро выпустил тигра, посмотрим, сможет ли он его приручить.\n- Порфирио Диас в изгнании"

 LOADING_TIP_80:0 "Армии - величайшие сторонники тирании.\n- Панчо Вилья"
 
 LOADING_TIP_81:0 "Если хочешь быть птицей, лети, если хочешь быть червем, ползи, но не кричи, когда тебя раздавят..\n- Эмилиано Сапата-"
 
 LOADING_TIP_82:0 "Патриоты всегда говорят о смерти за свою страну и никогда об убийстве за свою страну.\n- Бертран Рассел-"
 
 LOADING_TIP_83:0 "Если бы женщины на фабриках остановили работу на двадцать минут, союзники проиграли бы войну.\n- Французский фельдмаршал Жоффр"
 
 LOADING_TIP_84:0 "И единственная разница, которую я обнаружил между руководством Демократической партии и руководством Республиканской партии, заключалась в том, что один из них сдирал с тебя кожу от лодыжки вверх, а другой – от уха вниз.\n- Хьюи Лонг"

 LOADING_TIP_85:0 "Это необходимо; что интересы коренных жителей Африки должны иметь первостепенное значение, и что если (и когда) их интересы и интересы иммигрантов вступят в противоречие, первые должны преобладать.\n- Ежегодный колониальный отчет по Кении, 1923 г."

 LOADING_TIP_86:0 "Газ! Газ! Экстаз возни!\n- Уилфред Оуэн"

 LOADING_TIP_87:0 "Дорога на Константинополь пролегает через Варшаву.\n- Е. Н. Трубецко.i"

 LOADING_TIP_88:0 "Самый короткий и безопасный оперативный путь в Константинополь пролегает через Вену... и Берлин.\n- Генерал-квартирмейстер Юрий Данилов"

 LOADING_TIP_89:0 "Пусть Китай спит, ибо, когда он проснется, мир содрогнется.\n- Наполеон Бонапарт"

 LOADING_TIP_90:0 "Поговорите со мной о договорах! Расскажите мне о Лиге Наций! Каждая великая держава в Европе по договору обязалась сохранить Бельгию. Это была Лига Наций, но она провалилась.\n- Эдвард Карсон"

 LOADING_TIP_91:0 "Не мы устроили пожар, но когда мы уйдем, он все равно будет гореть, и дальше, и дальше.\n – Билли Джоэл"

 LOADING_TIP_92:0 "Бог наделил британскую расу всемирной империей, чтобы они могли исполнить Его суверенную цель в мире. Победы, которые вы одержите над язычниками, — это победы благороднейшей души человека.\n — Неизвестный капеллан."

 LOADING_TIP_93:0 "Наш полк был принесён в жертву ради чести Белграда и Отечества. Поэтому вам больше не нужно беспокоиться о своих жизнях: их больше нет. Итак, вперед к славе! За Короля и Отечество! Да здравствует король, да здравствует Белград!\n - Драгутин Гаврилович"

 LOADING_TIP_94:0 "Честно говоря, я наслаждался войной.\n- Адриан Картон де Виарт"

 LOADING_TIP_95:0 "Нейтралитет – это не политика.\n – Элефтериос Венизелос."

 LOADING_TIP_96:0 "Не волнуйтесь, люди. Это будет нехорошо. \n- Никола Пашич"

 LOADING_TIP_97:0 "Каждому настоящему президенту необходимо читать оппозиционные издания, потому что он заранее знает, что пишут его собственные.\n - Никола Пашич"

 LOADING_TIP_98:0 "На войне легко потерять голову, но легко и лицо потерять. \n- Войвода Живоин Мишич"

 LOADING_TIP_99:0 "Я не несу ответственности за то, что наша столица расположена там, где должен быть наш пограничник \n- Радомир Путник"
 
