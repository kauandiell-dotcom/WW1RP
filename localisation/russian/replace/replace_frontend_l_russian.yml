 FE_DIFFICULTY_HARD_TOOLTIP:0 "§L"Я молод, мне двадцать лет; однако я не знаю ничего о жизни, кроме отчаяния, смерти, страха и бессмысленной поверхностности, наброшенных на бездну печали. Я вижу, как народы противостоят друг другу и молча, по незнанию, по глупости, послушно, невинно убивают друг друга."§!"