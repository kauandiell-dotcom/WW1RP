 GER_idea_abwehr_support:0 "German Gold"
 GER_idea_abwehr_support_desc:0 "The revolution is sponsored by the German authorities. Among the leaders of the Bolsheviks there are many agents of Abwehr and they successfully manage to hide this fact from revolutionaries."
 GER_idea_abwehr_supports_revolution:0 "Funds Russian revolutionaries"
 GER_idea_freikorps:0 "Nationalist Freikorps"
 GER_idea_freikorps_desc:0 "Since the German army was reduced, the German soldiers are forming own volunteer corps to preserve the integrity of the nation."
 GER_idea_kiel_mutiny:0 "Kiel Mutiny"
 GER_idea_kiel_mutiny_desc:0 "The suppression of the uprising of sailors in Kiel was reflected in the revolutionary movement. Society has split. Hard times have come for Germany."
 GER_idea_stuggle_for_power:0 "Struggle for Power"
 GER_idea_stuggle_for_power_desc:0 "The German Republic is not stable, the political forces of the socialists, communists, even conservatives are now fighting in bloody struggle to establish their own power."
 GER_idea_OHL:0 "General Staff"
 GER_idea_OHL_desc:0 "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. The influence of Staff is so great that it can become a dangerous political force in the country."
 GER_idea_OHL1:0 "General Staff"
 GER_idea_OHL1_desc:0 "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. The influence of Staff is so great that it can become a dangerous political force in the country."
 GER_idea_OHL2:0 "General Staff"
 GER_idea_OHL2_desc:0 "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. The influence of Staff is so great that it can become a dangerous political force in the country."
 GER_idea_OHL3:0 "General Staff"
 GER_idea_OHL3_desc:0 "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. The influence of Staff is so great that it can become a dangerous political force in the country."
 GER_idea_OHL_dictatorship:0 "General Staff Dictatorship"
 GER_idea_OHL_dictatorship_desc:0 "The Oberste Heeresleitung (OHL) is the highest echelon of command of the army of the German Empire. Virtually all internal affairs of the country under the management of OHL. Generals are able to impose their will even on Kaiser, which can undermine the authority of the ruler."
 GER_idea_norddeutscher_bund_legacy:0 "Norddeutscher Bund Legacy"
 GER_idea_norddeutscher_bund_legacy_desc:0 "Germany is indestructible and indivisible! The legacy of past years for many centuries to come determined the greatness of the German Empire."
 GER_idea_gross_kaiserreich:0 "Gross Kaiserreich"
 GER_idea_republican_spirit:0 "Republican Spirit"
 GER_idea_republican_spirit_desc:0 "Germany is ready to sacrifice imperialist ambitions in order to create an ideal democratic society."
 GER_idea_prussian_militarism:0 "Prussian Militarism"
 GER_idea_prussian_militarism_desc:0 "The German army will parade from Berlin to the enemy capital. As did our fathers and grandfathers."
 GER_idea_isolation_of_adriatic_sea:0 "Isolated Adriatic Sea"
 GER_idea_isolation_of_adriatic_sea_desc:0 "Germany and Italy exert economic pressure by blocking trade routes in the Adriatic. Looks like they're getting ready for something."
 GER_idea_german_military_advisors:0 "German advisors"
 GER_idea_german_military_advisors_desc:0 "The German headquarters took over part of the command functions in our army."
 GER_idea_hindenburg_programme:0 "Hindenburg Programme"
 GER_idea_militarize_youth:0 "Militarization of Youth"
 GER_idea_wilhelm_ii:0 "Kaiser Wilhelm II"
 GER_idea_wilhelm_ii_desc:0 "We Wilhelm, by the Grace of God, King of Prussia, Margrave of Brandenburg, Sovereign and Supreme Duke of Silesia, Grand Duke of the Lower Rhine and Posen, Duke of Saxony, Westphalia and Pomerania, of Lüneburg and Bremen, of Holstein, Schleswig and Lauenburg, Burgrave of Nuremberg, Landgrave of Hesse, Prince of East Frisia, Osnabrück and Hildesheim, of Nassau and Fulda, Count of Hohenzollern, Lord of Frankfurt."
