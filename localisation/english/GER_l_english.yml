 GER_idea_abwehr:0 "Kaiserliche Abwehr"
 GER_idea_central_powers_joint_staff:0 "Joint Staff of the Central Powers"
 GER_idea_central_powers_joint_staff2:0 "Joint Staff of the Central Powers"
 GER_idea_aviation_cult:0 "Aviation Cult"
 GER_idea_colonial_elite:0 "German Colonial Elite"
 tokyo_pact:0 "§YGerman-Japanese Pact§!"
 GER_legation_profits:0 "Legation Profits"
 GER_legation_profits_desc:0 "We have set up the International Concession Government, and we are reaping the rewards."
 SHL_kiel_canal_profits:0 "Kaiser-Wilhelm-Canal Profits"
 SHL_kiel_canal_profits_desc:0 "The Kaiser-Wilhelm-Canal is a vital area for Baltic trade, and we are reaping the benefits greatly."
 GER_german_staff_planning_auh:0 "German Staff Planning"
 GER_german_staff_planning_auh_desc:0 "German headquarters focused on our front."
 GER_german_staff_planning:0 "Joint Planning"
 GER_german_staff_planning_desc:0 "Our headquarters sent several high-ranking generals to the location of the allied army."
 GER_state_in_blockade:0 "State in Blockade"
 GER_state_in_blockade_desc:0 "The country is in an enemy blockade. They expect total economic isolation to provoke famine undermine our morale."
 GER_quenched_militarism:0 "Quenched Militarism"
 GER_quenched_militarism_desc:0 "Victory always comes at a cost, and the Weltkrieg was unlike any war the world had ever seen. While we may have been victorious, that didn't bring our boys home. Our families still remember that pain clearly and are not eager to experience it again."
 GER_mitteleuropa:0 "Mitteleuropa"
 GER_mitteleuropa_desc:0 "We are the leader of Mitteleuropa, an economic cooperation pact that helps us project power."
 GER_reformed_economy:0 "Reformed Economy"
 GER_representative_reform_idea:0 "Representative Reform"
 GER_idea_hitler_arrested:0 "Beer Hall Putsch Failed"
 GER_idea_hitler_arrested_desc:0 "Adolf Hitler was arrested for the failure of the Munich Beer Hall putsch. But his supporters are still out there, and he has been seen as a true patriot even in court."
 GER_ss_idea:0 "Schutzstaffel"
 GER_ss_idea_desc:0 "Schutzstaffel(SS) is the major paramilitary organization under Adolf Hitler and the Nazi Party in Nazi Germany."
 GER_idea_colonial_exploitation_interwar:0 "Colonial Exploitation"
 GER_idea_colonial_exploitation_interwar_desc:0 "The Colonial Administration is cruelly efficient in extracting as much from here as they possibly can. Though small reforms have been made here or there, at the end of the day all we are to the Mainlanders is a vast money trough for them to stick their dirty, greedy paws into."
 GER_dysfunctional_government:0 "Dysfunctional Government"
 GER_dysfunctional_government_desc:0 "The Government of [ROOT.GetName] is incredibly poorly run, with an autonomous military administration and a neglected civilian administration. Corporations run wild and corruption is rife."
 GER_roter_frontkampferbund:0 "Roter Frontkampferbund"
 GER_political_commissars_idea:0 "Political Commissars"
 GER_military_out_of_control:0 "Military Out-of-control"
 GER_military_out_of_control_desc:0 "Our troops have yet to embrace the defeat of the Great War. They support the lost empire rather than our republic and are quite conservative. They cannot be controlled without negotiations with Head of the Army Command Hans von Seeckt."
 GER_holy_order:0 "Holy Order"
 ger_famine:0 "The Turnip Winter"
 ger_famine_desc:0 "The only food we have is Hindenburg bread..."
 ger_famine_early:0 "Food Shortages"
 ger_famine_early_desc:0 "Soldiers and citizens of [ROOT.GetNameDef] are starving now due to enemy naval blockades..."
 GER_idea_ludendorff_offensive:0 "Ludendorff Offensive"
 GER_idea_ludendorff_offensive_desc:0 "Our army is doing its best to break through the Western Front, which has been stuck in trench warfare. As if this was the last time..."
 GER_idea_treaty_of_rapallo:0 "Treaty of Rapallo"
 GER_idea_treaty_of_rapallo_desc:0 "Toast to our German-Soivet friendship!"
 GER_idea_kapp_illegitimate_government:0 "Illegitimate Government"
 GER_idea_kapp_illegitimate_government_desc:0 "The current rulling government is not recongnised legitimate nationalwide. There would be keep storming political unrests until we stablize the situation."
 GER_idea_sino_german_company:0 "Sino-German Company"
 GER_idea_sino_german_company_desc:0 "Toast to our Sino-German friendship!"
 GER_financial_crisis_of_agadir:0 "Financial Crisis of Agadir"
 GER_idea_default:0 "Default"
 GER_idea_default_desc:0 "No way to pay these reparations. We are broke now."
 GER_idea_default_tt:0 "§YReparation Paying is all stopped and you'll have no modifiers affected on by the Reparation idea.§!"
 GER_idea_hyperinflation:0 "Hyperinflation"
 GER_idea_naval_arms_race_desc:0 "More dreadnoughts! Bigger guns!"
 GER_victors_of_wwi:0 "Victors of the Weltkrieg"
 GER_victors_of_wwi_desc:0 "We are the undisputed victors of the Weltkrieg and our place in the sun all but guaranteed."
 GER_support:0 "Gained German Support"
 
 # Decisions:
 
 GER_great_war:0 "The Great War"
 GER_great_war_desc:0 "The Great War will globally change the fate of nations around the world. If Faction Leader surrenders, the winners must decide on what conditions they are ready to make peace.\n\n§GVictorious Faction will get claimed states and cores after the Conference§!."
 GER_schlieffen_plan:0 "Schlieffen Plan"
 GER_dual_alliance:0 "Honour Dual Alliance"
 GER_dual_alliance_desc:0 "Our alliance with Austria-Hungary means that we promise to support each other in case of attack by Russia. We must help our Austrian friends defeat Russia."
 GER_schliffenmoltkeplan:0 "Schlieffen-Moltke Plan"
 GER_schliffenmoltkeplan_desc:0 "Schlieffen-Moltke Plan means that we will attack Belgium and Luxembourg to march straight into Paris."
 GER_schliffen1905plan:0 "Schlieffen Plan"
 GER_schliffen1905plan_desc:0 "The Schlieffen Plan suggests that we march onto the gates of Paris via an invasion through Belgium, as we cannot get through France's fortifications without irreplaceable casualties and losses. We will trample this downtrodden, backwards country."
 GER_armistice:0 "Offer Surrender Terms to Entente"
 GER_armistice_desc:0 "This war was a failure. The army is not able to fight longer, we need to immediately request a truce. I'm afraid the Entente will require huge reparations."
 GER_armitice_flag:0 "Offer Surrender Terms to France"
 GER_german_offensive_mission:0 "Offensive on Russia"
 GER_german_offensive_mission_desc:0 "The Bolsheviks seem to be in quite the pickle with their civil war, however, we do not care the slightest. If the Bolsheviks are not willing to sign a peace, if the wartorn Russians still refuse to make peace, we will march onto the gates of Moscow, and subjugate all of Russian Europe under our boot."
 GER_german_offensive_mission_tt:0 "Germany will attack the Bolsheviks"
 GER_capitulation:0" Germany surrenders "
 GER_decision_central_powers_conference:0 "Central Powers Conference"
 GER_misison_central_powers_conference:0 "Conference in progress"
 GER_italian_request:0 "Invite [ITA.GetName]"
 GER_romanian_request:0 "Invite [ROM.GetName]"
 GER_danish_request:0 "Invite [DEN.GetName]"
 GER_swedish_request:0 "Invite [SWE.GetName]"
 GER_dutch_request:0 "Invite [HOL.GetName]"
 GER_norse_request:0 "Invite [NOR.GetName]"
 GER_swiss_request:0 "Invite [SWI.GetName]"
 GER_agadir_crisis:0 "Agadir Crisis"
 agadir_crisis:0 "Agadir Crisis"
 agadir_crisis_ends:0 "Agadir Crisis ends"
 agadir_crisis_send_demands:0 "Concessions for Agadir"
 agadir_crisis_escolation:0 "Agadir Crisis escalation"
 GER_misison_agadir_crisis:0 "Relevance of the crisis"
 GER_agadir_crisis_send_demands:0 "Send demands"
 GER_agadir_crisis_escalation:0 "Crisis escalation"
 GER_decison_colonial_exploitation:0 "Colonial Exploitation"
 GER_decision_joint_staff:0 "Central Powers Joint Staff"
 GER_control_austrian_planning:0 "Control Austrian Planning"
 GER_decision_federal_army:0 "Bundeswehr"
 GER_organize_civil_defense:0 "Organize Zivilschutz"
 GER_federal_corps_saxony:0 "Raise Bundeskorps in Saxony"
 GER_federal_corps_bavaria:0 "Raise Bundeskorps in Bavaria"
 GER_federal_corps_hannover:0 "Raise Bundeskorps in Hannover"
 GER_federal_corps_mecklenburg:0 "Raise Bundeskorps in Mecklenburg"
 GER_decision_abwehr_operations:0 "Abwehr Operations"
 GER_support_separatism_in_warsaw:0 "Support Separatism in Warsaw"
 GER_support_separatism_in_helsenki:0 "Support Separatism in Finmark"
 GER_support_separatism_in_lithuania:0 "Support Separatism in Lithuania"
 GER_support_separatism_in_latvia:0 "Support Separatism in Latvia"
 GER_support_separatism_in_estonia:0 "Support Separatism in Estonia"
 GER_decision_puppet_kingdoms:0 "Puppet Monarchies"
 GER_form_poland:0 "Form Kingdom of Poland"
 GER_form_lithuania:0 "Form Lithuania"
 GER_form_courland:0 "Form Courland"
 GER_form_baltic_duchy:0 "Form Baltic Duchy"
 GER_form_georgia:0 "Form Kingdom of Georgia"
 GER_unite_baltics:0 "Unite the Baltics"
 GER_help_white_russia:0 "Help White Russia"
 GER_help_white_russia_desc:0 "While Lenin and his Bolsheviks did secure our victory on the Eastern Front with their sabotage of the war effort and the subsequent coup, their regime and antics are no longer needed. Their ideals of Communism and World Revolution threaten the very foundation of a German European order, and thus directly contradict our hold of power. It's better to neutralise this threat on our Eastern flanks, and turn the red tide."
 GER_help_nationalist_france:0 "Help Nationalist France"
 GER_help_nationalist_france_desc:0 "France is in turmoil after their defeat in the Great War. And while we care not for France's internal politics, the Communards of Paris pose a unique threat to our position in Europe. The Communards hold a particularly expansionist and aggressive stance in their philosophy, and they are determined to return France to her former glory. If we preemptively strike, we can further weaken our rival and force the pathetic remnants of the old French regime back in power."
 GER_german_east_asia:0 "Form Ostasien"
 GER_german_east_asia_expand:0 "Expand Ostasien"
 GER_OST_demand_annex:0 "Offer the [FROM.GetAdjective] Our Protection"
 GER_decision_mittelafrika:0 "Form Mittelafrika"
 GER_decision_mittelafrika_desc:0 "The vast African colonies obtained after the victory of the Great War can be united under a single colonial administration, Mittelafrika. This will bring glory and wealth to our empire."
 GER_decision_expand_mittelafrika:0 "Expand Mittelafrika"
 GER_decision_military_advisers:0 "Military Advisors"
 NFA_sue_for_peace_GER:0 "Declare our defeat and embrace the fate"
 NFA_sue_for_peace_GER_desc:0 "France was completely defeated. There is no more future."
 FRC_sue_for_peace_NFA:0 "Surrender to the Imperialists"
 NFA_third_franco_german_war_tt:0 "§RThe Kingdom of France, ruled by the German monarch, will be established...§!"
 GER_anti_war_revolt:0 "Nationwide Anti-war Protests"
 GER_anti_war_revolt_desc:0 "It seems to be a bad choice to wage a war too hard just after the bloody Great War. Citizens and soldiers were inflamed by the ongoing war. Large-scale protests are taking place in all major cities."
 GER_anti_war_revolt_tt:0 "§RThe anti-war protests will turn into massive revolt with an unprecedented scale!§!"
 GER_advisors_FROM:0 "Send Advisors to [FROM.GetName]"
 GER_afghan_expeditions:0 "Expeditions to Afghanistan"
 GER_niedermayerhentig_recruit:0 "Recruit Niedermayer and von Hentig"
 GER_niedermayer_hentig_recruited:0 "Niedermayer and von Hentig is recruited"
 GER_ottoman_allow_afg:0 "Allow Ottoman soldiers to join the expedition"
 GER_begin_afghan_expedition:0 "Begin an expedition to Afghanistan"
 GER_tribal_approval_AFG:0 "Get the approval of Afghan tribes"
 GER_offer_draft_treaty_AFG:0 "Offer our draft treaty to the Emir"
 GER_request_eq_CMR:0 "Request Equipments to [CMR.GetName]"
 GER_request_eq_TOG:0 "Request Equipments to [TOG.GetName]"
 GER_request_eq_TZN:0 "Request Equipments to [TZN.GetName]"
 GER_request_eq_NMB:0 "Request Equipments to [NMB.GetName]"
 GER_decision_paying_reparations:0 "Paying Reparations"
 GER_decision_reparations:0 "Pay the Reparations"
 GER_decision_reparations_desc:0 "The German Empire is defeated in the Great War. Entente demanded that we must pay back the war reparation of 132 billion marks in gold. Until all reparations are paid, our economy will not be able to recover from the mire of defeat..."
 GER_decision_reparations_2:0 "Pay the Reparations"
 GER_decision_reparations_2_desc:0 "As we are unable to pay the reparations agreed in the Treaty of Versailles due to extreme inflation and economic failure, the conditions is relaxed by Entente. As a result, Reichsbank is re-established in [GER.GetNameDef], and a loan of 800 million marks is provided to us."
 GER_decision_reparations_3:0 "Pay the Reparations"
 GER_decision_reparations_3_desc:0 "Taking into account the global economic downturn and the economic failure in Germany, the total amount of reparations has been reduced to 35.8 billion gold marks, and installment payments is decided for 59 years."
 GER_decision_moratorium:0 "Moratorium"
 GER_decision_moratorium_desc:0 "We will not pay any reparations for now. Maybe decades later?"
 GER_decision_moratorium_tt:0 "§RWithout the Great Depression idea, French will get a wargoal against our country.§!"
 GER_interwar_reichspakt_category:0 "Reichspakt"
 GER_interwar_reichspakt_category_desc:0 "The German dominance on the Central Europe is slowly gaining it's boosting power to establish the strongest German sphere ever in history. To achieve our ideal, we can invite countries which are strategically important to Reichspakt and befriend with them."
 GER_interwar_invite_in_reichspakt:0 "Invite [FROM.GetNameDef] to the [ROOT.GetFactionName]"
 GER_prussian_blue_category:0 "Prussian Blue"
 GER_prussian_blue_category_desc:0 "The German Empire was defeated in the Great War. And they were torn into smaller countries by the victorious countries. This result will lead to many extremes. And the German people will one day try to unite again."
 BAY_reunite_germany:0 "Reunite German Nation"
 BAY_reunite_germany_desc:0 "The German people is reunited under the red flag once again! Finally the German revolutions of 1848 is completed by our firm hands!"
 GER_prussia_reunite_germany:0 "Three Hurrahs For Germany!"
 GER_prussia_reunite_germany_desc:0 "The fatherland is under our control and ready to be reunited as the one German nation once again!"
 prussian_blue:0 "Prussian Blue"
 treaty_of_berlin:0 "Treaty of Berlin has been signed"
 reunite_germany_tt:0 "All of German successor states except [RHN.GetName] has been subjugated or annexed by §Y[ROOT.GetNameWithFlag]§!."
 GER_prussian_russian_withdrawal:0 "Entente Withdrawal on German Occupations"
 prussian_withdrawal:0 "Entente has withdrew from German occupations"
 GER_ludendorff_offensive:0 "Ludendorff Offensive"
 GER_ludendorff_offensive_desc:0 "The war situation is getting increasingly unfavorable. If we go on like this, we can't stand it any longer. If we decide to launch an all-out offensive on the entrenched Western Front and reach Paris, the capital of the enemy country, at once, we can sit at the peace treaty table from a more advantageous position.\n§RBut if this offensive fails, we may lose everything.§!"
 GER_ludendorff_offensive_tt:0 "§RThis decision may determine [GER.GetNameDef]'s fate. Choose carefully.§!"
 GER_demand_hessen:0 "Demand Hessen"
 GER_demand_hessen_desc:0 "In addition to the previously occupied territories, the French forcibly occupied Hesse and gave it to their puppet state, the Confederation of Rhine. We can make diplomatic contact with France and earnestly request that it be returned."
 GER_prussian_support_radicalism:0 "Support Radicalism"
 GER_prussian_support_radicalism_desc:0 "Due to the difficult situation of the country, people are supporting extremist ideology."
 GER_prussian_appoint_hitler:0 "March on Berlin"
 GER_prussian_appoint_hitler_desc:0 "Adolf Hitler's National Socialist movement is gaining popularity. They want to revive the German people from the depths of defeat. Some classify them as far-left and some as far-right, because of their extreme and unknown ideas, but maybe they can make Germany great again.\nAnd with a little help, they will come to power bloodless."
 GER_landsturm_deployment:0 "\nAllow the deployment of §Y"Landsturm"§! divisions made up of §Y9 infantry§! and a §Ysupport company§!."
 GER_decision_form_landsturm:0 "Landsturm Formation"
 GER_mobilization_effort:0 "Mobilization Effort"
 GER_reserve_guns:0 "Provide Reserve Rifles"
 GER_reserve_guns_desc:0 "We have old rifle reserves in our warehouses. Although they are dated, these weapons can still be useful to us."
 GER_form_landsturm_brigades:0 "Deploy 5 Landsturm Divisions"
 GER_form_landsturm_brigades_desc:0 "The "landsturm" divisions come from the mobilization of men aged 30 to 50 years. These inexperienced and poorly performing auxiliary groups remain useful in support in low-risk areas."
 back_in_200_days:0 "\nThe decision will show up again in §Y200 days§!."
 back_in_190_days:0 "\nThe decision will show up again in §Y190 days§!."
 back_in_280_days:0 "\nThe decision will show up again in §Y280 days§!."
 back_in_120_days:0 "\nThe decision will show up again in §Y120 days§!."
 back_in_160_days:0 "\nThe decision will show up again in §Y160 days§!."
 ifc_wont_accept:0 "§RThe IFC will not accept our demands if our debt is higher than 15% consumer goods!§!"
 GRE_ifc_event_decision:0 "We will get an event based on the amount of debt you have §Grepaid.§!"
 GER_mobilization_campaign:0 "Mobilization Campaign"
 GER_mobilization_campaign_desc:0 "The recruitment of our reserves affects the morale of the army. The government needs to boost morale by promising bonuses, benefits and various other motivational acts."
 GER_mission_famine_timer:0 "The Winter of Frustration"
 GER_mission_famine_timer_desc:0 "Currently, [ROOT.GetNameDef] is engaged in the Great War, and manpower to become self-sufficient in food has also been put into frontlines and production of munitions. In normal times, importation could cover this, but because of the naval blockade, now there is absolutely no way to get more food."
 GER_mission_famine_timer_early:0 "Until Winter Comes"
 GER_mission_famine_timer_early_desc:0 "[ROOT.GetNameDef] is under the naval blockade. No major shortage of supplies yet, but if the war goes on too long, stockpiles will slowly run out. Especially if food starts to run low, soldiers can no longer fight, and people's patience and war support is going to plummets."
 GER_delay_famine_mission:0 "Feed the People"
 GER_delay_famine_mission_desc:0 "Once we focused all of our resources on the war effort, the state began to run out of food for domestic consumption. Perhaps we could divert some of it back to civilian use to quell discontent, but of course that's only a band-aid..."
 GER_reunifications_wars_timer:0 "German State of Emergency"
 GER_reunifications_wars_timer_desc:0 "The disarray and downfall of Germany is a state of emergency that cannot be ignored. Reunification Wars are inevitable."
 GER_kapp_putsch_timer:0 "Discontent right wing"
 GER_kapp_putsch_timer_desc:0 "The right wing and nationalists in the country are deeply discontent with the current situation and the government. A small flame shall spread into a awful fire."
 GER_kapp_putsch_timer_tt:0 "Compliance with the Treaty of Versailles requires to ban the nationalist paramilitaries."
 GER_fix_belgium_supply:0 "Build Supply Lines to Belgium"
 GER_fortifications:0 "Frontline Fortifications"
 GER_fortifications_desc:0 "The modern warfare means endless trenches, dense barbed wires, solid concrete fortifications, and brutal machine gun deployments. In particular, to face against with the French, we must build and prepare strong fortifications to block the enemy diversionary maneuvers and strengthen our defenses on valuable points. Every inch of land is SHALL NOT BE LOST!"
 GER_fund_engineering_corps:0 "Fund Engineering Corps"
 GER_fund_engineering_corps_desc:0 "Setting up the defense structures is a complex undertaking. With the help of state subsidies, it would be possible to speed up the fortification works."
 GER_defensive_line_in_aisne:0 "Fortify Aisne"
 GER_defensive_line_in_aisne_desc:0 "Building a defensive line along the banks of the Aisne River makes it easy to have excellent fortifications guarded up by natural structures."
 GER_defensive_line_in_aisne_tt:0 "Adds §Y3 Land Fort§! in §Y[29.GetName].§!"
 GER_defensive_line_in_ypern:0 "Fortify Ypern"
 GER_defensive_line_in_ypern_desc:0 "Setting up a defense line in the Northwestern Belgium shall stop enemy maneuvers along the coast."
 GER_defensive_line_in_ypern_tt:0 "Adds §Y2 Land Fort§! in §Y[865.GetName].§!"
 GER_defensive_line_in_arras:0 "Fortify Arras"
 GER_defensive_line_in_arras_desc:0 "Set up trenches and barbed wires in the plains of Northern France to stop the enemy rapid advance. Let no one pass there!"
 GER_defensive_line_in_arras_tt:0 "Adds §Y2 Land Fort§! in §Y[29.GetName].§!"
 GER_defensive_line_in_compiegne:0 "Fortify Compiegne"
 GER_defensive_line_in_compiegne_desc:0 "Building a defensive line along the banks of the Oise River makes it easy to have excellent fortifications guarded up by natural structures."
 GER_defensive_line_in_compiegne_tt:0 "Adds §Y2 Land Fort§! in §Y[785.GetName].§!"
 GER_defensive_line_in_gent:0 "Fortify Gent"
 GER_defensive_line_in_gent_desc:0 "The defenses of Ost-Flanders must be fortified up to stop the enemy from advancing on Brussels and forcing our forces in Belgium to retreat."
 GER_defensive_line_in_gent_tt:0 "Adds §Y2 Land Fort§! in §Y[6.GetName].§!"
 GER_defensive_line_in_charleroi:0 "Fortify Charleroi"
 GER_defensive_line_in_charleroi_desc:0 "The defenses of Wallonia must be fortified up to stop the enemy from advancing on Brussels and forcing our forces in Belgium to retreat."
 GER_defensive_line_in_charleroi_tt:0 "Adds §Y2 Land Fort§! in §Y[6.GetName].§!"
 GER_defensive_line_in_brussel:0 "Fortify Brussel"
 GER_defensive_line_in_brussel_desc:0 "The loss of Belgium is catastrophic for the war effort against the French. Brussel must be defended!."
 GER_defensive_line_in_brussel_tt:0 "Adds §Y2 Land Fort§! in §Y[6.GetName].§!"
 GER_defensive_line_in_argonnen:0 "Fortify Argonnen"
 GER_defensive_line_in_argonnen_desc:0 "The Forest of Argonne is a long strip of mountainous and wild woodland in northeastern France, approximately 200 km east of Paris. If we lose there, the gate to Luxembourg opens. That means we must secure the forest with heavy fortifications."
 GER_defensive_line_in_argonnen_tt:0 "Adds §Y2 Land Fort§! in §Y[34.GetName].§!"
 GER_defensive_line_in_verdun:0 "Fortify Verdun"
 GER_defensive_line_in_verdun_desc:0 "Verdun is situated on both banks of the river Meuse, in the northern part of the Meuse department. It was founded by the Gauls, with a place name meaning "strong fort" in Gaulish. As it was a strategic point back then, this is also an important fortress for Germany to fight against the French troops."
 GER_defensive_line_in_verdun_tt:0 "Adds §Y1 Land Fort§! in §Y[863.GetName]§! and §Y1 Land Fort§! in §Y[17.GetName].§!"
 GER_restore_schantung_bahn_control:0 "Restore Schantung-Bahn Control in [FROM.GetName]"
 GER_restore_schantung_bahn_control_desc:0 "The Qingdao-Jinan Railway is currently occupied by [FROM.GetNameDef], we need to restore control of it immidietly."
 GER_create_paris_gun:0 "Build Lange 21-cm-Kanone in 38-cm-Schießgerüst "Paris-Geschütz""
 GER_locarno_treaties_timer:0 "Peace for Our Time?"
 GER_hre_cat:0 "Revive the Holy Roman Empire"
 GER_hre_cat_desc:0 "The splendor of our Kaiser knows no bounds, and neither do the borders of our nation. These have now grown to encompass the limits of the old Holy Roman Empire, and the nations in our way are no longer in a position to object to our policies, the Kaiser has decreed that the current opportunity shall be seized, and that the nation shall embrace its role as the spiritual successor of the Holy Roman Empire. Aquila Elegit Iovis Omnia Vincit!"
 GER_german_east_asia_cat:0 "Our Properties in the East Asia"
 GER_german_east_asia_cat_desc:0 "After our brave victory in the Great War, the French government was humiliated by the peace treaty, their armies disheartened and their government humbled, in keeping with their tradition, revolutionary sentiment started to grow and the discomfort for their current situation stirred the people to take action, now france is not able to secure their oversea assets so that has their overseas colonies abandoned to their own devices, one such colony in the Far East which is vulunerable over our good intention to have there.\nIt is also proposed that the expansion of colonial business in the East Asia. Our colonialists presented a goal of achieving a huge colonial management system by incorporating a large number of German occupied territories in East Asia. This, if successful, will bring enormous wealth to our country, but if it fails, it could lead to terrible consequences such as chaos and colonial collapse."
 GER_instant_react_to_agadir:0 "Send SMS Panther in Agadir, Morocco"
 GER_instant_react_to_agadir_tt:0 "This decision is helpful when you are doing another focus but no time to do the focus §YAgadir Crisis§!. With this you will spend more §Y£pol_power political power§! than doing the focus."
 GER_annex_new_east_prussia:0 "Annex the New East Prussia"
 GER_annex_new_east_prussia_desc:0 "There was a time, a century ago, when the Kingdom of Prussia gained new territory from Poland, beyond East Prussia. The territory between East Prussia and the Vistula, Bug, and Neman rivers was called New East Prussia (Neuostpreußen), and if we prevail in the Great War, it should rightfully belong to Prussia, [ROOT.GetNameDef]."
 GER_add_submarines:0 "Lay Down the U-Boots"
 GER_add_submarines_desc:0 "This decision is availabe only in §Yeasiest difficulty§! or §Ydebug mode§!."
 GER_mission_before_the_leaves_fall_desc:0 ""You will be home before the leaves have fallen from the trees.""
 before_the_leaves_fall:0 "Before the Leaves Fall"
 before_the_leaves_fall_flag:0 "The Great War has ended in less than a few weeks"
 before_the_leaves_fall_failed:0 "The Second Franco-German War has escalated into the Great War"