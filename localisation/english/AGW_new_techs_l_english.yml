 jaeger:0"Jaeger Infantry"
 jaeger_desc:0"Jaegers are forces that specialize in surviving the cold and the wilderness of the boreal forest. Usually, these troops are native to their territory and take longer to train.\n \n§GThis unit type does not count toward the Special Forces cap but instead requires 5 Support Equipment per Battalion§!"

 jungletroop:0"Jungle Infantry"
 jungletroop_desc:0"Jungle Specialists are trained to sustain the harsh conditions of Jungle Warfare and challenge the Enemy on their terms.\n \n§GThis unit type does not count toward the Special Forces cap but instead requires 5 Support Equipment per Battalion§!"

 desertinfantry:0"Desert Infantry"
 desertinfantry_desc:0"Combat in the Desert ranges exposes troops to many perils but sometimes cannot be avoided. We can minimize these risks by providing our soldiers with specialized training for this environment.\n \n§GThis unit type does not count toward the Special Forces cap but instead requires 5 Support Equipment per Battalion§!"

 shocktroop:0"Shock Troops"
 shocktroop_desc:0"Shock Troops can smash into Enemy lines to achieve a breakthrough. This is almost essential to any form of Deep-Battle and can significantly contribute to throwing the defenders into disarray."

 mot_shocktroop:0 "Motorized Shock Troops"
 mot_shocktroop_desc:0 "Motorized Shock Troops can smash into enemy lines to achieve a breakthrough. This is almost essential to any form of Deep-Battle and can significantly contribute to throwing the Defenders into disarray."
 mech_shocktroop:0 "Mechanized Shock Troops"
 mech_shocktroop_desc:0 "Mechanized Shock Troops utilize exploitation and mobility, able to quickly drive into a breakthrough, encircle a part of enemy force and defend there while the front is advancing to squeeze pocketed enemy."

