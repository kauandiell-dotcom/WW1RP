 marines_terrain_training_amf:0 "Marines Terratin Training I"
 marines_terrain_training_amf_desc:0 "The Marines' fighting skills on unorthodox terrain is a key element for any naval invasion or a river crossing. We should put resources into training our troops to fight and traverse through this terrain effectively."
 
