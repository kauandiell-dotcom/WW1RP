 desertinfantry_at2_desc:0"The sandy mountains of the desert can be treacherous to your regular Infantry. To cope in this environment, we can train our Desert Infantry to gain the upper hand in the desert.\n \n§GThis unit type does not count toward the Special Forces cap but instead requires 5 Support Equipment per Battalion§!"
