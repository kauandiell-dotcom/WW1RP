 infantry_terrain_training_orient:0 "Infantry Terrain Training (Southern) I"
 infantry_terrain_training_orient_desc:0 "Performing combat and strategic relocation on southern terrain proves to be a very difficult task for a modern army. We should learn these lands, its history and the tricks natives used to fight better and move faster."
 
